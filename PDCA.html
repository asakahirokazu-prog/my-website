<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>無限ループ PDCA チェーン</title>

    <!-- ♾️ 文字として直接描画するくっきり綺麗なワンソースSVGファビコン -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E♾%EF%B8%8F%3C/text%3E%3C/svg%3E">

    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
        body { background-color: #f0f2f5; margin: 0; padding: 12px; padding-bottom: 90px; color: #333; -webkit-text-size-adjust: 100%; overflow-x: hidden; }
        
        .container { max-width: 800px; margin: 0 auto; width: 100%; position: relative; }
        
        /* プロジェクトタイトルヘッダー（タイトルのみ表示） */
        .project-header { background: #2c3e50; color: white; padding: 14px 16px; border-radius: 12px; margin-bottom: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); text-align: center; }
        .project-title { font-size: 16px; font-weight: bold; margin: 0; word-break: break-all; line-height: 1.4; }

        /* 画面左下の容量確認テキストリンク */
        .storage-link-wrapper { position: fixed; bottom: 62px; left: 16px; z-index: 890; }
        .storage-link { font-size: 12px; color: #7f8c8d; text-decoration: underline; cursor: pointer; background: rgba(240, 242, 245, 0.9); padding: 2px 6px; border-radius: 4px; }
        .storage-link:hover { color: #34495e; }

        /* 画面下部固定の操作バー */
        .bottom-controls { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(5px); border-top: 1px solid #dcdde1; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; z-index: 900; box-shadow: 0 -2px 8px rgba(0,0,0,0.05); }
        .control-group-left, .control-group-right { display: flex; align-items: center; gap: 6px; }
        
        /* 世代切り替えナビゲーション */
        .pagination-nav { display: flex; align-items: center; gap: 6px; }
        .page-indicator { font-size: 12px; font-weight: bold; color: #2c3e50; padding: 0 2px; min-width: 45px; text-align: center; }
        
        .btn-page { background: #34495e; color: white; border: none; width: 26px; height: 26px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
        .btn-page:active:not(:disabled) { background: #2c3e50; }
        .btn-page:disabled { background: #bdc3c7; cursor: not-allowed; opacity: 0.6; }

        /* ミニボタン共通設定 */
        .btn-mini { border: none; padding: 6px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 12px; text-align: center; display: inline-flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
        
        .btn-new { background: #7f8c8d; color: white; }
        .btn-new:active { background: #6c7a89; }
        
        .btn-backup { background: #27ae60; color: white; }
        .btn-backup:active { background: #219653; }

        .btn-restore { background: #2980b9; color: white; }
        .btn-restore:active { background: #2471a3; }

        /* カードコンテナ */
        #chainList { position: relative; width: 100%; }

        /* PDCAカードのデザイン */
        .pdca-card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #e1e8ed; width: 100%; }
        
        /* カード上部のヘッダー構成 */
        .card-header-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .cycle-info-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .cycle-badge { display: inline-block; background: #34495e; color: white; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 12px; flex-shrink: 0; }
        .cycle-date { font-size: 11px; color: #7f8c8d; font-weight: 500; }
        .card-project-title { font-size: 14px; font-weight: bold; color: #2c3e50; word-break: break-all; }

        .step-box { margin-bottom: 12px; padding: 12px; border-radius: 8px; border-left: 4px solid #ccc; }
        .step-plan  { background: #eafaf1; border-color: #2ecc71; }
        .step-do    { background: #ebf5fb; border-color: #3498db; }
        .step-check { background: #fef9e7; border-color: #f1c40f; }
        .step-act   { background: #fadbd8; border-color: #e74c3c; }

        .step-title { font-weight: bold; font-size: 13px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        
        input[type="text"], textarea { width: 100%; padding: 12px; border: 1px solid #ccd1d9; border-radius: 8px; margin-top: 6px; font-size: 16px; line-height: 1.5; resize: vertical; background: #fff; }
        input[type="text"]:focus, textarea:focus { border-color: #3498db; outline: none; box-shadow: 0 0 5px rgba(52, 152, 219, 0.4); }
        
        .btn-submit { background: #2ecc71; color: white; width: 100%; padding: 14px; margin-top: 10px; font-size: 15px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; }
        .btn-submit:active { background: #27ae60; }
        
        /* 改行表示用 */
        .text-content { white-space: pre-wrap; word-wrap: break-word; font-size: 14px; line-height: 1.6; color: #2c3e50; }

        /* 復元用選択リストのモーダルデザイン */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; align-items: flex-end; justify-content: center; z-index: 1000; padding: 0; }
        @media (min-width: 600px) {
            .modal-overlay { padding: 20px; align-items: center; }
        }
        
        .modal-content { background: white; border-radius: 16px 16px 0 0; width: 100%; max-width: 500px; padding: 20px; box-shadow: 0 -4px 20px rgba(0,0,0,0.15); max-height: 85vh; display: flex; flex-direction: column; animation: slideUp 0.3s ease-out; }
        @media (min-width: 600px) {
            .modal-content { border-radius: 16px; }
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header { font-size: 16px; font-weight: bold; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; color: #2c3e50; }
        .backup-list { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; max-height: 55vh; padding-right: 2px; }
        
        .backup-item { background: #f8f9fa; border: 1px solid #dcdde1; border-radius: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .backup-info { flex-grow: 1; text-align: left; cursor: pointer; }
        .backup-title { font-weight: bold; font-size: 15px; color: #2c3e50; margin-bottom: 4px; word-break: break-all; }
        .backup-date { font-size: 12px; color: #7f8c8d; }
        
        .btn-delete-backup { background: #e74c3c; color: white; padding: 8px 12px; font-size: 12px; flex-shrink: 0; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
        .btn-delete-backup:active { background: #c0392b; }

        .btn-close-modal { background: #95a5a6; color: white; width: 100%; padding: 14px; border-radius: 8px; font-size: 15px; border: none; font-weight: bold; cursor: pointer; }
        .btn-close-modal:active { background: #7f8c8d; }
    </style>
</head>
<body>

    <div class="container">
        <!-- プロジェクトタイトルヘッダー（タイトルのみ表示） -->
        <div id="projectHeader" class="project-header" style="display: none;">
            <div class="project-title" id="displayTitle"></div>
        </div>

        <!-- 新規スタート用フォーム -->
        <div id="startSection" class="pdca-card">
            <h2 style="margin-top:0; font-size:18px; color:#2c3e50;">新しいPDCAチェーンを開始</h2>
            
            <div class="step-box" style="background:#f8f9fa; border-left-color:#34495e;">
                <div class="step-title" style="color: #2c3e50;">📌 タイトル（テーマ・目的）</div>
                <input type="text" id="projectTitle" placeholder="例：英語スキル習得プロジェクト" onkeydown="handleEnterKey(event, focusFirstPlan)">
            </div>

            <div class="step-box step-plan">
                <div class="step-title" style="color: #27ae60;">
                    <span>P (Plan) - 最初の目標・計画</span>
                </div>
                <textarea id="firstPlan" rows="3" placeholder="例：毎日15分単語アプリを使う" onkeydown="handleTextareaEnterKey(event, startNewChain)"></textarea>
            </div>
            
            <button class="btn-submit" onclick="startNewChain()">サイクルを開始する</button>
        </div>

        <!-- PDCAカードの表示エリア -->
        <div id="chainList"></div>
    </div>

    <!-- 画面左下の容量確認テキストリンク -->
    <div class="storage-link-wrapper">
        <span class="storage-link" onclick="checkStorageSize()">ストレージ容量を確認</span>
    </div>

    <!-- 画面一番下に常時固定するコントロールバー -->
    <div class="bottom-controls">
        <div class="control-group-left">
            <button class="btn-mini btn-new" onclick="createNewProject()" title="新規作成">新規</button>
            <button class="btn-mini btn-backup" onclick="saveBackupToDB()" title="保存">保存</button>
            <button class="btn-mini btn-restore" onclick="showRestoreModal()" title="復元">復元</button>
        </div>
        <div class="control-group-right">
            <div class="pagination-nav" id="paginationNav" style="display: none;">
                <button class="btn-page" id="prevBtn" onclick="changeCard(-1)">〈</button>
                <span id="pageIndicator" class="page-indicator">- / -</span>
                <button class="btn-page" id="nextBtn" onclick="changeCard(1)">〉</button>
            </div>
        </div>
    </div>

    <!-- 復元用モーダルコンテナ -->
    <div id="modalContainer"></div>

    <script>
        // --- グローバル変数（現在表示中の世代インデックス） ---
        let currentCardIndex = 0;

        // --- IndexedDB のセットアップ ---
        const DB_NAME = 'InfinitePDCA_DB';
        const DB_VERSION = 1;
        const STORE_NAME = 'pdcaStore';

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
            });
        }

        async function dbGet(key) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(STORE_NAME, 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.get(key);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function dbPut(key, value) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(STORE_NAME, 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.put(value, key);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function dbDelete(key) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(STORE_NAME, 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.delete(key);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        // --- アプリケーションロジック ---

        document.addEventListener('DOMContentLoaded', loadChain);

        function handleTextareaEnterKey(event, callback) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                callback();
            }
        }

        function handleEnterKey(event, callback) {
            if (event.key === 'Enter') {
                event.preventDefault();
                callback();
            }
        }

        function focusFirstPlan() {
            const title = document.getElementById('projectTitle').value.trim();
            if (!title) {
                alert('タイトルを入力してください');
                return;
            }
            document.getElementById('firstPlan').focus();
        }

        // 日付フォーマット関数 (YYYY/MM/DD)
        function formatDate(dateString) {
            if (!dateString) return '';
            const d = new Date(dateString);
            if (isNaN(d.getTime())) return '';
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}/${month}/${day}`;
        }

        // データの読み込み＆描画
        async function loadChain(targetIndex = null) {
            const chainList = document.getElementById('chainList');
            const startSection = document.getElementById('startSection');
            const projectHeader = document.getElementById('projectHeader');
            const displayTitle = document.getElementById('displayTitle');
            const paginationNav = document.getElementById('paginationNav');
            const pageIndicator = document.getElementById('pageIndicator');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            chainList.innerHTML = '';
            
            let chainData = (await dbGet('infinitePdcaData')) || [];
            let projectTitle = (await dbGet('infinitePdcaTitle')) || '';

            if (chainData.length === 0) {
                startSection.style.display = 'block';
                projectHeader.style.display = 'none';
                paginationNav.style.display = 'none';
                
                document.getElementById('projectTitle').value = '';
                document.getElementById('firstPlan').value = '';

                setTimeout(() => {
                    const titleInput = document.getElementById('projectTitle');
                    if (titleInput) titleInput.focus();
                }, 50);
                return;
            } else {
                startSection.style.display = 'none';
                projectHeader.style.display = 'block';
                paginationNav.style.display = 'flex';
                displayTitle.textContent = projectTitle;
            }

            // インデックスの範囲調整
            if (targetIndex !== null) {
                currentCardIndex = Math.max(0, Math.min(targetIndex, chainData.length - 1));
            } else {
                currentCardIndex = chainData.length - 1;
            }

            // 各世代のカードを生成（該当インデックスのみ表示）
            chainData.forEach((item, index) => {
                const isLatest = (index === chainData.length - 1);
                const card = document.createElement('div');
                card.className = 'pdca-card';
                card.style.display = (index === currentCardIndex) ? 'block' : 'none';
                card.dataset.index = index;

                const dateStr = formatDate(item.createdAt);

                let html = `
                    <div class="card-header-bar">
                        <div class="cycle-info-group">
                            <span class="cycle-badge">第 ${item.cycle} 世代</span>
                            ${dateStr ? `<span class="cycle-date">📅 ${dateStr}</span>` : ''}
                        </div>
                        <span class="card-project-title">📌 ${escapeHtml(projectTitle)}</span>
                    </div>
                `;

                // 1. PLAN
                html += `
                    <div class="step-box step-plan">
                        <div class="step-title" style="color: #27ae60;">P (Plan) - 計画</div>
                        <div class="text-content">${escapeHtml(item.plan)}</div>
                    </div>
                `;

                // 2. DO
                if (item.status === 'PLAN_DONE' || !isLatest) {
                    html += `
                        <div class="step-box step-do">
                            <div class="step-title" style="color: #2980b9;">D (Do) - 実行</div>
                            <div class="text-content">${escapeHtml(item.doText)}</div>
                        </div>
                    `;
                } else if (item.status === 'NEED_DO') {
                    html += `
                        <div class="step-box step-do">
                            <div class="step-title" style="color: #2980b9;">
                                <span>D (Do) - 実行内容を入力</span>
                            </div>
                            <textarea id="inputDo" rows="3" placeholder="実際に行なったこと・進捗..." onkeydown="handleTextareaEnterKey(event, () => updateStep(${index}, 'do'))"></textarea>
                            <button class="btn-submit" onclick="updateStep(${index}, 'do')">Do を完了して Check へ</button>
                        </div>
                    `;
                }

                // 3. CHECK
                if (item.status === 'DO_DONE' || (!isLatest && item.check)) {
                    html += `
                        <div class="step-box step-check">
                            <div class="step-title" style="color: #d35400;">C (Check) - 評価・振り返り</div>
                            <div class="text-content">${escapeHtml(item.check)}</div>
                        </div>
                    `;
                } else if (item.status === 'NEED_CHECK') {
                    html += `
                        <div class="step-box step-check">
                            <div class="step-title" style="color: #d35400;">
                                <span>C (Check) - 評価・振り返りを入力</span>
                            </div>
                            <textarea id="inputCheck" rows="3" placeholder="良かった点、原因など..." onkeydown="handleTextareaEnterKey(event, () => updateStep(${index}, 'check'))"></textarea>
                            <button class="btn-submit" onclick="updateStep(${index}, 'check')">Check を完了して Act へ</button>
                        </div>
                    `;
                }

                // 4. ACT
                if (!isLatest) {
                    html += `
                        <div class="step-box step-act">
                            <div class="step-title" style="color: #c0392b;">A (Act) - 改善策</div>
                            <div class="text-content">${escapeHtml(item.act)}</div>
                        </div>
                    `;
                } else if (item.status === 'NEED_ACT') {
                    html += `
                        <div class="step-box step-act">
                            <div class="step-title" style="color: #c0392b;">
                                <span>A (Act) - 次回の改善策（次の Plan）</span>
                            </div>
                            <textarea id="inputAct" rows="3" placeholder="次回どう改善するか？を入力..." onkeydown="handleTextareaEnterKey(event, () => nextLoop(${index}))"></textarea>
                            <button class="btn-submit" style="background: #e74c3c;" onclick="nextLoop(${index})">🔄 次のサイクルへ連鎖させる！</button>
                        </div>
                    `;
                }

                card.innerHTML = html;
                chainList.appendChild(card);
            });

            // インジケーターとボタンの状態更新
            pageIndicator.textContent = `${currentCardIndex + 1} / ${chainData.length}`;
            prevBtn.disabled = (currentCardIndex <= 0);
            nextBtn.disabled = (currentCardIndex >= chainData.length - 1);

            // フォーカス調整
            setTimeout(() => {
                const activeCard = chainList.querySelector(`.pdca-card[data-index="${currentCardIndex}"]`);
                if (activeCard) {
                    const activeInput = activeCard.querySelector('textarea, input[type="text"]');
                    if (activeInput) {
                        activeInput.focus({preventScroll: true});
                    }
                }
            }, 50);
        }

        // 左右ボタンでカードを切り替える
        async function changeCard(direction) {
            let chainData = (await dbGet('infinitePdcaData')) || [];
            const newIndex = currentCardIndex + direction;
            if (newIndex >= 0 && newIndex < chainData.length) {
                loadChain(newIndex);
            }
        }

        // 新規作成処理
        async function createNewProject() {
            if (confirm('新しいプロジェクトを作成しますか？')) {
                await dbDelete('infinitePdcaTitle');
                await dbDelete('infinitePdcaData');
                loadChain();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // 最初のサイクルを開始
        async function startNewChain() {
            const title = document.getElementById('projectTitle').value.trim();
            const plan = document.getElementById('firstPlan').value.trim();

            if (!title) return alert('タイトルを入力してください');
            if (!plan) return alert('最初のPlanを入力してください');

            const chainData = [{
                cycle: 1,
                plan: plan,
                doText: '',
                check: '',
                act: '',
                status: 'NEED_DO',
                createdAt: new Date().toISOString()
            }];

            await dbPut('infinitePdcaTitle', title);
            await dbPut('infinitePdcaData', chainData);
            loadChain();
        }

        // ステップを進める
        async function updateStep(index, step) {
            let chainData = await dbGet('infinitePdcaData');
            
            if (step === 'do') {
                const val = document.getElementById('inputDo').value.trim();
                if (!val) return alert('実行内容を入力してください');
                chainData[index].doText = val;
                chainData[index].status = 'NEED_CHECK';
            } else if (step === 'check') {
                const val = document.getElementById('inputCheck').value.trim();
                if (!val) return alert('振り返りを入力してください');
                chainData[index].check = val;
                chainData[index].status = 'NEED_ACT';
            }

            await dbPut('infinitePdcaData', chainData);
            loadChain(index);
        }

        // Actを入力して次のPDCA(Plan)を生成する
        async function nextLoop(currentIndex) {
            const actVal = document.getElementById('inputAct').value.trim();
            if (!actVal) return alert('改善策を入力してください。これが次のPlanになります！');

            let chainData = await dbGet('infinitePdcaData');
            
            chainData[currentIndex].act = actVal;
            chainData[currentIndex].status = 'COMPLETED';

            const nextCycle = chainData[currentIndex].cycle + 1;
            chainData.push({
                cycle: nextCycle,
                plan: actVal,
                doText: '',
                check: '',
                act: '',
                status: 'NEED_DO',
                createdAt: new Date().toISOString()
            });

            await dbPut('infinitePdcaData', chainData);
            loadChain(chainData.length - 1);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 📥 保存処理
        async function saveBackupToDB() {
            const rawTitle = (await dbGet('infinitePdcaTitle'));
            const data = (await dbGet('infinitePdcaData')) || [];

            if (!rawTitle) {
                alert('保存するプロジェクトのタイトルがありません。');
                return;
            }

            let backups = (await dbGet('infinitePdcaBackups')) || {};

            backups[rawTitle] = {
                title: rawTitle,
                chainData: data,
                savedAt: new Date().toISOString()
            };

            await dbPut('infinitePdcaBackups', backups);
            alert(`プロジェクト「${rawTitle}」のバックアップをIndexedDBに保存（上書き）しました！`);
        }

        // 📤 復元用選択リスト（モーダル）を表示
        async function showRestoreModal() {
            const backups = (await dbGet('infinitePdcaBackups')) || {};
            const titles = Object.keys(backups);

            const modalContainer = document.getElementById('modalContainer');

            if (titles.length === 0) {
                alert('IndexedDB内に保存されたバックアップデータがありません。');
                return;
            }

            let listHtml = '';
            titles.forEach((title) => {
                const backup = backups[title];
                const dateStr = backup.savedAt ? new Date(backup.savedAt).toLocaleString() : '日時不明';
                listHtml += `
                    <div class="backup-item">
                        <div class="backup-info" onclick="restoreSelectedBackup('${escapeAttribute(title)}')">
                            <div class="backup-title">📌 ${escapeHtml(title)}</div>
                            <div class="backup-date">保存日時: ${dateStr}</div>
                        </div>
                        <button class="btn-delete-backup" onclick="deleteBackup('${escapeAttribute(title)}')">🗑️ 削除</button>
                    </div>
                `;
            });

            modalContainer.innerHTML = `
                <div class="modal-overlay" onclick="closeRestoreModal(event)">
                    <div class="modal-content" onclick="event.stopPropagation()">
                        <div class="modal-header">
                            <span>📤 復元または削除するプロジェクト</span>
                            <span style="cursor:pointer; font-size:20px; padding: 0 5px;" onclick="closeRestoreModal()">✕</span>
                        </div>
                        <div class="backup-list">
                            ${listHtml}
                        </div>
                        <button class="btn-close-modal" onclick="closeRestoreModal()">閉じる</button>
                    </div>
                </div>
            `;
        }

        function closeRestoreModal() {
            document.getElementById('modalContainer').innerHTML = '';
        }

        async function restoreSelectedBackup(titleKey) {
            const backups = (await dbGet('infinitePdcaBackups')) || {};
            const backup = backups[titleKey];

            if (!backup) {
                alert('指定されたバックアップが見つかりませんでした。');
                return;
            }

            if (confirm(`「${backup.title}」のバックアップデータを復元しますか？`)) {
                await dbPut('infinitePdcaTitle', backup.title);
                await dbPut('infinitePdcaData', backup.chainData);
                closeRestoreModal();
                loadChain();
                alert('データを正常に復元しました！');
            }
        }

        async function deleteBackup(titleKey) {
            if (confirm(`本当に「${titleKey}」のバックアップを削除しますか？`)) {
                let backups = (await dbGet('infinitePdcaBackups')) || {};
                
                if (backups[titleKey]) {
                    delete backups[titleKey];
                    await dbPut('infinitePdcaBackups', backups);
                    
                    if (Object.keys(backups).length > 0) {
                        showRestoreModal();
                    } else {
                        closeRestoreModal();
                    }
                    alert(`「${titleKey}」のバックアップを削除しました。`);
                }
            }
        }

        // 📊 IndexedDBのストレージ使用量・上限を確認する関数
        async function checkStorageSize() {
            if (navigator.storage && navigator.storage.estimate) {
                try {
                    const estimate = await navigator.storage.estimate();
                    const usage = estimate.usage || 0; // 使用量 (バイト)
                    const quota = estimate.quota || 0; // 最大割当量 (バイト)

                    // 読みやすい単位に変換する関数
                    function formatBytes(bytes) {
                        if (bytes === 0) return '0 Bytes';
                        const k = 1024;
                        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                        const i = Math.floor(Math.log(bytes) / Math.log(k));
                        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
                    }

                    const usageFormatted = formatBytes(usage);
                    const quotaFormatted = formatBytes(quota);
                    const percentage = quota > 0 ? ((usage / quota) * 100).toFixed(2) + '%' : '不明';

                    alert(
                        `📊 ストレージ使用状況 (IndexedDB / ブラウザ全体)\n\n` +
                        `・現在の使用量: ${usageFormatted}\n` +
                        `・利用可能な上限: ${quotaFormatted}\n` +
                        `・使用割合: ${percentage}`
                    );
                } catch (error) {
                    console.error(error);
                    alert('ストレージ情報の取得に失敗しました。');
                }
            } else {
                alert('お使いのブラウザはこの機能（StorageManager API）に対応していません。');
            }
        }

        // エスケープ処理
        function escapeHtml(str) {
            if(!str) return '';
            return str.replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;')
                      .replace(/"/g, '&quot;')
                      .replace(/'/g, '&#039;');
        }

        function escapeAttribute(str) {
            if(!str) return '';
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
