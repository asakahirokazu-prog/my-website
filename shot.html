  <script>
    /* -------------------------------------------------------------
       IndexedDB Setup & Helpers
    ------------------------------------------------------------- */
    const DB_NAME = 'ScreenSnapDB';
    const DB_VERSION = 1;
    let db = null;

    function openDB() {
      return new Promise((resolve, reject) => {
        if (db) return resolve(db);
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => {
          db = request.result;
          resolve(db);
        };
        request.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains('items')) {
            database.createObjectStore('items', { keyPath: 'id' });
          }
          if (!database.objectStoreNames.contains('categories')) {
            database.createObjectStore('categories', { keyPath: 'id' });
          }
        };
      });
    }

    async function dbGetAll(storeName) {
      const database = await openDB();
      return new Promise((resolve, reject) => {
        const transaction = database.transaction(storeName, 'readonly');
        const store = transaction.objectStore(storeName);
        const request = store.getAll();
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function dbPut(storeName, value) {
      const database = await openDB();
      return new Promise((resolve, reject) => {
        const transaction = database.transaction(storeName, 'readwrite');
        const store = transaction.objectStore(storeName);
        const request = store.put(value);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function dbDelete(storeName, id) {
      const database = await openDB();
      return new Promise((resolve, reject) => {
        const transaction = database.transaction(storeName, 'readwrite');
        const store = transaction.objectStore(storeName);
        const request = store.delete(id);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    /* -------------------------------------------------------------
       Storage Usage Calculation
    ------------------------------------------------------------- */
    async function updateStorageUsageUI() {
      const usageText = document.getElementById('storageUsageText');
      const detailSubText = document.getElementById('storageDetailSubText');
      const percentText = document.getElementById('storagePercentText');
      const progressBar = document.getElementById('storageProgressBar');

      if (navigator.storage && navigator.storage.estimate) {
        try {
          const estimate = await navigator.storage.estimate();
          const used = estimate.usage || 0; // Bytes
          const quota = estimate.quota || 0; // Bytes

          const usedMB = (used / (1024 * 1024)).toFixed(2);
          const quotaMB = (quota / (1024 * 1024)).toFixed(0);
          const percent = quota > 0 ? Math.min(100, Math.round((used / quota) * 100)) : 0;

          usageText.textContent = `${usedMB} MB`;
          detailSubText.textContent = `使用: ${usedMB} MB / 割当目安: ${quotaMB} MB`;
          percentText.textContent = `${percent}%`;
          progressBar.style.width = `${percent}%`;
        } catch (err) {
          usageText.textContent = '取得失敗';
        }
      } else {
        usageText.textContent = '非対応ブラウザ';
      }
    }

        timestamp: Date.now() - 3600000 * 48
      }
    ];

    let categories = [];
    let items = [];
    let activeFilter = 'all';
    let currentEditItemId = null;
    let selectedModalCategoryId = '';
    let selectedNewCatColor = PRESET_COLORS[0];

    async function loadData() {
      try {
        const storedCats = await dbGetAll('categories');
        if (storedCats && storedCats.length > 0) {
          categories = storedCats;
        } else {
          for (const cat of DEFAULT_CATEGORIES) {
            await dbPut('categories', cat);
          }
          categories = DEFAULT_CATEGORIES;
        }

        const storedItems = await dbGetAll('items');
        if (storedItems && storedItems.length > 0) {
          items = storedItems.sort((a, b) => b.timestamp - a.timestamp);
        } else {
          for (const item of DEMO_ITEMS) {
            await dbPut('items', item);
          }
          items = DEMO_ITEMS;
        }
      } catch (err) {
        console.error('Failed to load from IndexedDB', err);
        categories = DEFAULT_CATEGORIES;
        items = DEMO_ITEMS;
      }
      updateStorageUsageUI();
    }

    /* -------------------------------------------------------------
       UI Notification Toast Helper
    ------------------------------------------------------------- */
    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toastIcon');
      const msg = document.getElementById('toastMsg');

      msg.textContent = message;
      if (isError) {
        icon.className = 'ph-bold ph-warning-circle text-rose-400';
      } else {
        icon.className = 'ph-bold ph-check text-emerald-400';
      }

      toast.classList.remove('opacity-0', '-translate-y-4', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-4', 'pointer-events-none');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2500);
    }

    /* -------------------------------------------------------------
       Category Helpers
    ------------------------------------------------------------- */
    function getCategory(catId) {
      return categories.find(c => c.id === catId) || {
        id: 'unknown',
        name: '未分類',
        color: { bg: '#F1F5F9', text: '#475569', dot: '#94A3B8' }
      };
    }

    function renderCategoryFilterBar() {
      const filterBar = document.getElementById('categoryFilterBar');
      filterBar.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.className = `px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition active:scale-95 flex items-center space-x-1.5 ${
        activeFilter === 'all' 
          ? 'bg-slate-900 text-white shadow-sm' 
          : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'
      }`;
      allBtn.innerHTML = `<span>すべて</span><span class="text-[10px] opacity-75 font-normal">(${items.length})</span>`;
      allBtn.onclick = () => {
        activeFilter = 'all';
        renderCategoryFilterBar();
        renderItems();
      };
      filterBar.appendChild(allBtn);

      categories.forEach(cat => {
        const count = items.filter(it => it.categoryId === cat.id).length;
        const btn = document.createElement('button');
        const isActive = activeFilter === cat.id;

        btn.className = `px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition active:scale-95 flex items-center space-x-1.5 ${
          isActive 
            ? 'bg-slate-900 text-white shadow-sm' 
            : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'
        }`;
        
        btn.innerHTML = `
          <span class="w-2 h-2 rounded-full inline-block" style="background-color: ${cat.color.dot}"></span>
          <span>${cat.name}</span>
          <span class="text-[10px] opacity-75 font-normal">(${count})</span>
        `;

        btn.onclick = () => {
          activeFilter = cat.id;
          renderCategoryFilterBar();
          renderItems();
        };

        filterBar.appendChild(btn);
      });
    }

    function renderItems() {
      const grid = document.getElementById('cardsGrid');
      const emptyState = document.getElementById('emptyState');
      const counterText = document.getElementById('itemsCountText');
      const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();

      const filtered = items.filter(item => {
        const matchFilter = activeFilter === 'all' || item.categoryId === activeFilter;
        const cat = getCategory(item.categoryId);
        const matchSearch = !searchTerm || 
          item.comment.toLowerCase().includes(searchTerm) ||
          cat.name.toLowerCase().includes(searchTerm) ||
          (item.sourceUrl && item.sourceUrl.toLowerCase().includes(searchTerm));
        return matchFilter && matchSearch;
      });

      counterText.textContent = `${filtered.length} 件のアイテム`;

      if (filtered.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      grid.innerHTML = '';

      filtered.forEach(item => {
        const cat = getCategory(item.categoryId);
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl overflow-hidden border border-slate-200/80 shadow-sm flex flex-col active:scale-[0.98] transition cursor-pointer";
        
        const dateObj = new Date(item.timestamp);
        const dateStr = `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;

        card.innerHTML = `
          <div class="relative w-full aspect-[4/3] bg-slate-900 overflow-hidden flex items-center justify-center">
            <img src="${item.imageData}" alt="Screenshot" class="w-full h-full object-cover">
            <div class="absolute top-2 left-2">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-md shadow-sm flex items-center gap-1" style="background-color: ${cat.color.bg}; color: ${cat.color.text}">
                <span class="w-1.5 h-1.5 rounded-full" style="background-color: ${cat.color.dot}"></span>
                ${cat.name}
              </span>
            </div>
          </div>
          <div class="p-3 flex-1 flex flex-col justify-between">
            <p class="text-xs text-slate-700 font-medium line-clamp-2 leading-snug mb-2">
              ${item.comment ? escapeHtml(item.comment) : '<span class="text-slate-400 italic">コメントなし</span>'}
            </p>
            <div class="flex items-center justify-between text-[10px] text-slate-400 pt-1 border-t border-slate-100">
              <span>${dateStr}</span>
              <span class="flex items-center text-slate-500 font-medium">
                詳細 <i class="ph-bold ph-caret-right ml-0.5 text-[9px]"></i>
              </span>
            </div>
          </div>
        `;

        card.onclick = () => openDetailModal(item.id);
        grid.appendChild(card);
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[m];
      });
    }

    const itemModal = document.getElementById('itemModal');
    const modalPreviewImg = document.getElementById('modalPreviewImg');
    const imagePlaceholder = document.getElementById('imagePlaceholder');
    const changeImageBtn = document.getElementById('changeImageBtn');
    const modalComment = document.getElementById('modalComment');
    const modalSourceUrl = document.getElementById('modalSourceUrl');
    const modalTitle = document.getElementById('modalTitle');
    const saveBtnText = document.getElementById('saveBtnText');

    let currentModalImageData = '';

    function openAddModal(preloadedImage = '') {
      currentEditItemId = null;
      currentModalImageData = preloadedImage;
      modalTitle.textContent = '新規キャプチャの取り込み';
      saveBtnText.textContent = '保存する';
      modalComment.value = '';
      modalSourceUrl.value = '';
      selectedModalCategoryId = categories[0]?.id || '';

      updateModalImagePreview();
      renderModalCategoryBadges();

      itemModal.classList.remove('hidden');
    }

    function openEditModal(itemId) {
      const item = items.find(i => i.id === itemId);
      if (!item) return;

      currentEditItemId = itemId;
      currentModalImageData = item.imageData;
      modalTitle.textContent = 'キャプチャ情報の編集';
      saveBtnText.textContent = '更新する';
      modalComment.value = item.comment || '';
      modalSourceUrl.value = item.sourceUrl || '';
      selectedModalCategoryId = item.categoryId;

      updateModalImagePreview();
      renderModalCategoryBadges();

      document.getElementById('detailModal').classList.add('hidden');
      itemModal.classList.remove('hidden');
    }

    function closeModal() {
      itemModal.classList.add('hidden');
      currentEditItemId = null;
      currentModalImageData = '';
    }

    function updateModalImagePreview() {
      if (currentModalImageData) {
        modalPreviewImg.src = currentModalImageData;
        modalPreviewImg.classList.remove('hidden');
        imagePlaceholder.classList.add('hidden');
        changeImageBtn.classList.remove('hidden');
      } else {
        modalPreviewImg.src = '';
        modalPreviewImg.classList.add('hidden');
        imagePlaceholder.classList.remove('hidden');
        changeImageBtn.classList.add('hidden');
      }
    }

    function renderModalCategoryBadges() {
      const container = document.getElementById('modalCategoryBadges');
      container.innerHTML = '';

      categories.forEach(cat => {
        const isSelected = selectedModalCategoryId === cat.id;
        const badge = document.createElement('button');
        badge.type = 'button';
        badge.className = `px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center space-x-1.5 transition active:scale-95 ${
          isSelected 
            ? 'ring-2 ring-brand-500 shadow-sm' 
            : 'border border-slate-200 opacity-80 hover:opacity-100'
        }`;
        badge.style.backgroundColor = cat.color.bg;
        badge.style.color = cat.color.text;

        badge.innerHTML = `
          <span class="w-2 h-2 rounded-full" style="background-color: ${cat.color.dot}"></span>
          <span>${cat.name}</span>
          ${isSelected ? '<i class="ph-bold ph-check text-[11px] ml-0.5"></i>' : ''}
        `;

        badge.onclick = () => {
          selectedModalCategoryId = cat.id;
          renderModalCategoryBadges();
        };

        container.appendChild(badge);
      });
    }

    function handleFileSelected(file) {
      if (!file || !file.type.startsWith('image/')) {
        showToast('画像ファイルを選択してください', true);
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 1200;
          let w = img.width;
          let h = img.height;

          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }

          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          currentModalImageData = canvas.toDataURL('image/jpeg', 0.85);

          updateModalImagePreview();
          if (itemModal.classList.contains('hidden')) {
            openAddModal(currentModalImageData);
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function handleClipboardPaste() {
      try {
        if (!navigator.clipboard || !navigator.clipboard.read) {
          showToast('クリップボードから画像を選択または画面に直接ペーストしてください', false);
          openAddModal();
          return;
        }

        const clipboardItems = await navigator.clipboard.read();
        let foundImage = false;

        for (const item of clipboardItems) {
          const imageType = item.types.find(type => type.startsWith('image/'));
          if (imageType) {
            const blob = await item.getType(imageType);
            handleFileSelected(blob);
            showToast('キャプチャをクリップボードから貼り付けました！');
            foundImage = true;
            break;
          }
        }

        if (!foundImage) {
          showToast('クリップボードに画像が見つかりませんでした', true);
          openAddModal();
        }
      } catch (err) {
        showToast('貼り付けを許可するか画像を選択してください', true);
        openAddModal();
      }
    }

    window.addEventListener('paste', (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) {
          const blob = items[i].getAsFile();
          handleFileSelected(blob);
          showToast('画像を貼り付けました');
          break;
        }
      }
    });

    async function saveCurrentItem() {
      if (!currentModalImageData) {
        showToast('画像を設定してください', true);
        return;
      }

      const comment = modalComment.value.trim();
      const sourceUrl = modalSourceUrl.value.trim();
      const categoryId = selectedModalCategoryId || categories[0]?.id || 'cat-other';

      try {
        if (currentEditItemId) {
          const idx = items.findIndex(i => i.id === currentEditItemId);
          if (idx !== -1) {
            items[idx] = {
              ...items[idx],
              imageData: currentModalImageData,
              categoryId,
              comment,
              sourceUrl,
            };
            await dbPut('items', items[idx]);
            showToast('キャプチャを更新しました');
          }
        } else {
          const newItem = {
            id: 'snap-' + Date.now(),
            imageData: currentModalImageData,
            categoryId,
            comment,
            sourceUrl,
            timestamp: Date.now(),
          };
          items.unshift(newItem);
          await dbPut('items', newItem);
          showToast('キャプチャを保存しました！');
        }

        renderCategoryFilterBar();
        renderItems();
        closeModal();
        updateStorageUsageUI();
      } catch (err) {
        showToast('データの保存中にエラーが発生しました', true);
      }
    }

    let currentDetailItemId = null;
    function openDetailModal(itemId) {
      const item = items.find(i => i.id === itemId);
      if (!item) return;

      currentDetailItemId = itemId;
      const cat = getCategory(item.categoryId);
      const detailModal = document.getElementById('detailModal');

      document.getElementById('detailImg').src = item.imageData;
      const catBadge = document.getElementById('detailCategoryBadge');
      catBadge.textContent = cat.name;
      catBadge.style.backgroundColor = cat.color.bg;
      catBadge.style.color = cat.color.text;

      const dateObj = new Date(item.timestamp);
      document.getElementById('detailDate').textContent = `${dateObj.getFullYear()}/${dateObj.getMonth() + 1}/${dateObj.getDate()} ${String(dateObj.getHours()).padStart(2, '0')}:${String(dateObj.getMinutes()).padStart(2, '0')}`;
      
      document.getElementById('detailComment').textContent = item.comment || 'コメントはありません。';

      const urlContainer = document.getElementById('detailUrlContainer');
      const urlLink = document.getElementById('detailUrlLink');
      if (item.sourceUrl) {
        urlContainer.classList.remove('hidden');
        urlLink.href = item.sourceUrl.startsWith('http') ? item.sourceUrl : `https://${item.sourceUrl}`;
        urlLink.textContent = item.sourceUrl;
      } else {
        urlContainer.classList.add('hidden');
      }

      detailModal.classList.remove('hidden');
    }

    async function deleteItem(itemId) {
      try {
        await dbDelete('items', itemId);
        items = items.filter(i => i.id !== itemId);
        renderCategoryFilterBar();
        renderItems();
        document.getElementById('detailModal').classList.add('hidden');
        showToast('キャプチャを削除しました');
        updateStorageUsageUI();
      } catch (err) {
        showToast('削除に失敗しました', true);
      }
    }

    function renderCategoryManageUI() {
      const colorPicker = document.getElementById('colorPickerList');
      colorPicker.innerHTML = '';

      PRESET_COLORS.forEach((col) => {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = `w-6 h-6 rounded-full transition transform ${selectedNewCatColor.name === col.name ? 'ring-2 ring-slate-800 scale-110' : 'opacity-80'}`;
        dot.style.backgroundColor = col.dot;
        dot.onclick = () => {
          selectedNewCatColor = col;
          renderCategoryManageUI();
        };
        colorPicker.appendChild(dot);
      });

      const list = document.getElementById('existingCategoriesList');
      list.innerHTML = '';

      categories.forEach(cat => {
        const row = document.createElement('div');
        row.className = "flex items-center justify-between p-2 rounded-xl bg-slate-50 border border-slate-100 text-xs";
        
        row.innerHTML = `
          <div class="flex items-center space-x-2">
            <span class="w-3 h-3 rounded-full" style="background-color: ${cat.color.dot}"></span>
            <span class="font-medium text-slate-800">${escapeHtml(cat.name)}</span>
          </div>
          <button class="delete-cat-btn text-slate-400 hover:text-rose-600 p-1" data-cat-id="${cat.id}">
            <i class="ph-bold ph-trash"></i>
          </button>
        `;

        row.querySelector('.delete-cat-btn').onclick = async (e) => {
          e.stopPropagation();
          if (categories.length <= 1) {
            showToast('最低1つのカテゴリが必要です', true);
            return;
          }
          try {
            await dbDelete('categories', cat.id);
            categories = categories.filter(c => c.id !== cat.id);
            renderCategoryFilterBar();
            renderCategoryManageUI();
            renderItems();
            showToast(`「${cat.name}」を削除しました`);
          } catch (err) {
            showToast('カテゴリの削除に失敗しました', true);
          }
        };

        list.appendChild(row);
      });
    }

    async function addNewCategory() {
      const input = document.getElementById('newCategoryName');
      const name = input.value.trim();
      if (!name) {
        showToast('カテゴリ名を入力してください', true);
        return;
      }

      const newCat = {
        id: 'cat-' + Date.now(),
        name,
        color: selectedNewCatColor
      };

      try {
        await dbPut('categories', newCat);
        categories.push(newCat);
        input.value = '';
        renderCategoryManageUI();
        renderCategoryFilterBar();
        renderModalCategoryBadges();
        showToast(`カテゴリ「${name}」を追加しました`);
      } catch (err) {
        showToast('カテゴリの追加に失敗しました', true);
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await loadData();
      renderCategoryFilterBar();
      renderItems();

      const imageFileInput = document.getElementById('imageFileInput');
      const cameraFileInput = document.getElementById('cameraFileInput');

      const searchInput = document.getElementById('searchInput');
      const clearSearchBtn = document.getElementById('clearSearchBtn');

      searchInput.addEventListener('input', () => {
        if (searchInput.value.length > 0) {
          clearSearchBtn.classList.remove('hidden');
        } else {
          clearSearchBtn.classList.add('hidden');
        }
        renderItems();
      });

      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        clearSearchBtn.classList.add('hidden');
        renderItems();
      });

      document.getElementById('quickPasteBtn').onclick = handleClipboardPaste;
      document.getElementById('openUploadSheetBtn').onclick = () => openAddModal();
      document.getElementById('quickCameraBtn').onclick = () => cameraFileInput.click();
      document.getElementById('viewAllBtn').onclick = () => {
        activeFilter = 'all';
        searchInput.value = '';
        clearSearchBtn.classList.add('hidden');
        renderCategoryFilterBar();
        renderItems();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      document.getElementById('imagePickerContainer').onclick = () => imageFileInput.click();
      imageFileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
          handleFileSelected(e.target.files[0]);
        }
      });
      cameraFileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
          handleFileSelected(e.target.files[0]);
        }
      });

      document.getElementById('closeModalBtn').onclick = closeModal;
      document.getElementById('cancelModalBtn').onclick = closeModal;
      document.getElementById('saveItemBtn').onclick = saveCurrentItem;

      const detailModal = document.getElementById('detailModal');
      document.getElementById('detailCloseBtn').onclick = () => detailModal.classList.add('hidden');
      document.getElementById('detailEditBtn').onclick = () => {
        if (currentDetailItemId) openEditModal(currentDetailItemId);
      };
      document.getElementById('detailDeleteBtn').onclick = () => {
        if (currentDetailItemId) deleteItem(currentDetailItemId);
      };

      const catModal = document.getElementById('categoryManageModal');
      document.getElementById('openCategoryManageBtn').onclick = () => {
        renderCategoryManageUI();
        catModal.classList.remove('hidden');
      };
      document.getElementById('addNewCategoryInlineBtn').onclick = () => {
        renderCategoryManageUI();
        catModal.classList.remove('hidden');
      };
      document.getElementById('closeCategoryManageBtn').onclick = () => catModal.classList.add('hidden');
      document.getElementById('addNewCategoryBtn').onclick = addNewCategory;

      document.getElementById('detailImg').onclick = () => {
        const src = document.getElementById('detailImg').src;
        if (src) {
          const newTab = window.open();
          if (newTab) {
            newTab.document.body.innerHTML = `<body style="margin:0;background:#000;display:flex;align-items:center;justify-content:center;height:100vh;"><img src="${src}" style="max-width:100%;max-height:100%;object-fit:contain;"></body>`;
          }
        }
      };
    });
  </script>
</body>
</html>
