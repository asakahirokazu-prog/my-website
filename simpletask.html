<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>タスク</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '"Noto Sans JP"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* モーダルアニメーション用トランジション */
        .modal-backdrop {
            transition: opacity 0.2s ease-out;
        }
        .modal-panel {
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease-out;
        }
        /* カスタムスクロールバー（タスクリスト・サジェスト用） */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(203, 213, 225, 0.8);
            border-radius: 9999px;
        }
        /* タスク行のトランジション */
        .task-item {
            transition: background-color 0.15s ease;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased h-screen h-[100dvh] overflow-hidden flex flex-col items-center selection:bg-indigo-100 selection:text-indigo-700">

    <!-- メインアプリコンテナ（画面全体 100dvh、スクロールなし） -->
    <div class="w-full max-w-2xl h-full bg-white shadow-xl sm:border-x border-slate-200/80 flex flex-col overflow-hidden">

        <!-- =========================================================
             上部 3分の2（約66.7%）: タスク一覧エリア
             ========================================================= -->
        <section class="h-2/3 flex flex-col min-h-0 bg-white">
            <!-- ヘッダー（タイトル「タスク」・完了済み削除・フィルター） -->
            <header class="px-5 pt-5 pb-3.5 border-b border-slate-100 shrink-0 bg-white z-10">
                <div class="flex items-center justify-between mb-3.5">
                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900">タスク</h1>
                    <button
                        type="button"
                        id="clear-completed-btn"
                        class="hidden text-xs text-rose-500 hover:text-rose-600 hover:underline font-medium transition-colors py-1 px-2 rounded-lg hover:bg-rose-50"
                    >
                        完了済みを削除
                    </button>
                </div>

                <!-- フィルタータブ（未完了・完了・すべて / デフォルト: 未完了） -->
                <div class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl text-xs sm:text-sm" role="tablist">
                    <button type="button" data-filter="active" class="filter-tab py-1.5 rounded-lg font-semibold transition-all bg-white text-slate-800 shadow-xs">
                        未完了
                    </button>
                    <button type="button" data-filter="completed" class="filter-tab py-1.5 rounded-lg font-medium transition-all text-slate-500 hover:text-slate-800">
                        完了
                    </button>
                    <button type="button" data-filter="all" class="filter-tab py-1.5 rounded-lg font-medium transition-all text-slate-500 hover:text-slate-800">
                        すべて
                    </button>
                </div>
            </header>

            <!-- 内部スクロール可能なタスクリスト領域 -->
            <div class="flex-1 overflow-y-auto custom-scrollbar relative">
                <ul id="task-list" class="divide-y divide-slate-100">
                    <!-- JSで動的にタスクを描画 -->
                </ul>

                <!-- 空状態メッセージ -->
                <div id="empty-state" class="hidden h-full flex flex-col items-center justify-center p-6 text-center">
                    <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-slate-100 text-slate-400 mb-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                        </svg>
                    </div>
                    <p id="empty-state-text" class="text-sm font-semibold text-slate-600">未完了のタスクはありません</p>
                    <p class="text-xs text-slate-400 mt-1">下の大きなボタンから新しいタスクを追加できます</p>
                </div>
            </div>
        </section>

        <!-- =========================================================
             下部 3分の1（約33.3%）: 大きなタスク入力ボタンエリア
             ========================================================= -->
        <section class="h-1/3 shrink-0 p-4 sm:p-6 bg-slate-50/90 border-t border-slate-200/80 flex items-center justify-center">
            <button
                type="button"
                id="open-modal-btn"
                aria-label="新しいタスクを追加"
                class="group w-full h-full rounded-3xl bg-gradient-to-br from-indigo-600 via-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 active:scale-[0.98] text-white shadow-lg shadow-indigo-500/25 hover:shadow-xl hover:shadow-indigo-500/35 transition-all duration-200 flex flex-col items-center justify-center gap-2.5 cursor-pointer select-none focus:outline-none focus:ring-4 focus:ring-indigo-500/30"
            >
                <span class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-white/15 group-hover:bg-white/25 group-hover:scale-105 transition-all flex items-center justify-center backdrop-blur-xs">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 sm:h-8 sm:w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                    </svg>
                </span>
                <div class="text-center">
                    <span class="block text-lg sm:text-xl font-bold tracking-wide">＋ タスクを追加</span>
                    <span class="block text-[11px] sm:text-xs text-indigo-100/90 font-medium mt-0.5">タップして入力・候補から選択</span>
                </div>
            </button>
        </section>

    </div>

    <!-- =========================================================
         タスク入力モーダル（中央 / モバイルではボトムシート風）
         ========================================================= -->
    <div
        id="task-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
        class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center p-0 sm:p-4"
    >
        <!-- 背景オーバーレイ（クリックで閉じる） -->
        <div id="modal-backdrop" class="modal-backdrop fixed inset-0 bg-slate-900/50 backdrop-blur-xs opacity-0"></div>

        <!-- モーダル本体 -->
        <div id="modal-panel" class="modal-panel relative w-full sm:max-w-lg bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl border border-slate-100 p-5 sm:p-6 z-10 translate-y-8 sm:translate-y-4 opacity-0">
            <!-- モーダルヘッダー -->
            <div class="flex items-center justify-between mb-4">
                <h2 id="modal-title" class="text-base sm:text-lg font-bold text-slate-900 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-indigo-600"></span>
                    新しいタスクを追加
                </h2>
                <button
                    type="button"
                    id="close-modal-btn"
                    title="閉じる (Esc)"
                    aria-label="モーダルを閉じる"
                    class="p-2 -mr-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-full transition-colors"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- 入力フォーム & サジェスト -->
            <div class="relative">
                <!-- サジェスト候補エリア（入力欄の上に表示） -->
                <div id="suggestion-container" class="mb-3">
                    <div class="flex items-center justify-between px-1 mb-1.5">
                        <span id="suggestion-label" class="text-[11px] font-semibold text-slate-400 tracking-wider">最近の履歴・定型候補</span>
                    </div>
                    <ul
                        id="suggestion-list"
                        role="listbox"
                        class="bg-slate-50/80 rounded-2xl border border-slate-200/80 max-h-48 overflow-y-auto custom-scrollbar divide-y divide-slate-100"
                    >
                        <!-- JSでサジェスト項目を描画 -->
                    </ul>
                </div>

                <!-- 入力欄（下部に配置） -->
                <div class="relative flex items-center">
                    <input
                        type="text"
                        id="task-input"
                        autocomplete="off"
                        placeholder="タスクを入力... (Enterで即登録)"
                        class="w-full px-4 py-3.5 bg-slate-50 focus:bg-white text-slate-800 placeholder-slate-400 rounded-2xl border-2 border-slate-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all text-base"
                    />
                </div>
            </div>

            <!-- モーダルフッター（操作ボタン＆ヒント） -->
            <div class="mt-5 pt-3 border-t border-slate-100 flex items-center justify-between gap-3">
                <span class="text-[11px] text-slate-400 hidden sm:inline">
                    <kbd class="px-1.5 py-0.5 bg-slate-100 border border-slate-200 rounded text-slate-600 font-sans">Enter</kbd> で登録して閉じる
                </span>
                <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                    <button
                        type="button"
                        id="cancel-modal-btn"
                        class="px-4 py-2.5 text-sm font-medium text-slate-600 hover:text-slate-800 hover:bg-slate-100 rounded-xl transition-colors"
                    >
                        キャンセル
                    </button>
                    <button
                        type="button"
                        id="submit-task-btn"
                        class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-sm font-semibold rounded-xl shadow-sm transition-all"
                    >
                        登録する
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * シンプルタスク管理アプリケーション
         * - ドラッグ＆ドロップを廃止し、「一番上に移動」「一番下に移動」ボタンを搭載
         */
        document.addEventListener('DOMContentLoaded', () => {
            // --- ストレージキーとデフォルト定型サジェスト ---
            const STORAGE_KEY_TASKS = 'minimal_todo_tasks_v1';
            const STORAGE_KEY_HISTORY = 'minimal_todo_history_v1';
            const STORAGE_KEY_DISMISSED_PRESETS = 'minimal_todo_dismissed_presets_v1';

            const DEFAULT_SUGGESTIONS = [
                'メール返信',
                '会議資料作成',
                '経費精算',
                '買い物',
                '電話連絡',
                'レビュー依頼',
                '日報作成',
                'スケジュール調整',
                '備品発注',
                '請求書確認'
            ];

            // --- アプリケーション状態 ---
            let tasks = loadFromStorage(STORAGE_KEY_TASKS, []);
            let customHistory = loadFromStorage(STORAGE_KEY_HISTORY, []);
            let dismissedPresets = loadFromStorage(STORAGE_KEY_DISMISSED_PRESETS, []);
            let currentFilter = 'active'; // デフォルトは「未完了」
            let displayedSuggestions = [];
            let selectedSuggestionIndex = -1;
            let isComposing = false; // 日本語IME変換中フラグ
            let isModalOpen = false;

            // --- DOM要素の取得 ---
            const taskList = document.getElementById('task-list');
            const emptyState = document.getElementById('empty-state');
            const emptyStateText = document.getElementById('empty-state-text');
            const clearCompletedBtn = document.getElementById('clear-completed-btn');
            const filterTabs = document.querySelectorAll('.filter-tab');

            // モーダル関連DOM
            const openModalBtn = document.getElementById('open-modal-btn');
            const taskModal = document.getElementById('task-modal');
            const modalBackdrop = document.getElementById('modal-backdrop');
            const modalPanel = document.getElementById('modal-panel');
            const closeModalBtn = document.getElementById('close-modal-btn');
            const cancelModalBtn = document.getElementById('cancel-modal-btn');
            const submitTaskBtn = document.getElementById('submit-task-btn');
            const taskInput = document.getElementById('task-input');
            const suggestionContainer = document.getElementById('suggestion-container');
            const suggestionLabel = document.getElementById('suggestion-label');
            const suggestionList = document.getElementById('suggestion-list');

            // =========================================================
            // ローカルストレージ操作ユーティリティ
            // =========================================================
            function loadFromStorage(key, fallback) {
                try {
                    const raw = localStorage.getItem(key);
                    return raw ? JSON.parse(raw) : fallback;
                } catch (e) {
                    console.error('ストレージ読み込みエラー:', e);
                    return fallback;
                }
            }

            function saveToStorage(key, data) {
                try {
                    localStorage.setItem(key, JSON.stringify(data));
                } catch (e) {
                    console.error('ストレージ保存エラー:', e);
                }
            }

            function generateId() {
                if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                    return crypto.randomUUID();
                }
                return Date.now().toString(36) + Math.random().toString(36).substring(2);
            }

            // =========================================================
            // モーダル開閉制御
            // =========================================================
            function openModal() {
                if (isModalOpen) return;
                isModalOpen = true;

                taskInput.value = '';
                selectedSuggestionIndex = -1;
                updateSuggestions('');

                taskModal.classList.remove('hidden');
                taskModal.classList.add('flex');

                requestAnimationFrame(() => {
                    modalBackdrop.classList.remove('opacity-0');
                    modalBackdrop.classList.add('opacity-100');
                    modalPanel.classList.remove('translate-y-8', 'sm:translate-y-4', 'opacity-0');
                    modalPanel.classList.add('translate-y-0', 'opacity-100');
                });

                setTimeout(() => {
                    taskInput.focus();
                }, 40);
            }

            function closeModal() {
                if (!isModalOpen) return;
                isModalOpen = false;

                modalBackdrop.classList.remove('opacity-100');
                modalBackdrop.classList.add('opacity-0');
                modalPanel.classList.remove('translate-y-0', 'opacity-100');
                modalPanel.classList.add('translate-y-8', 'sm:translate-y-4', 'opacity-0');

                setTimeout(() => {
                    if (!isModalOpen) {
                        taskModal.classList.add('hidden');
                        taskModal.classList.remove('flex');
                        taskInput.blur();
                    }
                }, 200);
            }

            // =========================================================
            // タスクの追加・完了切替・一括削除・上下端への移動
            // =========================================================
            function addTask(rawText) {
                const text = (rawText || '').trim();
                if (!text) return;

                const newTask = {
                    id: generateId(),
                    text: text,
                    completed: false,
                    createdAt: Date.now()
                };

                tasks.unshift(newTask);
                saveToStorage(STORAGE_KEY_TASKS, tasks);

                customHistory = [text, ...customHistory.filter(item => item !== text)].slice(0, 30);
                saveToStorage(STORAGE_KEY_HISTORY, customHistory);

                renderTasks();
                closeModal();
            }

            function toggleTask(id) {
                tasks = tasks.map(task =>
                    task.id === id ? { ...task, completed: !task.completed } : task
                );
                saveToStorage(STORAGE_KEY_TASKS, tasks);
                renderTasks();
            }

            function clearCompletedTasks() {
                tasks = tasks.filter(task => !task.completed);
                saveToStorage(STORAGE_KEY_TASKS, tasks);
                renderTasks();
            }

            /**
             * 指定したタスクをリストの一番上に移動する
             */
            function moveTaskToTop(id) {
                const index = tasks.findIndex(t => t.id === id);
                if (index <= 0) return;
                const [targetTask] = tasks.splice(index, 1);
                tasks.unshift(targetTask);
                saveToStorage(STORAGE_KEY_TASKS, tasks);
                renderTasks();
            }

            /**
             * 指定したタスクをリストの一番下に移動する
             */
            function moveTaskToBottom(id) {
                const index = tasks.findIndex(t => t.id === id);
                if (index === -1 || index === tasks.length - 1) return;
                const [targetTask] = tasks.splice(index, 1);
                tasks.push(targetTask);
                saveToStorage(STORAGE_KEY_TASKS, tasks);
                renderTasks();
            }

            // =========================================================
            // サジェスト（履歴＆定型候補）ロジック
            // =========================================================
            function getAllCandidatePool() {
                const seen = new Set();
                const pool = [];

                for (const text of customHistory) {
                    if (!seen.has(text)) {
                        seen.add(text);
                        pool.push({ text, type: 'history' });
                    }
                }

                for (const text of DEFAULT_SUGGESTIONS) {
                    if (!dismissedPresets.includes(text) && !seen.has(text)) {
                        seen.add(text);
                        pool.push({ text, type: 'preset' });
                    }
                }

                return pool;
            }

            function deleteSuggestionItem(item) {
                if (item.type === 'history') {
                    customHistory = customHistory.filter(text => text !== item.text);
                    saveToStorage(STORAGE_KEY_HISTORY, customHistory);
                } else if (item.type === 'preset') {
                    if (!dismissedPresets.includes(item.text)) {
                        dismissedPresets.push(item.text);
                        saveToStorage(STORAGE_KEY_DISMISSED_PRESETS, dismissedPresets);
                    }
                }
                updateSuggestions(taskInput.value);
            }

            function updateSuggestions(query) {
                const trimmed = query.trim().toLowerCase();
                const pool = getAllCandidatePool();

                if (!trimmed) {
                    displayedSuggestions = pool.slice(0, 8);
                    suggestionLabel.textContent = '最近の履歴・定型候補';
                } else {
                    displayedSuggestions = pool
                        .filter(item => item.text.toLowerCase().includes(trimmed) && item.text.toLowerCase() !== trimmed)
                        .slice(0, 8);
                    suggestionLabel.textContent = '一致する候補';
                }

                selectedSuggestionIndex = -1;
                renderSuggestions(query.trim());
            }

            function highlightMatch(text, query) {
                if (!query) return escapeHtml(text);
                const lowerText = text.toLowerCase();
                const lowerQuery = query.toLowerCase();
                const idx = lowerText.indexOf(lowerQuery);
                if (idx === -1) return escapeHtml(text);

                const before = escapeHtml(text.slice(0, idx));
                const match = escapeHtml(text.slice(idx, idx + query.length));
                const after = escapeHtml(text.slice(idx + query.length));
                return `${before}<span class="font-bold text-indigo-600 bg-indigo-50 px-0.5 rounded">${match}</span>${after}`;
            }

            function renderSuggestions(rawQuery) {
                suggestionList.innerHTML = '';

                if (displayedSuggestions.length === 0) {
                    suggestionContainer.classList.add('hidden');
                    return;
                }

                suggestionContainer.classList.remove('hidden');

                displayedSuggestions.forEach((item, index) => {
                    const li = document.createElement('li');
                    const isSelected = index === selectedSuggestionIndex;

                    li.className = `flex items-center justify-between gap-2 px-3.5 py-2.5 text-sm cursor-pointer transition-colors ${
                        isSelected ? 'bg-indigo-100/80 text-indigo-900' : 'hover:bg-slate-100/90 text-slate-700'
                    }`;
                    li.setAttribute('role', 'option');
                    li.setAttribute('aria-selected', isSelected ? 'true' : 'false');

                    const mainArea = document.createElement('div');
                    mainArea.className = 'flex items-center gap-2.5 flex-1 min-w-0';

                    const iconHtml = item.type === 'history'
                        ? `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`
                        : `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-indigo-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>`;

                    const labelSpan = document.createElement('span');
                    labelSpan.className = 'truncate';
                    labelSpan.innerHTML = highlightMatch(item.text, rawQuery);

                    mainArea.innerHTML = iconHtml;
                    mainArea.appendChild(labelSpan);

                    const delBtn = document.createElement('button');
                    delBtn.type = 'button';
                    delBtn.title = '候補から削除';
                    delBtn.setAttribute('aria-label', `${item.text}を候補から削除`);
                    delBtn.className = 'p-1.5 -mr-1 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors shrink-0';
                    delBtn.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    `;

                    mainArea.addEventListener('click', (e) => {
                        e.stopPropagation();
                        addTask(item.text);
                    });

                    delBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        deleteSuggestionItem(item);
                    });

                    li.appendChild(mainArea);
                    li.appendChild(delBtn);
                    suggestionList.appendChild(li);
                });
            }

            // =========================================================
            // タスク一覧の描画（一番上へ・一番下へボタン付き）
            // =========================================================
            function renderTasks() {
                const hasCompleted = tasks.some(t => t.completed);
                if (hasCompleted) {
                    clearCompletedBtn.classList.remove('hidden');
                } else {
                    clearCompletedBtn.classList.add('hidden');
                }

                const filteredTasks = tasks.filter(task => {
                    if (currentFilter === 'active') return !task.completed;
                    if (currentFilter === 'completed') return task.completed;
                    return true;
                });

                taskList.innerHTML = '';

                if (filteredTasks.length === 0) {
                    emptyState.classList.remove('hidden');
                    if (currentFilter === 'active') {
                        emptyStateText.textContent = '未完了のタスクはありません';
                    } else if (currentFilter === 'completed') {
                        emptyStateText.textContent = '完了したタスクはありません';
                    } else {
                        emptyStateText.textContent = 'タスクはまだありません';
                    }
                    return;
                }

                emptyState.classList.add('hidden');

                filteredTasks.forEach((task, index) => {
                    const isFirstInView = index === 0;
                    const isLastInView = index === filteredTasks.length - 1;

                    const li = document.createElement('li');
                    li.dataset.taskId = task.id;
                    li.className = 'task-item group flex items-center gap-2.5 sm:gap-3 px-4 sm:px-5 py-3.5 bg-white hover:bg-slate-50/90 select-none';

                    // 1. 左側：タスクテキスト（タップでも完了切替可能）
                    const textSpan = document.createElement('span');
                    textSpan.textContent = task.text;
                    textSpan.className = `flex-1 min-w-0 text-sm sm:text-base break-words cursor-pointer py-1 transition-colors ${
                        task.completed ? 'line-through text-slate-400' : 'text-slate-800 font-medium'
                    }`;
                    textSpan.addEventListener('click', () => toggleTask(task.id));

                    // 2. 中央右寄り：一番上に移動・一番下に移動ボタン群
                    const moveBtnGroup = document.createElement('div');
                    moveBtnGroup.className = 'flex items-center gap-1 shrink-0';

                    // 一番上に移動するボタン
                    const moveTopBtn = document.createElement('button');
                    moveTopBtn.type = 'button';
                    moveTopBtn.title = '一番上に移動';
                    moveTopBtn.setAttribute('aria-label', '一番上に移動');
                    moveTopBtn.disabled = isFirstInView;
                    moveTopBtn.className = `p-1.5 rounded-lg border transition-all ${
                        isFirstInView
                            ? 'border-transparent text-slate-200 cursor-not-allowed'
                            : 'border-slate-200/80 text-slate-500 hover:text-indigo-600 hover:border-indigo-200 hover:bg-indigo-50/70 active:scale-90 bg-white'
                    }`;
                    moveTopBtn.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 4h14M12 8v12m0-12l-5 5m5-5l5 5" />
                        </svg>
                    `;
                    moveTopBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        moveTaskToTop(task.id);
                    });

                    // 一番下に移動するボタン
                    const moveBottomBtn = document.createElement('button');
                    moveBottomBtn.type = 'button';
                    moveBottomBtn.title = '一番下に移動';
                    moveBottomBtn.setAttribute('aria-label', '一番下に移動');
                    moveBottomBtn.disabled = isLastInView;
                    moveBottomBtn.className = `p-1.5 rounded-lg border transition-all ${
                        isLastInView
                            ? 'border-transparent text-slate-200 cursor-not-allowed'
                            : 'border-slate-200/80 text-slate-500 hover:text-indigo-600 hover:border-indigo-200 hover:bg-indigo-50/70 active:scale-90 bg-white'
                    }`;
                    moveBottomBtn.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 20h14M12 4v12m0 0l-5-5m5 5l5-5" />
                        </svg>
                    `;
                    moveBottomBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        moveTaskToBottom(task.id);
                    });

                    moveBtnGroup.appendChild(moveTopBtn);
                    moveBtnGroup.appendChild(moveBottomBtn);

                    // 3. 右端：完了チェックボックス
                    const checkBtn = document.createElement('button');
                    checkBtn.type = 'button';
                    checkBtn.setAttribute('role', 'checkbox');
                    checkBtn.setAttribute('aria-checked', task.completed ? 'true' : 'false');
                    checkBtn.setAttribute('aria-label', task.completed ? '未完了に戻す' : '完了にする');
                    checkBtn.className = `w-7 h-7 ml-0.5 rounded-xl border-2 flex items-center justify-center shrink-0 transition-all active:scale-90 ${
                        task.completed
                            ? 'bg-emerald-500 border-emerald-500 text-white shadow-xs'
                            : 'border-slate-300 hover:border-indigo-500 bg-white text-transparent'
                    }`;
                    checkBtn.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                        </svg>
                    `;
                    checkBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        toggleTask(task.id);
                    });

                    li.appendChild(textSpan);
                    li.appendChild(moveBtnGroup);
                    li.appendChild(checkBtn);
                    taskList.appendChild(li);
                });
            }

            // =========================================================
            // HTMLエスケープヘルパー
            // =========================================================
            function escapeHtml(str) {
                return str
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            // =========================================================
            // イベントリスナー登録
            // =========================================================

            openModalBtn.addEventListener('click', openModal);
            closeModalBtn.addEventListener('click', closeModal);
            cancelModalBtn.addEventListener('click', closeModal);
            modalBackdrop.addEventListener('click', closeModal);

            submitTaskBtn.addEventListener('click', () => {
                addTask(taskInput.value);
            });

            clearCompletedBtn.addEventListener('click', clearCompletedTasks);

            filterTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    currentFilter = tab.dataset.filter;

                    filterTabs.forEach(btn => {
                        const isActive = btn.dataset.filter === currentFilter;
                        if (isActive) {
                            btn.classList.remove('text-slate-500', 'hover:text-slate-800', 'font-medium');
                            btn.classList.add('bg-white', 'text-slate-800', 'shadow-xs', 'font-semibold');
                        } else {
                            btn.classList.remove('bg-white', 'text-slate-800', 'shadow-xs', 'font-semibold');
                            btn.classList.add('text-slate-500', 'hover:text-slate-800', 'font-medium');
                        }
                    });

                    renderTasks();
                });
            });

            taskInput.addEventListener('input', (e) => {
                updateSuggestions(e.target.value);
            });

            taskInput.addEventListener('compositionstart', () => {
                isComposing = true;
            });

            taskInput.addEventListener('compositionend', () => {
                isComposing = false;
            });

            taskInput.addEventListener('keydown', (e) => {
                if (isComposing || e.isComposing || e.keyCode === 229) {
                    return;
                }

                if (e.key === 'ArrowDown') {
                    if (displayedSuggestions.length > 0) {
                        e.preventDefault();
                        selectedSuggestionIndex = (selectedSuggestionIndex + 1) % displayedSuggestions.length;
                        taskInput.value = displayedSuggestions[selectedSuggestionIndex].text;
                        renderSuggestions('');
                    }
                } else if (e.key === 'ArrowUp') {
                    if (displayedSuggestions.length > 0) {
                        e.preventDefault();
                        selectedSuggestionIndex = selectedSuggestionIndex <= 0
                            ? displayedSuggestions.length - 1
                            : selectedSuggestionIndex - 1;
                        taskInput.value = displayedSuggestions[selectedSuggestionIndex].text;
                        renderSuggestions('');
                    }
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    addTask(taskInput.value);
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    closeModal();
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && isModalOpen) {
                    closeModal();
                }
            });

            renderTasks();
        });
    </script>
</body>
</html>
