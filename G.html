<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>マイルーム日記 - 気ままに綴るノート</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts (Inter & Noto Sans JP) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    textarea, input {
      user-select: text;
    }
    /* カスタムスクロールバー非表示（タブバー用） */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* アニメーション用トランジション */
    .modal-backdrop {
      transition: opacity 0.25s ease-out;
    }
    .modal-content {
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease-out;
    }
  </style>
</head>
<body class="bg-stone-100 text-stone-800 antialiased min-h-screen flex flex-col justify-between">

  <!-- メインコンテナ（スマホ最適化幅） -->
  <div class="w-full max-w-md mx-auto min-h-screen bg-stone-50 flex flex-col shadow-2xl relative border-x border-stone-200">
    
    <!-- ヘッダー -->
    <header class="sticky top-0 z-20 bg-stone-50/90 backdrop-blur-md px-5 py-4 border-b border-stone-200/80 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-xl bg-amber-700/10 flex items-center justify-center text-amber-800">
          <i data-lucide="book-open" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-stone-900 leading-tight">SwingVAR</h1>
        </div>
      </div>
      <button id="open-settings-btn" class="p-2.5 rounded-full hover:bg-stone-200/60 active:bg-stone-200 text-stone-600 transition-colors" title="テーマ設定">
        <i data-lucide="settings" class="w-5 h-5"></i>
      </button>
    </header>

    <!-- メインコンテンツ領域：過去の日記タイムライン -->
    <main class="flex-1 p-5 pb-28 overflow-y-auto">

      <!-- 日記エントリーリスト -->
      <div class="space-y-4" id="diary-list-container">
        <!-- JSで動的に追加されます -->
      </div>

      <!-- 空状態プレースホルダー -->
      <div id="empty-state" class="hidden flex-col items-center justify-center py-16 text-center text-stone-600 space-y-3">
        <div class="w-16 h-16 rounded-full bg-stone-100 flex items-center justify-center border border-dashed border-stone-300 text-stone-600 mb-1">
          <i data-lucide="feather" class="w-7 h-7"></i>
        </div>
        <p class="font-semibold text-stone-600">まだ日記がありません</p>
        <p class="text-xs text-stone-600 max-w-[200px]">下の「日記を書く」ボタンから最初のメモを記録してみましょう。</p>
      </div>
    </main>

    <!-- 下部固定アクションバー（スマホ用CTA） -->
    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-4 bg-gradient-to-t from-stone-50 via-stone-50/95 to-transparent pointer-events-none z-10 flex justify-center pb-6">
      <button id="open-write-modal-btn" class="pointer-events-auto w-full py-4 px-6 bg-stone-900 hover:bg-stone-800 active:scale-[0.98] text-white rounded-2xl shadow-xl shadow-stone-900/20 flex items-center justify-center gap-3 font-semibold tracking-wide transition-all duration-150">
        <i data-lucide="pen-tool" class="w-5 h-5"></i>
        <span>日記を書く</span>
      </button>
    </div>

    <!-- ============================================== -->
    <!-- 1. 日記作成・編集モーダル (全画面・タブ切り替え型) -->
    <!-- ============================================== -->
    <div id="write-modal" class="fixed inset-0 z-50 hidden flex-col justify-end pointer-events-none">
      <!-- バックドロップ -->
      <div id="write-modal-backdrop" class="modal-backdrop absolute inset-0 bg-stone-900/40 backdrop-blur-sm opacity-0 pointer-events-auto"></div>
      
      <!-- モーダル本体 (スマホで全画面近いシート) -->
      <div id="write-modal-card" class="modal-content relative bg-white w-full max-w-md mx-auto h-[92vh] max-h-[900px] rounded-t-[28px] shadow-2xl flex flex-col pointer-events-auto transform translate-y-full opacity-0 overflow-hidden border-t border-stone-200">
        
        <!-- モーダル上部バー -->
        <div class="px-5 pt-3 pb-2 flex flex-col border-b border-stone-100">
          <div class="w-10 h-1 bg-stone-300 rounded-full mx-auto mb-3"></div>
          <div class="flex items-center justify-between">
            <button id="cancel-write-btn" class="text-stone-500 hover:text-stone-800 text-sm font-medium px-2 py-1 -ml-2 rounded-lg">
              キャンセル
            </button>
            <div id="current-date-badge" class="text-xs font-semibold text-stone-500 bg-stone-100 px-3 py-1 rounded-full">
              <!-- 今日の日付がJSで入る -->
            </div>
            <button id="save-diary-btn" class="bg-amber-800 hover:bg-amber-900 active:scale-95 text-white text-sm font-semibold px-4 py-1.5 rounded-xl transition shadow-sm">
              保存する
            </button>
          </div>
        </div>

        <!-- テーマ切り替えタブ (最大5つを横スクロールまたは均等配置) -->
        <div class="bg-stone-50/80 border-b border-stone-200 px-4 py-2">
          <div id="theme-tabs-nav" class="flex gap-2 overflow-x-auto no-scrollbar items-center py-1">
            <!-- JSで動的生成 -->
          </div>
        </div>

        <!-- 1テーマ1画面の入力エリア（枠をなるべく大きく確保） -->
        <div class="flex-1 flex flex-col p-4 overflow-hidden relative">
          <!-- 現在選択中のテーマ情報 -->
          <div class="flex items-center justify-between mb-2">
            <span id="active-theme-label" class="text-xs font-bold uppercase tracking-wider text-amber-800 bg-amber-50 px-2.5 py-1 rounded-md border border-amber-200/60">
              テーマ名
            </span>
            <span id="char-counter" class="text-[11px] text-stone-600 font-mono">0 文字</span>
          </div>

          <!-- 各テーマの入力用テキストエリアコンテナ -->
          <div id="theme-textareas-container" class="flex-1 relative w-full h-full">
            <!-- JSで各テーマごとのtextareaが生成されます -->
          </div>
        </div>

        <!-- 下部ナビゲーション（前へ/次へテーマ移動ボタン） -->
        <div class="px-5 py-3 border-t border-stone-100 bg-stone-50 flex items-center justify-between text-xs text-stone-500">
          <button id="prev-tab-btn" class="flex items-center gap-1 py-1.5 px-3 rounded-lg hover:bg-stone-200/60 disabled:opacity-30 disabled:pointer-events-none transition font-medium">
            <i data-lucide="chevron-left" class="w-4 h-4"></i> 前のテーマ
          </button>
          <span id="theme-index-indicator" class="font-medium text-stone-600">1 / 3</span>
          <button id="next-tab-btn" class="flex items-center gap-1 py-1.5 px-3 rounded-lg hover:bg-stone-200/60 disabled:opacity-30 disabled:pointer-events-none transition font-medium">
            次のテーマ <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </button>
        </div>

      </div>
    </div>

    <!-- ============================================== -->
    <!-- 2. テーマ設定画面モーダル (1〜5個で自由に編集) -->
    <!-- ============================================== -->
    <div id="settings-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
      <div id="settings-modal-backdrop" class="modal-backdrop fixed inset-0 bg-stone-900/40 backdrop-blur-sm opacity-0"></div>
      
      <div id="settings-modal-card" class="modal-content relative bg-white w-full max-w-sm rounded-3xl shadow-2xl p-6 transform scale-95 opacity-0 z-10 border border-stone-200 max-h-[90vh] flex flex-col">
        <div class="flex items-center justify-between pb-3 border-b border-stone-100 mb-4">
          <div>
            <h2 class="text-base font-bold text-stone-900">テーマ設定</h2>
            <p class="text-xs text-stone-500 mt-0.5">1〜5個までテーマを設定できます</p>
          </div>
          <button id="close-settings-btn" class="p-1 rounded-full text-stone-600 hover:bg-stone-100">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <!-- テーマ入力リスト -->
        <div class="flex-1 overflow-y-auto space-y-3 pr-1" id="settings-themes-list">
          <!-- JSで動的生成 -->
        </div>

        <!-- テーマ追加ボタン -->
        <div class="mt-4 pt-2">
          <button id="add-theme-field-btn" class="w-full py-2.5 px-3 border border-dashed border-stone-300 rounded-xl text-xs font-semibold text-amber-900 bg-amber-50/50 hover:bg-amber-100/50 active:bg-amber-100 flex items-center justify-center gap-1.5 transition">
            <i data-lucide="plus" class="w-4 h-4"></i> 新しいテーマを追加 (最大5個)
          </button>
        </div>

        <!-- 保存ボタン -->
        <div class="mt-5 pt-3 border-t border-stone-100 flex gap-2">
          <button id="save-settings-btn" class="w-full py-3 bg-stone-900 hover:bg-stone-800 text-white font-medium text-sm rounded-xl shadow-md transition">
            テーマを保存する
          </button>
        </div>
      </div>
    </div>

    <!-- トースト通知 -->
    <div id="toast" class="fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-stone-900/90 backdrop-blur text-white px-4 py-2 rounded-full text-xs font-medium shadow-lg transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2">
      <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
      <span id="toast-message">保存しました</span>
    </div>

  </div>

  <script>
    /* =========================================================
       1. IndexedDB データベース管理
       ========================================================= */
    const DB_NAME = 'FlexibleDiaryDB';
    const DB_VERSION = 1;
    const STORE_ENTRIES = 'entries';
    const STORE_SETTINGS = 'settings';

    // デフォルトのテーマリスト（初回起動時）
    const DEFAULT_THEMES = [
      '今日あった出来事',
      '心に残った言葉・思考',
      '感謝・よかったこと'
    ];

    let db = null;

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = (event) => {
          const database = event.target.result;
          // 日記エントリーストア (キー: 日付/タイムスタンプ)
          if (!database.objectStoreNames.contains(STORE_ENTRIES)) {
            const entryStore = database.createObjectStore(STORE_ENTRIES, { keyPath: 'id' });
            entryStore.createIndex('createdAt', 'createdAt', { unique: false });
          }
          // 設定ストア (テーマ等の保持)
          if (!database.objectStoreNames.contains(STORE_SETTINGS)) {
            database.createObjectStore(STORE_SETTINGS, { keyPath: 'key' });
          }
        };

        request.onsuccess = (event) => {
          db = event.target.result;
          resolve(db);
        };

        request.onerror = (event) => {
          console.error('IndexedDB Error:', event.target.errorCode);
          reject(event.target.errorCode);
        };
      });
    }

    // テーマ設定の取得
    async function loadThemes() {
      return new Promise((resolve) => {
        if (!db) return resolve(DEFAULT_THEMES);
        const transaction = db.transaction([STORE_SETTINGS], 'readonly');
        const store = transaction.objectStore(STORE_SETTINGS);
        const req = store.get('user_themes');

        req.onsuccess = () => {
          if (req.result && Array.isArray(req.result.themes) && req.result.themes.length > 0) {
            resolve(req.result.themes);
          } else {
            resolve(DEFAULT_THEMES);
          }
        };
        req.onerror = () => resolve(DEFAULT_THEMES);
      });
    }

    // テーマ設定の保存
    async function saveThemesToDB(themes) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_SETTINGS], 'readwrite');
        const store = transaction.objectStore(STORE_SETTINGS);
        const req = store.put({ key: 'user_themes', themes: themes });

        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e);
      });
    }

    // すべての日記を取得
    async function getAllEntries() {
      return new Promise((resolve) => {
        if (!db) return resolve([]);
        const transaction = db.transaction([STORE_ENTRIES], 'readonly');
        const store = transaction.objectStore(STORE_ENTRIES);
        const req = store.getAll();

        req.onsuccess = () => {
          const list = req.result || [];
          // 作成日時の新しい順にソート
          list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
          resolve(list);
        };
        req.onerror = () => resolve([]);
      });
    }

    // 日記の保存
    async function saveEntryToDB(entry) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_ENTRIES], 'readwrite');
        const store = transaction.objectStore(STORE_ENTRIES);
        const req = store.put(entry);

        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e);
      });
    }

    // 日記の削除
    async function deleteEntryFromDB(id) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_ENTRIES], 'readwrite');
        const store = transaction.objectStore(STORE_ENTRIES);
        const req = store.delete(id);

        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e);
      });
    }

    /* =========================================================
       2. アプリケーション状態 & UI ロジック
       ========================================================= */
    let currentThemes = [...DEFAULT_THEMES];
    let currentActiveThemeIndex = 0;
    let temporaryThemeContents = {}; // { 'テーマ名': '入力値' }
    let editingEntryId = null; // 編集中の場合はID、新規はnull

    // 日付フォーマット関数
    function formatDate(dateObj) {
      const d = new Date(dateObj);
      const year = d.getFullYear();
      const month = ('0' + (d.getMonth() + 1)).slice(-2);
      const day = ('0' + d.getDate()).slice(-2);
      const days = ['日', '月', '火', '水', '木', '金', '土'];
      const dayOfWeek = days[d.getDay()];
      const hours = ('0' + d.getHours()).slice(-2);
      const minutes = ('0' + d.getMinutes()).slice(-2);
      return {
        formattedDate: `${year}.${month}.${day} (${dayOfWeek})`,
        formattedTime: `${hours}:${minutes}`,
        iso: d.toISOString()
      };
    }

    // トースト表示
    function showToast(message) {
      const toast = document.getElementById('toast');
      const msg = document.getElementById('toast-message');
      msg.textContent = message;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');

      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2200);
    }

    /* -----------------------------------------
       タイムライン描画
       ----------------------------------------- */
    async function renderTimeline() {
      const entries = await getAllEntries();
      const container = document.getElementById('diary-list-container');
      const emptyState = document.getElementById('empty-state');

      container.innerHTML = '';

      if (entries.length === 0) {
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
        return;
      }

      emptyState.classList.add('hidden');
      emptyState.classList.remove('flex');

      entries.forEach(entry => {
        const card = document.createElement('div');
        card.className = "bg-white border border-stone-200/90 rounded-2xl p-4 shadow-sm hover:shadow-md transition-shadow duration-200 relative";
        
        // テーマと内容の描画
        let themesHtml = '';
        const themeKeys = Object.keys(entry.contents || {});

        themeKeys.forEach(tName => {
          const val = entry.contents[tName];
          if (val && val.trim() !== '') {
            themesHtml += `
              <div class="mt-2.5 pt-2 border-t border-stone-100 first:border-none first:pt-0">
                <span class="inline-block text-[11px] font-semibold text-amber-900 bg-amber-50 px-2 py-0.5 rounded border border-amber-200/40 mb-1">
                  ${escapeHtml(tName)}
                </span>
                <p class="text-sm text-stone-700 whitespace-pre-wrap leading-relaxed">${escapeHtml(val)}</p>
              </div>
            `;
          }
        });

        if (themesHtml === '') {
          themesHtml = `<p class="text-xs text-stone-400 italic">（本文なし）</p>`;
        }

        const dateMeta = formatDate(entry.createdAt);

        card.innerHTML = `
          <div class="flex items-center justify-between pb-1.5">
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-stone-800">${dateMeta.formattedDate}</span>
              <span class="text-[11px] text-stone-600">${dateMeta.formattedTime}</span>
            </div>
            <div class="flex items-center space-x-1">
              <button class="edit-btn p-1.5 text-stone-600 hover:text-amber-800 rounded-lg hover:bg-stone-50" title="編集">
                <i data-lucide="edit-3" class="w-4 h-4"></i>
              </button>
              <button class="delete-btn p-1.5 text-stone-600 hover:text-red-500 rounded-lg hover:bg-red-50" title="削除">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
          <div class="mt-1">
            ${themesHtml}
          </div>
        `;

        // 編集ボタン
        card.querySelector('.edit-btn').addEventListener('click', () => {
          openWriteModal(entry);
        });

        // 削除ボタン
        card.querySelector('.delete-btn').addEventListener('click', async () => {
          // モーダル代わりのインライン確認
          if (confirm('この日記を削除しますか？')) {
            await deleteEntryFromDB(entry.id);
            showToast('日記を削除しました');
            renderTimeline();
          }
        });

        container.appendChild(card);
      });

      lucide.createIcons();
    }

    // HTMLエスケープ
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, function (m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    /* -----------------------------------------
       日記作成モーダル (1テーマ1画面 & タブ切り替え)
       ----------------------------------------- */
    function openWriteModal(existingEntry = null) {
      editingEntryId = existingEntry ? existingEntry.id : null;
      temporaryThemeContents = {};

      // 編集データまたは空のオブジェクトを初期化
      currentThemes.forEach(theme => {
        temporaryThemeContents[theme] = (existingEntry && existingEntry.contents && existingEntry.contents[theme]) || '';
      });

      // 日付バッジ
      const badge = document.getElementById('current-date-badge');
      if (existingEntry) {
        const meta = formatDate(existingEntry.createdAt);
        badge.textContent = `${meta.formattedDate} の編集`;
      } else {
        const meta = formatDate(new Date());
        badge.textContent = meta.formattedDate;
      }

      currentActiveThemeIndex = 0;
      buildModalTabsAndTextareas();

      // モーダルを開くアニメーション
      const modal = document.getElementById('write-modal');
      const backdrop = document.getElementById('write-modal-backdrop');
      const card = document.getElementById('write-modal-card');

      modal.classList.remove('hidden');
      modal.classList.add('flex');
      
      setTimeout(() => {
        backdrop.classList.remove('opacity-0');
        card.classList.remove('translate-y-full', 'opacity-0');
      }, 10);
    }

    function closeWriteModal() {
      const backdrop = document.getElementById('write-modal-backdrop');
      const card = document.getElementById('write-modal-card');
      const modal = document.getElementById('write-modal');

      backdrop.classList.add('opacity-0');
      card.classList.add('translate-y-full', 'opacity-0');

      setTimeout(() => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        editingEntryId = null;
      }, 300);
    }

    // モーダル内のタブおよびテキストエリア群の構築
    function buildModalTabsAndTextareas() {
      const tabsNav = document.getElementById('theme-tabs-nav');
      const textareasContainer = document.getElementById('theme-textareas-container');

      tabsNav.innerHTML = '';
      textareasContainer.innerHTML = '';

      currentThemes.forEach((theme, index) => {
        // 1. タブボタン作成
        const tabBtn = document.createElement('button');
        tabBtn.className = `px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all duration-200 border flex items-center gap-1.5`;
        tabBtn.setAttribute('data-tab-index', index);
        tabBtn.innerHTML = `<span>${escapeHtml(theme)}</span>`;
        
        tabBtn.addEventListener('click', () => {
          switchThemeTab(index);
        });

        tabsNav.appendChild(tabBtn);

        // 2. 1テーマ1画面用のテキストエリア作成（画面いっぱいのサイズ）
        const textareaWrapper = document.createElement('div');
        textareaWrapper.id = `theme-textarea-wrapper-${index}`;
        textareaWrapper.className = `w-full h-full absolute inset-0 flex flex-col transition-opacity duration-200 ${index === currentActiveThemeIndex ? 'opacity-100 z-10' : 'opacity-0 pointer-events-none z-0'}`;

        const textarea = document.createElement('textarea');
        textarea.className = "w-full flex-1 p-4 bg-stone-50/70 border border-stone-200 rounded-2xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-800/20 focus:border-amber-800 text-stone-800 placeholder-stone-400 text-base leading-relaxed resize-none shadow-inner transition";
        textarea.placeholder = `「${theme}」について気楽に書いてみましょう...\n(空欄のままでも保存できます)`;
        textarea.value = temporaryThemeContents[theme] || '';

        // 入力時の文字カウント & 一時保持更新
        textarea.addEventListener('input', (e) => {
          temporaryThemeContents[theme] = e.target.value;
          updateCharCount(e.target.value);
        });

        textareaWrapper.appendChild(textarea);
        textareasContainer.appendChild(textareaWrapper);
      });

      switchThemeTab(currentActiveThemeIndex);
    }

    // タブ切り替え処理
    function switchThemeTab(targetIndex) {
      if (targetIndex < 0 || targetIndex >= currentThemes.length) return;
      currentActiveThemeIndex = targetIndex;

      const tabs = document.querySelectorAll('#theme-tabs-nav button');
      tabs.forEach((tab, i) => {
        if (i === targetIndex) {
          tab.className = "px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all duration-200 border bg-stone-900 text-white border-stone-900 shadow-sm";
          // タブが隠れていたらスクロール
          tab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        } else {
          tab.className = "px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all duration-200 border bg-white text-stone-600 border-stone-200 hover:bg-stone-100";
        }
      });

      // 表示テキストエリアの切り替え
      currentThemes.forEach((_, i) => {
        const wrapper = document.getElementById(`theme-textarea-wrapper-${i}`);
        if (!wrapper) return;
        if (i === targetIndex) {
          wrapper.classList.remove('opacity-0', 'pointer-events-none', 'z-0');
          wrapper.classList.add('opacity-100', 'z-10');
          const ta = wrapper.querySelector('textarea');
          updateCharCount(ta.value);
        } else {
          wrapper.classList.remove('opacity-100', 'z-10');
          wrapper.classList.add('opacity-0', 'pointer-events-none', 'z-0');
        }
      });

      // テーマラベルとインジケーターの更新
      document.getElementById('active-theme-label').textContent = currentThemes[targetIndex];
      document.getElementById('theme-index-indicator').textContent = `${targetIndex + 1} / ${currentThemes.length}`;

      // ボタンの無効化・有効化
      document.getElementById('prev-tab-btn').disabled = (targetIndex === 0);
      document.getElementById('next-tab-btn').disabled = (targetIndex === currentThemes.length - 1);
    }

    function updateCharCount(text) {
      const counter = document.getElementById('char-counter');
      counter.textContent = `${(text || '').length} 文字`;
    }

    // 日記の保存処理
    async function handleSaveDiary() {
      // 全テーマの入力内容を再収集
      let hasContent = false;
      currentThemes.forEach((theme, index) => {
        const wrapper = document.getElementById(`theme-textarea-wrapper-${index}`);
        if (wrapper) {
          const val = wrapper.querySelector('textarea').value;
          temporaryThemeContents[theme] = val;
          if (val.trim() !== '') hasContent = true;
        }
      });

      if (!hasContent) {
        showToast('何か1文字以上入力してください');
        return;
      }

      const now = new Date();
      const entryData = {
        id: editingEntryId || 'diary_' + Date.now(),
        createdAt: editingEntryId ? undefined : now.toISOString(),
        updatedAt: now.toISOString(),
        contents: { ...temporaryThemeContents }
      };

      // 編集時の既存createdAt維持
      if (editingEntryId) {
        const all = await getAllEntries();
        const existing = all.find(e => e.id === editingEntryId);
        if (existing) {
          entryData.createdAt = existing.createdAt;
        }
      }

      await saveEntryToDB(entryData);
      closeWriteModal();
      showToast(editingEntryId ? '日記を更新しました' : '日記を保存しました');
      renderTimeline();
    }

    /* -----------------------------------------
       3. 設定モーダル（テーマのカスタマイズ 1〜5個）
       ----------------------------------------- */
    function openSettingsModal() {
      renderSettingsThemeInputs();
      const modal = document.getElementById('settings-modal');
      const backdrop = document.getElementById('settings-modal-backdrop');
      const card = document.getElementById('settings-modal-card');

      modal.classList.remove('hidden');
      setTimeout(() => {
        backdrop.classList.remove('opacity-0');
        card.classList.remove('scale-95', 'opacity-0');
      }, 10);
    }

    function closeSettingsModal() {
      const backdrop = document.getElementById('settings-modal-backdrop');
      const card = document.getElementById('settings-modal-card');
      const modal = document.getElementById('settings-modal');

      backdrop.classList.add('opacity-0');
      card.classList.add('scale-95', 'opacity-0');

      setTimeout(() => {
        modal.classList.add('hidden');
      }, 250);
    }

    // 設定画面の入力フィールドをレンダリング
    function renderSettingsThemeInputs() {
      const container = document.getElementById('settings-themes-list');
      container.innerHTML = '';

      currentThemes.forEach((theme, index) => {
        const row = document.createElement('div');
        row.className = "flex items-center gap-2";
        row.innerHTML = `
          <div class="w-6 h-6 rounded-full bg-stone-200/80 flex items-center justify-center text-xs font-semibold text-stone-600 flex-shrink-0">
            ${index + 1}
          </div>
          <input type="text" maxlength="24" value="${escapeHtml(theme)}" class="theme-input flex-1 px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-800/20 focus:border-amber-800 text-stone-800" placeholder="テーマ名を入力">
          <button class="delete-theme-btn p-2 text-stone-600 hover:text-red-500 rounded-lg hover:bg-stone-100 disabled:opacity-20 disabled:pointer-events-none" ${currentThemes.length <= 1 ? 'disabled' : ''} title="削除">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        `;

        // 削除アクション
        row.querySelector('.delete-theme-btn').addEventListener('click', () => {
          if (currentThemes.length <= 1) return;
          collectCurrentSettingsInputs();
          currentThemes.splice(index, 1);
          renderSettingsThemeInputs();
        });

        container.appendChild(row);
      });

      // 最大5つの制限
      const addBtn = document.getElementById('add-theme-field-btn');
      if (currentThemes.length >= 5) {
        addBtn.classList.add('opacity-40', 'pointer-events-none');
      } else {
        addBtn.classList.remove('opacity-40', 'pointer-events-none');
      }

      lucide.createIcons();
    }

    function collectCurrentSettingsInputs() {
      const inputs = document.querySelectorAll('#settings-themes-list .theme-input');
      const list = [];
      inputs.forEach(inp => {
        const val = inp.value.trim();
        if (val) list.push(val);
      });
      currentThemes = list;
    }

    // 新規テーマ枠追加
    document.getElementById('add-theme-field-btn').addEventListener('click', () => {
      collectCurrentSettingsInputs();
      if (currentThemes.length < 5) {
        currentThemes.push(`テーマ ${currentThemes.length + 1}`);
        renderSettingsThemeInputs();
      }
    });

    // 設定保存ボタン
    document.getElementById('save-settings-btn').addEventListener('click', async () => {
      collectCurrentSettingsInputs();

      if (currentThemes.length === 0) {
        showToast('テーマは最低1つ必要です');
        return;
      }

      await saveThemesToDB(currentThemes);
      closeSettingsModal();
      showToast('テーマ設定を保存しました');
    });

    /* =========================================================
       4. イベントリスナー初期化 & 起動
       ========================================================= */
    document.addEventListener('DOMContentLoaded', async () => {
      // アイコン描画
      lucide.createIcons();

      // DB初期化
      try {
        await initDB();
        currentThemes = await loadThemes();
      } catch (e) {
        console.error('DB初期化エラー:', e);
      }

      // 日記タイムライン描画
      await renderTimeline();

      // 書くボタン
      document.getElementById('open-write-modal-btn').addEventListener('click', () => {
        openWriteModal();
      });

      // モーダルキャンセル
      document.getElementById('cancel-write-btn').addEventListener('click', closeWriteModal);
      document.getElementById('write-modal-backdrop').addEventListener('click', closeWriteModal);

      // モーダル保存
      document.getElementById('save-diary-btn').addEventListener('click', handleSaveDiary);

      // テーマナビゲーション (前へ/次へ)
      document.getElementById('prev-tab-btn').addEventListener('click', () => {
        switchThemeTab(currentActiveThemeIndex - 1);
      });
      document.getElementById('next-tab-btn').addEventListener('click', () => {
        switchThemeTab(currentActiveThemeIndex + 1);
      });

      // 設定モーダル操作
      document.getElementById('open-settings-btn').addEventListener('click', openSettingsModal);
      document.getElementById('close-settings-btn').addEventListener('click', closeSettingsModal);
      document.getElementById('settings-modal-backdrop').addEventListener('click', closeSettingsModal);
    });
  </script>
</body>
</html>
