<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swing-VAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }
        /* Prevent font scaling/zooming on mobile inputs */
        input, textarea {
            font-size: 16px !important;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-200 text-slate-800 h-full overflow-hidden flex flex-col justify-between select-none">

    <header class="bg-white/90 backdrop-blur-md border-b border-emerald-100/80 px-4 py-3 flex items-center justify-between shrink-0 shadow-xs">
        <div class="flex items-center space-x-2">
            <span class="text-emerald-600 text-xl font-bold">⛳️</span>
            <h1 id="app-title" class="text-base font-bold tracking-wide text-slate-700">Swing-VAR</h1>
        </div>
        <div id="header-right">
            <!-- Home button placed on the right side of the header title area when in category view -->
            <button id="btn-header-home" onclick="app.goHome()" class="hidden bg-white/90 hover:bg-slate-50 active:scale-95 text-slate-700 px-3.5 py-1.5 rounded-xl text-xs font-semibold items-center space-x-1.5 border border-slate-200/80 shadow-xs transition-all flex">
                <span>🏠</span>
                <span>ホーム</span>
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto relative p-4 flex flex-col justify-center max-w-md mx-auto w-full">

        <div id="view-home" class="flex flex-col justify-center space-y-4 h-full py-2">
            <div class="text-center mb-1">
                <p class="text-xs text-slate-600 font-medium">練習するクラブカテゴリを選択してください</p>
            </div>
            
            <div class="grid grid-cols-2 gap-3.5 flex-1 max-h-[320px]">
                <button onclick="app.selectCategory('ドライバー')" class="group relative bg-gradient-to-br from-emerald-400 to-teal-500 hover:from-emerald-300 hover:to-teal-400 active:scale-95 transition-all rounded-2xl p-4 flex flex-col justify-center shadow-md shadow-emerald-500/20 border border-emerald-300/60">
                    <div class="text-center">
                        <div class="text-lg font-bold text-white drop-shadow-xs">ドライバー</div>
                        <div class="text-[10px] text-emerald-50 font-medium">最大飛距離・方向性</div>
                    </div>
                </button>

                <button onclick="app.selectCategory('アイアン')" class="group relative bg-gradient-to-br from-cyan-400 to-blue-500 hover:from-cyan-300 hover:to-blue-400 active:scale-95 transition-all rounded-2xl p-4 flex flex-col justify-center shadow-md shadow-blue-500/20 border border-sky-300/60">
                    <div class="text-center">
                        <div class="text-lg font-bold text-white drop-shadow-xs">アイアン</div>
                        <div class="text-[10px] text-sky-50 font-medium">縦の距離感・正確性</div>
                    </div>
                </button>

                <button onclick="app.selectCategory('ウェッジ')" class="group relative bg-gradient-to-br from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 active:scale-95 transition-all rounded-2xl p-4 flex flex-col justify-center shadow-md shadow-amber-500/20 border border-amber-300/60">
                    <div class="text-center">
                        <div class="text-lg font-bold text-white drop-shadow-xs">ウェッジ</div>
                        <div class="text-[10px] text-amber-50 font-medium">アプローチ・距離刻み</div>
                    </div>
                </button>

                <button onclick="app.selectCategory('パター')" class="group relative bg-gradient-to-br from-violet-400 to-purple-500 hover:from-violet-300 hover:to-purple-400 active:scale-95 transition-all rounded-2xl p-4 flex flex-col justify-center shadow-md shadow-purple-500/20 border border-purple-300/60">
                    <div class="text-center">
                        <div class="text-lg font-bold text-white drop-shadow-xs">パター</div>
                        <div class="text-[10px] text-purple-50 font-medium">方向・タッチ・傾斜</div>
                    </div>
                </button>
            </div>
        </div>

        <div id="view-category" class="hidden flex flex-col h-full justify-between py-0.5">
            
            <div id="container-form" class="flex flex-col space-y-3 flex-1 justify-start pt-0">
                <!-- Registration date indicator -->
                <div id="form-date-indicator" class="text-xs font-semibold text-emerald-700 px-1 hidden">
                    登録日時: <span id="form-date-text">-</span>
                </div>

                <!-- Tab Navigation Buttons -->
                <div class="flex rounded-xl bg-slate-300/70 p-1 space-x-1 shrink-0">
                    <button type="button" id="tab-btn-address" onclick="app.switchTab('address')" class="flex-1 py-1.5 px-2 text-xs font-semibold rounded-lg text-slate-700 transition-all shadow-xs bg-white text-emerald-700">アドレス</button>
                    <button type="button" id="tab-btn-swing" onclick="app.switchTab('swing')" class="flex-1 py-1.5 px-2 text-xs font-semibold rounded-lg text-slate-700 transition-all">スイング</button>
                    <button type="button" id="tab-btn-diary" onclick="app.switchTab('diary')" class="flex-1 py-1.5 px-2 text-xs font-semibold rounded-lg text-slate-700 transition-all">日記</button>
                </div>

                <!-- Tab Contents -->
                <div id="tab-content-address" class="space-y-0.5 flex-1 flex flex-col">
                    <div class="flex items-center justify-between px-1 mb-1">
                        <label class="block text-xs font-semibold text-slate-700">
                            ■ アドレスの課題・意識
                        </label>
                        <div class="flex items-center space-x-1.5">
                            <button onclick="app.registerData()" type="button" class="bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 active:scale-95 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-md border border-emerald-300 transition-all shadow-xs flex items-center space-x-1">
                                <span>登録</span>
                                <span>✨</span>
                            </button>
                            <button onclick="app.copyAddressData()" type="button" class="bg-emerald-100 hover:bg-emerald-200 active:scale-95 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded-md border border-emerald-300 transition-all shadow-xs flex items-center space-x-1">
                                <span>📋</span>
                                <span>コピー</span>
                            </button>
                        </div>
                    </div>
                    <textarea id="input-address" rows="5" placeholder="例：ボール位置が左すぎないか確認。スタンス幅を肩幅に。" class="w-full flex-1 bg-white border border-slate-200/80 rounded-2xl p-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-emerald-400 focus:ring-2 focus:ring-emerald-300/40 resize-none shadow-[0_6px_20px_rgba(0,0,0,0.05),inset_0_1px_2px_rgba(255,255,255,0.8)] transition-all"></textarea>
                </div>

                <div id="tab-content-swing" class="space-y-0.5 flex-1 flex flex-col hidden">
                    <div class="flex items-center justify-between px-1 mb-1">
                        <label class="block text-xs font-semibold text-slate-700">
                            ■ スイングの課題・意識
                        </label>
                        <div class="flex items-center space-x-1.5">
                            <button onclick="app.registerData()" type="button" class="bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 active:scale-95 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-md border border-emerald-300 transition-all shadow-xs flex items-center space-x-1">
                                <span>登録</span>
                                <span>✨</span>
                            </button>
                            <button onclick="app.copySwingData()" type="button" class="bg-emerald-100 hover:bg-emerald-200 active:scale-95 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded-md border border-emerald-300 transition-all shadow-xs flex items-center space-x-1">
                                <span>📋</span>
                                <span>コピー</span>
                            </button>
                        </div>
                    </div>
                    <textarea id="input-swing" rows="5" placeholder="例：トップで右脇が開かないように回す。フィニッシュまで振り切る。" class="w-full flex-1 bg-white border border-slate-200/80 rounded-2xl p-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-emerald-400 focus:ring-2 focus:ring-emerald-300/40 resize-none shadow-[0_6px_20px_rgba(0,0,0,0.05),inset_0_1px_2px_rgba(255,255,255,0.8)] transition-all"></textarea>
                </div>

                <div id="tab-content-diary" class="space-y-0.5 flex-1 flex flex-col hidden">
                    <div class="flex items-center justify-between px-1 mb-1">
                        <label class="block text-xs font-semibold text-slate-700">
                            ■ 日記
                        </label>
                        <div class="flex items-center space-x-1.5">
                            <button onclick="app.registerData()" type="button" class="bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 active:scale-95 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-md border border-emerald-300 transition-all shadow-xs flex items-center space-x-1">
                                <span>登録</span>
                                <span>✨</span>
                            </button>
                            <button onclick="app.copyDiaryData()" type="button" class="bg-emerald-100 hover:bg-emerald-200 active:scale-95 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded-md border border-emerald-300 transition-all shadow-xs flex items-center space-x-1">
                                <span>📋</span>
                                <span>コピー</span>
                            </button>
                        </div>
                    </div>
                    <textarea id="input-diary" rows="5" placeholder="例：今日はドライバーの捕まりが良くて飛距離が伸びた。" class="w-full flex-1 bg-white border border-slate-200/80 rounded-2xl p-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-emerald-400 focus:ring-2 focus:ring-emerald-300/40 resize-none shadow-[0_6px_20px_rgba(0,0,0,0.05),inset_0_1px_2px_rgba(255,255,255,0.8)] transition-all"></textarea>
                </div>

                <div class="flex items-center justify-end space-x-2 pt-0.5">
                    <div class="flex items-center space-x-1 shrink-0">
                        <button onclick="app.prevHistoryFromInput()" title="一つ前のデータ" class="bg-white hover:bg-slate-50 active:scale-95 text-slate-700 w-11 h-11 rounded-2xl text-sm font-bold flex items-center justify-center border border-slate-200 shadow-xs transition-all">
                            ＜
                        </button>
                        <span id="label-history-index" class="text-xs font-semibold text-slate-600 px-1 text-center min-w-[36px]">0/0</span>
                        <button onclick="app.nextHistoryFromInput()" title="次（新しい）のデータ" class="bg-white hover:bg-slate-50 active:scale-95 text-slate-700 w-11 h-11 rounded-2xl text-sm font-bold flex items-center justify-center border border-slate-200 shadow-xs transition-all">
                            ＞
                        </button>
                    </div>
                </div>
            </div>

            <!-- Bottom area placeholder since Home button was relocated to header right -->
            <div class="pt-1 flex items-center justify-between shrink-0"></div>

        </div>

    </main>

    <div id="toast" class="fixed top-12 left-1/2 -translate-x-1/2 bg-emerald-500 text-white text-xs font-semibold px-4 py-2 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300 z-50 border border-emerald-400">
        登録しました！
    </div>

    <script>
        class GolfSwingApp {
            constructor() {
                this.db = null;
                this.currentCategory = null;
                this.histories = [];
                this.currentIndex = -1; // -1 means currently viewing the new blank input state
                this.currentTab = 'address'; // 'address', 'swing', 'diary'
                
                this.initDB();
            }

            // Switch tabs in category view
            switchTab(tabName) {
                this.currentTab = tabName;
                
                const tabs = ['address', 'swing', 'diary'];
                tabs.forEach(t => {
                    const btn = document.getElementById(`tab-btn-${t}`);
                    const content = document.getElementById(`tab-content-${t}`);
                    if (t === tabName) {
                        btn.className = 'flex-1 py-1.5 px-2 text-xs font-semibold rounded-lg text-slate-700 transition-all shadow-xs bg-white text-emerald-700';
                        content.classList.remove('hidden');
                        content.classList.add('flex');
                    } else {
                        btn.className = 'flex-1 py-1.5 px-2 text-xs font-semibold rounded-lg text-slate-700 transition-all text-slate-500 hover:text-slate-700';
                        content.classList.remove('flex');
                        content.classList.add('hidden');
                    }
                });
            }

            // Initialize IndexedDB
            initDB() {
                const request = indexedDB.open('GolfSwingDB', 3);
                
                request.onerror = (event) => {
                    console.error("Database error: " + event.target.errorCode);
                };

                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains('swings')) {
                        const store = db.createObjectStore('swings', { keyPath: 'id', autoIncrement: true });
                        store.createIndex('category', 'category', { unique: false });
                        store.createIndex('timestamp', 'timestamp', { unique: false });
                    } else {
                        const store = event.target.transaction.objectStore('swings');
                        if (!store.index('category')) {
                            store.createIndex('category', 'category', { unique: false });
                        }
                    }
                };

                request.onsuccess = (event) => {
                    this.db = event.target.result;
                };
            }

            // Select club category from home screen
            selectCategory(category) {
                this.currentCategory = category;
                
                document.getElementById('app-title').textContent = `${category}の課題`;
                // Show header home button when in category view
                document.getElementById('btn-header-home').classList.remove('hidden');
                document.getElementById('btn-header-home').classList.add('flex');
                
                document.getElementById('view-home').classList.add('hidden');
                document.getElementById('view-category').classList.remove('hidden');
                
                this.clearForm();
                this.loadHistories(() => {
                    this.currentIndex = -1;
                    this.updateInputIndicator();
                });
            }

            // Return to home screen
            goHome() {
                this.currentCategory = null;
                
                document.getElementById('app-title').textContent = 'Swing-VAR';
                // Hide header home button when back on home view
                document.getElementById('btn-header-home').classList.remove('flex');
                document.getElementById('btn-header-home').classList.add('hidden');
                
                document.getElementById('view-category').classList.add('hidden');
                document.getElementById('view-home').classList.remove('hidden');
            }

            // Clear input form fields
            clearForm() {
                document.getElementById('input-address').value = '';
                document.getElementById('input-swing').value = '';
                document.getElementById('input-diary').value = '';
                this.currentIndex = -1;
                const dateIndicator = document.getElementById('form-date-indicator');
                dateIndicator.classList.add('hidden');
                this.updateInputIndicator();
            }

            // Copy only address data
            copyAddressData() {
                const address = document.getElementById('input-address').value.trim();
                if (!address) {
                    this.showToast('コピーするアドレス内容がありません', true);
                    return;
                }
                this.executeCopy(address);
            }

            // Copy only swing data
            copySwingData() {
                const swing = document.getElementById('input-swing').value.trim();
                if (!swing) {
                    this.showToast('コピーするスイング内容がありません', true);
                    return;
                }
                this.executeCopy(swing);
            }

            // Copy only diary data
            copyDiaryData() {
                const diary = document.getElementById('input-diary').value.trim();
                if (!diary) {
                    this.showToast('コピーする日記内容がありません', true);
                    return;
                }
                this.executeCopy(diary);
            }

            // Execute copy action
            executeCopy(textToCopy) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(textToCopy).then(() => {
                        this.showToast('クリップボードにコピーしました！');
                    }).catch(() => {
                        this.fallbackCopyText(textToCopy);
                    });
                } else {
                    this.fallbackCopyText(textToCopy);
                }
            }

            // Fallback copy method using execCommand
            fallbackCopyText(text) {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";  // Avoid scrolling to bottom
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    const successful = document.execCommand('copy');
                    if (successful) {
                        this.showToast('クリップボードにコピーしました！');
                    } else {
                        this.showToast('コピーに失敗しました', true);
                    }
                } catch (err) {
                    this.showToast('コピーに失敗しました', true);
                }
                document.body.removeChild(textArea);
            }

            // Register data to IndexedDB
            registerData() {
                if (document.activeElement && typeof document.activeElement.blur === 'function') {
                    document.activeElement.blur();
                }
                
                const viewportMeta = document.querySelector('meta[name="viewport"]');
                if (viewportMeta) {
                    viewportMeta.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
                }

                const address = document.getElementById('input-address').value.trim();
                const swing = document.getElementById('input-swing').value.trim();
                const diary = document.getElementById('input-diary').value.trim();

                if (!address && !swing && !diary) {
                    this.showToast('アドレス、スイング、または日記を入力してください', true);
                    return;
                }

                if (this.currentIndex !== -1 && this.histories[this.currentIndex]) {
                    const item = this.histories[this.currentIndex];
                    item.address = address || '（未入力）';
                    item.swing = swing || '（未入力）';
                    item.diary = diary || '（未入力）';

                    const transaction = this.db.transaction(['swings'], 'readwrite');
                    const store = transaction.objectStore('swings');
                    const request = store.put(item);

                    request.onsuccess = () => {
                        this.showToast('更新しました！');
                        this.loadHistories(() => {
                            this.updateInputIndicator();
                        });
                    };
                    request.onerror = () => {
                        this.showToast('更新に失敗しました', true);
                    };
                    return;
                }

                const record = {
                    category: this.currentCategory,
                    address: address || '（未入力）',
                    swing: swing || '（未入力）',
                    diary: diary || '（未入力）',
                    count: 0,
                    timestamp: new Date().getTime()
                };

                const transaction = this.db.transaction(['swings'], 'readwrite');
                const store = transaction.objectStore('swings');
                const request = store.add(record);

                request.onsuccess = () => {
                    this.clearForm();
                    this.showToast('登録しました！');
                    this.loadHistories(() => {
                        this.currentIndex = -1;
                        this.updateInputIndicator();
                    });
                };

                request.onerror = (event) => {
                    console.error("Error adding record: ", event.target.error);
                    this.showToast('登録に失敗しました', true);
                };
            }

            // Load histories for current category from IndexedDB
            loadHistories(callback) {
                if (!this.db || !this.currentCategory) return;

                const transaction = this.db.transaction(['swings'], 'readonly');
                const store = transaction.objectStore('swings');
                const index = store.index('category');
                const request = index.getAll(this.currentCategory);

                request.onsuccess = (event) => {
                    this.histories = event.target.result.sort((a, b) => b.timestamp - a.timestamp);
                    if (callback) callback();
                };
            }

            // Previous history item (<) clicked from input screen
            prevHistoryFromInput() {
                if (this.histories.length === 0) {
                    this.showToast('保存されたデータがありません', true);
                    return;
                }
                
                if (this.currentIndex === -1) {
                    this.currentIndex = 0;
                } else {
                    if (this.currentIndex >= this.histories.length - 1) {
                        this.showToast('一番古い履歴です', true);
                        return;
                    }
                    this.currentIndex++;
                }

                this.loadCurrentHistoryItemToForm();
            }

            // Next history item (>) clicked from input screen
            nextHistoryFromInput() {
                if (this.histories.length === 0) {
                    this.showToast('保存されたデータがありません', true);
                    return;
                }
                
                if (this.currentIndex === -1) {
                    this.showToast('一番新しい履歴です', true);
                    return;
                }

                if (this.currentIndex > 0) {
                    this.currentIndex--;
                    this.loadCurrentHistoryItemToForm();
                } else {
                    this.currentIndex = -1;
                    this.clearForm();
                    this.updateInputIndicator();
                    this.showToast('新しい入力画面に戻りました');
                }
            }

            // Helper to populate form fields with selected history item
            loadCurrentHistoryItemToForm() {
                const item = this.histories[this.currentIndex];
                const dateObj = new Date(item.timestamp);
                const dateStr = dateObj.toLocaleString('ja-JP', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
                
                document.getElementById('input-address').value = item.address === '（未入力）' ? '' : item.address;
                document.getElementById('input-swing').value = item.swing === '（未入力）' ? '' : item.swing;
                document.getElementById('input-diary').value = item.diary === '（未入力）' || !item.diary ? '' : item.diary;
                
                const dateIndicator = document.getElementById('form-date-indicator');
                const dateTextSpan = document.getElementById('form-date-text');
                dateTextSpan.textContent = dateStr;

                // Check if the record date is today
                const now = new Date();
                const isToday = dateObj.getFullYear() === now.getFullYear() &&
                                dateObj.getMonth() === now.getMonth() &&
                                dateObj.getDate() === now.getDate();

                if (isToday) {
                    dateIndicator.className = 'text-xs font-bold text-white bg-blue-600 px-3 py-1.5 rounded-xl flex items-center justify-between shadow-sm';
                } else {
                    dateIndicator.className = 'text-xs font-semibold text-emerald-700 px-1';
                }

                dateIndicator.classList.remove('hidden');

                this.updateInputIndicator();
                this.showToast(`[${dateStr}] のデータを読み込みました`);
            }

            // Update input mode record indicator text and n/n display
            updateInputIndicator() {
                const total = this.histories.length;
                const indexLabel = document.getElementById('label-history-index');

                if (total === 0) {
                    if (indexLabel) indexLabel.textContent = '0/0';
                } else if (this.currentIndex === -1) {
                    if (indexLabel) indexLabel.textContent = `新/${total}`;
                } else {
                    if (indexLabel) indexLabel.textContent = `${this.currentIndex + 1}/${total}`;
                }
            }

            // Update total records count on home screen
            showToast(message, isError = false) {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = `fixed top-12 left-1/2 -translate-x-1/2 text-white text-xs font-semibold px-4 py-2 rounded-full shadow-lg opacity-100 transition-all duration-300 z-50 ${isError ? 'bg-rose-500 border border-rose-400' : 'bg-emerald-500 border border-emerald-400'}`;
                
                setTimeout(() => {
                    toast.className = toast.className.replace('opacity-100', 'opacity-0');
                }, 2000);
            }
        }

        // Initialize App Instance
        const app = new GolfSwingApp();
    </script>
</body>
</html>
