<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ゴルフスイング課題管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }
        /* Prevent font scaling/zooming on mobile inputs */
        input, textarea {
            font-size: 16px !important;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-200 text-slate-800 h-full overflow-hidden flex flex-col justify-between select-none">

    <header class="bg-white/90 backdrop-blur-md border-b border-emerald-100/80 px-4 py-3 flex items-center justify-between shrink-0 shadow-xs">
        <div class="flex items-center space-x-2">
            <span class="text-emerald-600 text-xl font-bold">⛳️</span>
            <h1 id="app-title" class="text-base font-bold tracking-wide text-slate-700">ゴルフスイング課題管理</h1>
        </div>
        <div id="header-right">
            <button id="btn-header-back" onclick="app.goHome()" class="hidden bg-emerald-100 hover:bg-emerald-200 active:scale-95 text-emerald-800 text-xs font-semibold px-3 py-1 rounded-full border border-emerald-200 shadow-xs transition-all flex items-center space-x-1">
                <span>🏠</span>
                <span>ホーム</span>
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-hidden relative p-4 flex flex-col justify-center max-w-md mx-auto w-full">

        <div id="view-home" class="flex flex-col justify-center space-y-4 h-full py-2">
            <div class="text-center mb-1">
                <p class="text-xs text-slate-600 font-medium">練習するクラブカテゴリを選択してください</p>
            </div>
            
            <div class="grid grid-cols-2 gap-3.5 flex-1 max-h-[320px]">
                <button onclick="app.selectCategory('ドライバー')" class="group relative bg-gradient-to-br from-emerald-400 to-teal-500 hover:from-emerald-300 hover:to-teal-400 active:scale-95 transition-all rounded-2xl p-4 flex flex-col justify-between shadow-md shadow-emerald-500/20 border border-emerald-300/60">
                    <span class="text-2xl drop-shadow-sm">🏌️‍♂️</span>
                    <div class="text-left">
                        <div class="text-lg font-bold text-white drop-shadow-xs">ドライバー</div>
                        <div class="text-[10px] text-emerald-50 font-medium">最大飛距離・方向性</div>
                    </div>
                </button>

                <button onclick="app.selectCategory('アイアン')" class="group relative bg-gradient-to-br from-cyan-400 to-blue-500 hover:from-cyan-300 hover:to-blue-400 active:scale-95 transition-all rounded-2xl p-4 flex flex-col justify-between shadow-md shadow-blue-500/20 border border-sky-300/60">
                    <span class="text-2xl drop-shadow-sm">🎯</span>
                    <div class="text-left">
                        <div class="text-lg font-bold text-white drop-shadow-xs">アイアン</div>
                        <div class="text-[10px] text-sky-50 font-medium">縦の距離感・正確性</div>
                    </div>
                </button>

                <button onclick="app.selectCategory('ウェッジ')" class="group relative bg-gradient-to-br from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 active:scale-95 transition-all rounded-2xl p-4 flex flex-col justify-between shadow-md shadow-amber-500/20 border border-amber-300/60">
                    <span class="text-2xl drop-shadow-sm">⛳️</span>
                    <div class="text-left">
                        <div class="text-lg font-bold text-white drop-shadow-xs">ウェッジ</div>
                        <div class="text-[10px] text-amber-50 font-medium">アプローチ・距離刻み</div>
                    </div>
                </button>

                <button onclick="app.selectCategory('パター')" class="group relative bg-gradient-to-br from-violet-400 to-purple-500 hover:from-violet-300 hover:to-purple-400 active:scale-95 transition-all rounded-2xl p-4 flex flex-col justify-between shadow-md shadow-purple-500/20 border border-purple-300/60">
                    <span class="text-2xl drop-shadow-sm">⚡️</span>
                    <div class="text-left">
                        <div class="text-lg font-bold text-white drop-shadow-xs">パター</div>
                        <div class="text-[10px] text-purple-50 font-medium">方向・タッチ・傾斜</div>
                    </div>
                </button>
            </div>
            
            <div class="bg-white/90 backdrop-blur border border-slate-200/80 rounded-xl p-3 text-center shadow-xs">
                <p id="total-records-count" class="text-xs text-slate-600 font-medium">保存されたデータ: 0件</p>
            </div>
        </div>

        <div id="view-category" class="hidden flex flex-col h-full justify-between py-0.5">
            
            <div id="container-form" class="flex flex-col space-y-2 flex-1 justify-start pt-0">
                <div class="space-y-0.5">
                    <div class="flex items-center justify-between px-1">
                        <label class="block text-xs font-semibold text-slate-700">
                            ■ アドレスの課題・意識
                        </label>
                        <button onclick="app.copyAddressData()" type="button" class="bg-emerald-100 hover:bg-emerald-200 active:scale-95 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded-md border border-emerald-300 transition-all shadow-xs flex items-center space-x-1">
                            <span>📋</span>
                            <span>コピー</span>
                        </button>
                    </div>
                    <textarea id="input-address" rows="7" placeholder="例：ボール位置が左すぎないか確認。スタンス幅を肩幅に。" class="w-full bg-white border border-slate-200/80 rounded-2xl p-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-emerald-400 focus:ring-2 focus:ring-emerald-300/40 resize-none shadow-[0_6px_20px_rgba(0,0,0,0.05),inset_0_1px_2px_rgba(255,255,255,0.8)] transition-all"></textarea>
                </div>

                <div class="space-y-0.5">
                    <div class="flex items-center justify-between px-1">
                        <label class="block text-xs font-semibold text-slate-700">
                            ■ スイングの課題・意識
                        </label>
                        <button onclick="app.copySwingData()" type="button" class="bg-emerald-100 hover:bg-emerald-200 active:scale-95 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded-md border border-emerald-300 transition-all shadow-xs flex items-center space-x-1">
                            <span>📋</span>
                            <span>コピー</span>
                        </button>
                    </div>
                    <textarea id="input-swing" rows="7" placeholder="例：トップで右脇が開かないように回す。フィニッシュまで振り切る。" class="w-full bg-white border border-slate-200/80 rounded-2xl p-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-emerald-400 focus:ring-2 focus:ring-emerald-300/40 resize-none shadow-[0_6px_20px_rgba(0,0,0,0.05),inset_0_1px_2px_rgba(255,255,255,0.8)] transition-all"></textarea>
                </div>

                <div class="flex items-center space-x-2 pt-0.5">
                    <button onclick="app.registerData()" class="flex-1 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 active:scale-95 transition-all text-white font-bold py-3 px-4 rounded-2xl shadow-lg shadow-emerald-500/25 text-xs sm:text-sm flex items-center justify-center space-x-2 border border-emerald-300/40">
                        <span>登録する</span>
                        <span class="text-xs">✨</span>
                    </button>
                    
                    <!-- Count Button for current history item -->
                    <button id="btn-count-current" onclick="app.incrementCurrentCount()" title="タップして数値を加算" class="bg-white hover:bg-slate-50 active:scale-95 text-slate-700 px-3.5 h-11 rounded-2xl text-xs font-bold flex items-center space-x-1 border border-slate-200 shadow-xs transition-all">
                        <span class="text-base">👌</span>
                        <span id="label-count-current" class="text-xs">0</span>
                    </button>

                    <div class="flex items-center space-x-1 shrink-0">
                        <button onclick="app.prevHistoryFromInput()" title="一つ前のデータ" class="bg-white hover:bg-slate-50 active:scale-95 text-slate-700 w-11 h-11 rounded-2xl text-sm font-bold flex items-center justify-center border border-slate-200 shadow-xs transition-all">
                            ＜
                        </button>
                        <button onclick="app.nextHistoryFromInput()" title="次（新しい）のデータ" class="bg-white hover:bg-slate-50 active:scale-95 text-slate-700 w-11 h-11 rounded-2xl text-sm font-bold flex items-center justify-center border border-slate-200 shadow-xs transition-all">
                            ＞
                        </button>
                    </div>
                </div>
                
                <div id="input-record-indicator" class="text-center text-[10px] text-slate-500 font-medium pt-0.5">
                    保存データ 0件 (＜ ＞ で過去データを参照)
                </div>
            </div>

            <div class="pt-1.5 flex items-center justify-between border-t border-slate-200/80 shrink-0">
                <button onclick="app.goHome()" class="bg-white/90 hover:bg-slate-50 active:scale-95 text-slate-700 px-3.5 py-2.5 rounded-2xl text-xs font-semibold flex items-center space-x-1.5 border border-slate-200/80 shadow-xs transition-all">
                    <span>🏠</span>
                    <span>ホーム</span>
                </button>
            </div>

        </div>

    </main>

    <div id="toast" class="fixed top-12 left-1/2 -translate-x-1/2 bg-emerald-500 text-white text-xs font-semibold px-4 py-2 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300 z-50 border border-emerald-400">
        登録しました！
    </div>

    <script>
        class GolfSwingApp {
            constructor() {
                this.db = null;
                this.currentCategory = null;
                this.histories = [];
                this.currentIndex = -1; // -1 means currently viewing the new blank input state
                
                this.initDB();
            }

            // Initialize IndexedDB
            initDB() {
                const request = indexedDB.open('GolfSwingDB', 3);
                
                request.onerror = (event) => {
                    console.error("Database error: " + event.target.errorCode);
                };

                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains('swings')) {
                        const store = db.createObjectStore('swings', { keyPath: 'id', autoIncrement: true });
                        store.createIndex('category', 'category', { unique: false });
                        store.createIndex('timestamp', 'timestamp', { unique: false });
                    } else {
                        const store = event.target.transaction.objectStore('swings');
                        if (!store.index('category')) {
                            store.createIndex('category', 'category', { unique: false });
                        }
                    }
                };

                request.onsuccess = (event) => {
                    this.db = event.target.result;
                    this.updateTotalCount();
                };
            }

            // Select club category from home screen
            selectCategory(category) {
                this.currentCategory = category;
                
                document.getElementById('app-title').textContent = `${category}の課題`;
                document.getElementById('btn-header-back').classList.remove('hidden');
                
                document.getElementById('view-home').classList.add('hidden');
                document.getElementById('view-category').classList.remove('hidden');
                
                this.clearForm();
                this.loadHistories(() => {
                    this.currentIndex = -1;
                    this.updateInputIndicator();
                    this.updateCountButtonUI();
                });
            }

            // Return to home screen
            goHome() {
                this.currentCategory = null;
                
                document.getElementById('app-title').textContent = 'ゴルフスイング課題管理';
                document.getElementById('btn-header-back').classList.add('hidden');
                
                document.getElementById('view-category').classList.add('hidden');
                document.getElementById('view-home').classList.remove('hidden');
                
                this.updateTotalCount();
            }

            // Clear input form fields
            clearForm() {
                document.getElementById('input-address').value = '';
                document.getElementById('input-swing').value = '';
                this.currentIndex = -1;
                this.updateCountButtonUI();
            }

            // Copy only address data
            copyAddressData() {
                const address = document.getElementById('input-address').value.trim();
                if (!address) {
                    this.showToast('コピーするアドレス内容がありません', true);
                    return;
                }
                this.executeCopy(address);
            }

            // Copy only swing data
            copySwingData() {
                const swing = document.getElementById('input-swing').value.trim();
                if (!swing) {
                    this.showToast('コピーするスイング内容がありません', true);
                    return;
                }
                this.executeCopy(swing);
            }

            // Execute copy action
            executeCopy(textToCopy) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(textToCopy).then(() => {
                        this.showToast('クリップボードにコピーしました！');
                    }).catch(() => {
                        this.fallbackCopyText(textToCopy);
                    });
                } else {
                    this.fallbackCopyText(textToCopy);
                }
            }

            // Fallback copy method using execCommand
            fallbackCopyText(text) {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";  // Avoid scrolling to bottom
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    const successful = document.execCommand('copy');
                    if (successful) {
                        this.showToast('クリップボードにコピーしました！');
                    } else {
                        this.showToast('コピーに失敗しました', true);
                    }
                } catch (err) {
                    this.showToast('コピーに失敗しました', true);
                }
                document.body.removeChild(textArea);
            }

            // Register data to IndexedDB
            registerData() {
                // Blur active inputs to trigger zoom reset on iOS/Android
                if (document.activeElement && typeof document.activeElement.blur === 'function') {
                    document.activeElement.blur();
                }
                
                // Reset viewport scale if zoomed in (temporarily alter viewport meta or force reset)
                const viewportMeta = document.querySelector('meta[name="viewport"]');
                if (viewportMeta) {
                    viewportMeta.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
                }

                const address = document.getElementById('input-address').value.trim();
                const swing = document.getElementById('input-swing').value.trim();

                if (!address && !swing) {
                    this.showToast('アドレスまたはスイングを入力してください', true);
                    return;
                }

                // If currently editing an existing history item, update it
                if (this.currentIndex !== -1 && this.histories[this.currentIndex]) {
                    const item = this.histories[this.currentIndex];
                    item.address = address || '（未入力）';
                    item.swing = swing || '（未入力）';

                    const transaction = this.db.transaction(['swings'], 'readwrite');
                    const store = transaction.objectStore('swings');
                    const request = store.put(item);

                    request.onsuccess = () => {
                        this.showToast('更新しました！');
                        this.loadHistories(() => {
                            this.updateInputIndicator();
                            this.updateCountButtonUI();
                        });
                    };
                    request.onerror = () => {
                        this.showToast('更新に失敗しました', true);
                    };
                    return;
                }

                // Otherwise, add a new record with initial count = 0
                const record = {
                    category: this.currentCategory,
                    address: address || '（未入力）',
                    swing: swing || '（未入力）',
                    count: 0,
                    timestamp: new Date().getTime()
                };

                const transaction = this.db.transaction(['swings'], 'readwrite');
                const store = transaction.objectStore('swings');
                const request = store.add(record);

                request.onsuccess = () => {
                    this.clearForm();
                    this.showToast('登録しました！');
                    this.updateTotalCount();
                    this.loadHistories(() => {
                        this.currentIndex = -1;
                        this.updateInputIndicator();
                        this.updateCountButtonUI();
                    });
                };

                request.onerror = (event) => {
                    console.error("Error adding record: ", event.target.error);
                    this.showToast('登録に失敗しました', true);
                };
            }

            // Increment count for current history item
            incrementCurrentCount() {
                if (this.currentIndex === -1 || !this.histories[this.currentIndex]) {
                    this.showToast('過去の履歴を選択中のみ数値を加算できます', true);
                    return;
                }

                const item = this.histories[this.currentIndex];
                item.count = (item.count || 0) + 1;

                const transaction = this.db.transaction(['swings'], 'readwrite');
                const store = transaction.objectStore('swings');
                const request = store.put(item);

                request.onsuccess = () => {
                    this.updateCountButtonUI();
                    this.updateInputIndicator();
                    this.showToast(`数値を ${item.count} に更新しました！`);
                };

                request.onerror = () => {
                    this.showToast('更新に失敗しました', true);
                };
            }

            // Update count button style and text based on current item state
            updateCountButtonUI() {
                const btn = document.getElementById('btn-count-current');
                const label = document.getElementById('label-count-current');

                if (this.currentIndex === -1) {
                    btn.className = 'bg-slate-100 opacity-50 cursor-not-allowed text-slate-400 px-3.5 h-11 rounded-2xl text-xs font-bold flex items-center space-x-1 border border-slate-200 shadow-xs transition-all';
                    label.textContent = '0';
                } else {
                    const item = this.histories[this.currentIndex];
                    const currentCount = item && typeof item.count === 'number' ? item.count : 0;
                    if (currentCount > 0) {
                        btn.className = 'bg-gradient-to-r from-emerald-500 to-teal-500 text-white px-3.5 h-11 rounded-2xl text-xs font-bold flex items-center space-x-1 border border-emerald-300 shadow-sm transition-all active:scale-95';
                    } else {
                        btn.className = 'bg-white hover:bg-slate-50 active:scale-95 text-slate-700 px-3.5 h-11 rounded-2xl text-xs font-bold flex items-center space-x-1 border border-slate-200 shadow-xs transition-all';
                    }
                    label.textContent = currentCount;
                }
            }

            // Load histories for current category from IndexedDB
            loadHistories(callback) {
                if (!this.db || !this.currentCategory) return;

                const transaction = this.db.transaction(['swings'], 'readonly');
                const store = transaction.objectStore('swings');
                const index = store.index('category');
                const request = index.getAll(this.currentCategory);

                request.onsuccess = (event) => {
                    // Sort descending by timestamp (newest first: index 0 is newest)
                    this.histories = event.target.result.sort((a, b) => b.timestamp - a.timestamp);
                    if (callback) callback();
                };
            }

            // Previous history item (<) clicked from input screen (Moves to older data)
            prevHistoryFromInput() {
                if (this.histories.length === 0) {
                    this.showToast('保存されたデータがありません', true);
                    return;
                }
                
                if (this.currentIndex === -1) {
                    this.currentIndex = 0;
                } else {
                    if (this.currentIndex >= this.histories.length - 1) {
                        this.showToast('一番古い履歴です', true);
                        return;
                    }
                    this.currentIndex++;
                }

                this.loadCurrentHistoryItemToForm();
            }

            // Next history item (>) clicked from input screen (Moves to newer data)
            nextHistoryFromInput() {
                if (this.histories.length === 0) {
                    this.showToast('保存されたデータがありません', true);
                    return;
                }
                
                if (this.currentIndex === -1) {
                    this.showToast('一番新しい履歴です', true);
                    return;
                }

                if (this.currentIndex > 0) {
                    this.currentIndex--;
                    this.loadCurrentHistoryItemToForm();
                } else {
                    this.currentIndex = -1;
                    this.clearForm();
                    this.updateInputIndicator();
                    this.updateCountButtonUI();
                    this.showToast('新しい入力画面に戻りました');
                }
            }

            // Helper to populate form fields with selected history item
            loadCurrentHistoryItemToForm() {
                const item = this.histories[this.currentIndex];
                const dateStr = new Date(item.timestamp).toLocaleString('ja-JP', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
                
                document.getElementById('input-address').value = item.address === '（未入力）' ? '' : item.address;
                document.getElementById('input-swing').value = item.swing === '（未入力）' ? '' : item.swing;
                this.updateInputIndicator();
                this.updateCountButtonUI();
                const countVal = typeof item.count === 'number' ? item.count : 0;
                this.showToast(`[${dateStr}] のデータを読み込みました (👌 ${countVal})`);
            }

            // Update input mode record indicator text
            updateInputIndicator() {
                const total = this.histories.length;
                const indicator = document.getElementById('input-record-indicator');
                if (total === 0) {
                    indicator.textContent = '保存データ 0件 (＜ ＞ で過去データを参照)';
                } else if (this.currentIndex === -1) {
                    indicator.textContent = `保存データ ${total}件 (新規入力中)`;
                } else {
                    const item = this.histories[this.currentIndex];
                    const currentCount = item && typeof item.count === 'number' ? item.count : 0;
                    indicator.textContent = `保存データ ${total}件 (履歴 ${this.currentIndex + 1}/${total}番目) ✨[👌: ${currentCount}]`;
                }
            }

            // Update total records count on home screen
            updateTotalCount() {
                if (!this.db) return;
                const transaction = this.db.transaction(['swings'], 'readonly');
                const store = transaction.objectStore('swings');
                const request = store.count();

                request.onsuccess = () => {
                    const count = request.result;
                    document.getElementById('total-records-count').textContent = `保存されたデータ: ${count}件`;
                };
            }

            // Show toast notification
            showToast(message, isError = false) {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = `fixed top-12 left-1/2 -translate-x-1/2 text-white text-xs font-semibold px-4 py-2 rounded-full shadow-lg opacity-100 transition-all duration-300 z-50 ${isError ? 'bg-rose-500 border border-rose-400' : 'bg-emerald-500 border border-emerald-400'}`;
                
                setTimeout(() => {
                    toast.className = toast.className.replace('opacity-100', 'opacity-0');
                }, 2000);
            }
        }

        // Initialize App Instance
        const app = new GolfSwingApp();
    </script>
</body>
</html>
