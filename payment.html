<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>口座引き落とし・収支見える化</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Noto Sans JP, Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emeraldTheme: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans JP', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Noto Sans JP', 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #f8fafc;
        }
        /* Custom scrollbar for mobile UI */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        /* Hide HTML number input spinners */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        
        /* Vibrant Emerald/Mint Green Gradient for Section ④ (不明金) */
        .emerald-vibrant-card {
            background: linear-gradient(135deg, #059669 0%, #10b981 50%, #34d399 100%);
            box-shadow: 0 12px 28px -5px rgba(16, 185, 129, 0.45), 0 8px 12px -6px rgba(5, 150, 105, 0.3);
        }
        .emerald-glow-text {
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen pb-12 flex flex-col items-center">

    <div class="w-full max-w-md bg-slate-50 min-h-screen shadow-md flex flex-col relative">

        <!-- Top Header Navigation -->
        <header class="bg-slate-900 text-white p-4 sticky top-0 z-20 shadow-xs">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-emerald-400 border border-slate-700">
                        <i class="fa-solid font-bold text-emerald-400 fa-wallet"></i>
                    </div>
                    <h1 class="font-bold text-lg tracking-wide">口座引き落とし管理</h1>
                </div>
                <div class="flex items-center space-x-2 text-xs">
                    <button onclick="resetDataConfirm()" class="text-slate-400 hover:text-slate-200 p-2 rounded-lg transition-colors" title="初期化">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
            </div>
            
            <!-- Target Date Selector Banner -->
            <div class="mt-3 pt-2 border-t border-slate-800 flex items-center justify-between">
                <div class="flex items-center space-x-2 text-slate-400 text-sm">
                    <i class="fa-regular fa-calendar-check text-slate-300"></i>
                    <span class="font-medium">基準日設定:</span>
                </div>
                <div class="flex items-center space-x-1 bg-slate-800 px-2.5 py-1 rounded-lg border border-slate-700">
                    <input type="number" id="cutoffDateInput" value="25" min="1" max="31" class="w-7 bg-transparent text-slate-100 font-bold text-center text-sm outline-none border-b border-slate-500 focus:border-emerald-400" onchange="updateCutoffDate()">
                    <span class="text-xs font-semibold text-slate-300">日 現在</span>
                </div>
            </div>
        </header>

        <main class="p-4 space-y-4 flex-1">

            <!-- Card 1: Account Balance Input (①) -->
            <div class="bg-white rounded-2xl p-4 shadow-xs border border-slate-200/80 transition-all focus-within:ring-1 focus-within:ring-slate-400">
                <div class="flex items-center justify-between mb-2">
                    <label for="accountBalanceDisplay" class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center space-x-1.5">
                        <span class="w-5 h-5 rounded-md bg-slate-100 text-slate-700 flex items-center justify-center text-xs font-black">①</span>
                        <span id="displayDateText">25日現在の口座の金額</span>
                    </label>
                    <span class="text-[11px] text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full font-medium">基本入力</span>
                </div>
                <div class="relative flex items-center">
                    <span class="absolute left-3 text-xl font-medium text-slate-400">¥</span>
                    <input type="text" id="accountBalanceDisplay" inputmode="numeric" placeholder="0" 
                           class="w-full text-right text-xl font-bold text-slate-800 pl-8 pr-3 py-2 bg-slate-50 rounded-xl border border-slate-200 focus:bg-white focus:outline-none focus:border-slate-400 transition-all"
                           onfocus="handleBalanceFocus(this)" onblur="handleBalanceBlur(this)" oninput="handleBalanceInput(this)">
                </div>
            </div>

            <!-- Card 2: Fixed Costs Total (②) -->
            <div class="bg-white rounded-2xl p-4 shadow-xs border border-slate-200/80">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center space-x-1.5">
                        <span class="w-5 h-5 rounded-md bg-slate-100 text-slate-700 flex items-center justify-center text-xs font-black">②</span>
                        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">固定費合計</span>
                    </div>
                    <button onclick="openFixedCostModal()" class="text-xs text-slate-700 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 px-2.5 py-1 rounded-lg font-semibold transition-colors flex items-center space-x-1">
                        <i class="fa-solid fa-list-check text-slate-500"></i>
                        <span>内訳編集</span>
                    </button>
                </div>
                <div class="flex items-baseline justify-end space-x-1 py-1">
                    <span class="text-slate-400 font-medium text-lg">¥</span>
                    <span id="fixedCostsTotalDisplay" class="text-xl font-bold text-slate-800">0</span>
                </div>
                <!-- Mini fixed cost list preview -->
                <div id="fixedCostsPreviewList" class="mt-3 pt-2 border-t border-slate-100 text-xs text-slate-500 space-y-1">
                    <!-- Populated dynamically via JS -->
                </div>
            </div>

            <!-- SECTION DIVIDER -->
            <div class="relative my-2 flex items-center justify-center">
                <div class="w-full border-t border-slate-200"></div>
            </div>

            <!-- Card 3: Variable Costs & Dynamic Custom Item Inputs (③) -->
            <div class="bg-white rounded-2xl p-4 shadow-xs border border-slate-200/80 space-y-3">
                <div class="flex items-center justify-between pb-1 border-b border-slate-100">
                    <div class="flex items-center space-x-1.5">
                        <span class="w-5 h-5 rounded-md bg-slate-100 text-slate-700 flex items-center justify-center text-xs font-black">③</span>
                        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">変動費額</span>
                    </div>
                    <!-- Prominently displayed Variable Costs Total right next to title -->
                    <div class="flex items-baseline space-x-1">
                        <span class="text-slate-400 font-medium text-lg">¥</span>
                        <span id="variableCostsTotalDisplay" class="text-xl font-bold text-slate-800">0</span>
                    </div>
                </div>

                <!-- Custom Free Input Addition List (+〇〇〇) -->
                <div class="space-y-2 pt-1">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-slate-600 flex items-center space-x-1">
                            <i class="fa-solid fa-sliders text-slate-400"></i>
                            <span>変動項目 (+〇〇〇)</span>
                        </span>
                        <button onclick="addCustomItemRow()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-lg font-bold transition-all flex items-center space-x-1">
                            <i class="fa-solid fa-plus text-[10px]"></i>
                            <span>項目追加</span>
                        </button>
                    </div>

                    <!-- Dynamic Row List Container -->
                    <div id="customRowsContainer" class="space-y-2 mt-2">
                        <!-- Populated via JS -->
                    </div>
                </div>
            </div>

            <!-- SECTION DIVIDER -->
            <div class="relative my-2 flex items-center justify-center">
                <div class="w-full border-t border-slate-200"></div>
            </div>

            <!-- Card 4: Unaccounted Amount (④ = ① - ② - ③) - GREEN EMERALD/MINT GRADIENT DESIGN -->
            <div id="unaccountedCard" class="emerald-vibrant-card text-white rounded-2xl p-5 shadow-xl relative overflow-hidden transition-all transform duration-300 hover:scale-[1.01]">
                <!-- Subtle background decorative glowing light -->
                <div class="absolute -right-8 -bottom-8 w-36 h-36 bg-emerald-200/20 rounded-full blur-2xl pointer-events-none"></div>
                <div class="absolute -left-8 -top-8 w-32 h-32 bg-teal-300/30 rounded-full blur-xl pointer-events-none"></div>

                <div class="flex items-center justify-between mb-2 relative z-10">
                    <div class="flex items-center space-x-2">
                        <span class="w-6 h-6 rounded-lg bg-white/25 backdrop-blur-md text-white flex items-center justify-center text-xs font-black shadow-inner">④</span>
                        <span class="text-sm font-black uppercase tracking-wider text-amber-200">不明金</span>
                    </div>
                    <button onclick="toggleUnaccountedHelp()" class="text-white/90 hover:text-white text-xs bg-black/10 hover:bg-black/20 p-1.5 rounded-full transition-colors">
                        <i class="fa-regular fa-circle-question"></i>
                    </button>
                </div>

                <div id="unaccountedHelpText" class="hidden text-xs bg-emerald-950/40 text-emerald-100 p-2.5 rounded-xl mb-3 leading-relaxed border border-white/20 backdrop-blur-xs relative z-10">
                    口座金額から固定費および変動費額（合計）を差し引いた不明金です。（① - ② - ③）
                </div>

                <div class="relative z-10 space-y-3">
                    <div class="bg-black/15 backdrop-blur-md p-3.5 rounded-xl border border-white/20 flex flex-col justify-center items-end shadow-inner">
                        <span class="text-[11px] font-semibold text-emerald-100 self-start mb-0.5">差し引き残額</span>
                        <div class="flex items-baseline space-x-1.5">
                            <span class="text-amber-300 font-bold text-xl">¥</span>
                            <span id="unaccountedAmountDisplay" class="font-black text-white text-3xl tracking-tight emerald-glow-text">0</span>
                        </div>
                    </div>

                    <div class="flex items-center justify-between text-xs pt-0.5 px-1">
                        <span class="text-emerald-100 font-medium">調整メモ:</span>
                        <input type="text" id="unaccountedNoteInput" placeholder="メモを入力" 
                               class="bg-black/20 text-right text-white placeholder-emerald-200/60 border border-white/20 rounded-lg px-2.5 py-1 focus:outline-none focus:border-amber-300 font-normal w-48 text-xs transition-all"
                               oninput="saveState()">
                    </div>
                </div>
            </div>

        </main>

        <!-- Footer Info -->
        <footer class="p-4 text-center text-xs text-slate-400">
            <p>※ 入力データはブラウザに自動保存されます</p>
        </footer>
    </div>

    <!-- Fixed Costs Detail Modal -->
    <div id="fixedCostModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-2xl max-w-sm w-full max-h-[85vh] flex flex-col shadow-lg border border-slate-200 overflow-hidden">
            <!-- Modal Header -->
            <div class="bg-slate-900 text-white p-4 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-file-invoice-dollar text-emerald-400"></i>
                    <h3 class="font-bold text-base">固定費 内訳一覧</h3>
                </div>
                <button onclick="closeFixedCostModal()" class="text-slate-400 hover:text-white p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Modal Content - Item List -->
            <div class="p-4 overflow-y-auto space-y-3 flex-1" id="modalFixedCostList">
                <!-- Dynamically populated rows -->
            </div>

            <!-- Add New Fixed Cost Item Form -->
            <div class="p-3 bg-slate-50 border-t border-slate-200">
                <button onclick="addFixedCostRow()" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl border border-slate-300 flex items-center justify-center space-x-1.5 transition-colors">
                    <i class="fa-solid fa-plus text-slate-500"></i>
                    <span>固定費の項目を追加</span>
                </button>
            </div>

            <!-- Modal Footer -->
            <div class="p-4 border-t border-slate-100 flex items-center justify-between bg-white">
                <div>
                    <span class="text-[10px] text-slate-400 block uppercase">合計額</span>
                    <span id="modalFixedTotal" class="text-base font-bold text-slate-800">¥0</span>
                </div>
                <button onclick="closeFixedCostModal()" class="px-5 py-2.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold rounded-xl shadow-xs transition-all">
                    完了
                </button>
            </div>
        </div>
    </div>

    <script>
        // Master Application State
        let appState = {
            cutoffDate: 25,
            accountBalance: 350000,
            fixedCosts: [
                { id: '1', name: '家賃・共益費', amount: 85000 },
                { id: '2', name: '電気・ガス・水道', amount: 15000 },
                { id: '3', name: '通信費（スマホ・光）', amount: 8000 },
                { id: '4', name: 'サブスク各種', amount: 3000 },
                { id: '5', name: '保険料', amount: 12000 }
            ],
            customItems: [
                { id: 'c1', name: '食費・日用品', amount: 45000 },
                { id: 'c2', name: '交際費・娯楽', amount: 20000 },
                { id: 'c3', name: '予備費', amount: 10000 }
            ],
            unaccountedNote: 'ATM手数料・端数調整'
        };

        const STORAGE_KEY = 'ACCOUNT_DEDUCTION_SIMULATOR_STATE_V2';

        // Load data on page launch
        window.onload = function() {
            loadSavedState();
            renderAll();
        };

        function loadSavedState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    appState = { ...appState, ...parsed };
                }
            } catch (e) {
                console.error("Failed to load local storage state:", e);
            }
        }

        function saveState() {
            try {
                const noteInput = document.getElementById('unaccountedNoteInput');
                if (noteInput) appState.unaccountedNote = noteInput.value;

                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
            } catch (e) {
                console.error("Failed to save state to local storage:", e);
            }
            calculateAndRender();
        }

        function resetDataConfirm() {
            if (confirm("すべての設定入力内容を初期データにリセットしますか？")) {
                localStorage.removeItem(STORAGE_KEY);
                appState = {
                    cutoffDate: 25,
                    accountBalance: 350000,
                    fixedCosts: [
                        { id: '1', name: '家賃・共益費', amount: 85000 },
                        { id: '2', name: '電気・ガス・水道', amount: 15000 },
                        { id: '3', name: '通信費（スマホ・光）', amount: 8000 },
                        { id: '4', name: 'サブスク各種', amount: 3000 },
                        { id: '5', name: '保険料', amount: 12000 }
                    ],
                    customItems: [
                        { id: 'c1', name: '食費・日用品', amount: 45000 },
                        { id: 'c2', name: '交際費・娯楽', amount: 20000 },
                        { id: 'c3', name: '予備費', amount: 10000 }
                    ],
                    unaccountedNote: 'ATM手数料・端数調整'
                };
                renderAll();
            }
        }

        function renderAll() {
            // Cutoff Date Input
            document.getElementById('cutoffDateInput').value = appState.cutoffDate;
            updateDateLabel();

            // Account Balance
            const balanceInput = document.getElementById('accountBalanceDisplay');
            balanceInput.value = formatNumber(appState.accountBalance);

            // Unaccounted Note
            document.getElementById('unaccountedNoteInput').value = appState.unaccountedNote || '';

            // Custom dynamic rows (+〇〇〇)
            renderCustomRows();

            // Recalculate Totals & Render Previews
            calculateAndRender();
        }

        function updateCutoffDate() {
            let val = parseInt(document.getElementById('cutoffDateInput').value) || 25;
            if (val < 1) val = 1;
            if (val > 31) val = 31;
            appState.cutoffDate = val;
            document.getElementById('cutoffDateInput').value = val;
            updateDateLabel();
            saveState();
        }

        function updateDateLabel() {
            document.getElementById('displayDateText').innerText = `${appState.cutoffDate}日現在の口座の金額`;
        }

        function calculateAndRender() {
            // 1. Account Balance (①)
            const accountBalance = Number(appState.accountBalance) || 0;

            // 2. Fixed Costs Total (②)
            const fixedTotal = appState.fixedCosts.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
            document.getElementById('fixedCostsTotalDisplay').innerText = formatNumber(fixedTotal);
            document.getElementById('modalFixedTotal').innerText = '¥' + formatNumber(fixedTotal);

            // Render Fixed Cost Preview List in Main Card
            const previewContainer = document.getElementById('fixedCostsPreviewList');
            if (appState.fixedCosts.length === 0) {
                previewContainer.innerHTML = '<span class="text-slate-400 italic">固定費の登録はありません</span>';
            } else {
                const previewItems = appState.fixedCosts.slice(0, 3).map(item => 
                    `<div class="flex justify-between items-center">
                        <span class="truncate max-w-[180px]">${escapeHtml(item.name || '無題')}</span>
                        <span class="font-medium text-slate-700">¥${formatNumber(item.amount)}</span>
                    </div>`
                ).join('');
                const moreCount = appState.fixedCosts.length - 3;
                const moreText = moreCount > 0 ? `<div class="text-[10px] text-slate-400 font-medium pt-0.5">他 ${moreCount} 項目...</div>` : '';
                previewContainer.innerHTML = previewItems + moreText;
            }

            // 3. Variable Costs Total Calculation (③)
            const variableTotal = appState.customItems.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
            document.getElementById('variableCostsTotalDisplay').innerText = formatNumber(variableTotal);

            // 4. Unaccounted Amount Calculation: ④ = ① - ② - ③
            const unaccountedVal = accountBalance - fixedTotal - variableTotal;
            document.getElementById('unaccountedAmountDisplay').innerText = formatNumber(unaccountedVal);
        }

        function renderCustomRows() {
            const container = document.getElementById('customRowsContainer');
            container.innerHTML = '';

            appState.customItems.forEach((item) => {
                const row = document.createElement('div');
                row.className = "flex items-center space-x-2 bg-slate-50 p-2 rounded-xl border border-slate-200/70";

                row.innerHTML = `
                    <div class="flex-1 flex items-center space-x-1.5">
                        <span class="text-xs text-slate-400 font-bold">+</span>
                        <input type="text" placeholder="項目名 (例: 変動費/支出)" value="${escapeHtml(item.name)}"
                               onchange="updateCustomItem('${item.id}', 'name', this.value)"
                               class="w-full bg-transparent text-xs font-medium text-slate-700 placeholder-slate-400 focus:outline-none border-b border-transparent focus:border-slate-400 py-0.5">
                    </div>
                    <div class="flex items-center space-x-1 w-28 justify-end">
                        <span class="text-xs text-slate-400 font-medium">¥</span>
                        <input type="text" inputmode="numeric" placeholder="0" value="${formatNumber(item.amount)}"
                               onfocus="handleCustomFocus(this, '${item.id}')"
                               onblur="handleCustomBlur(this, '${item.id}')"
                               oninput="handleCustomInput(this, '${item.id}')"
                               class="w-full text-right text-xs font-semibold text-slate-800 bg-transparent border-b border-slate-300 focus:border-slate-500 focus:outline-none py-0.5">
                    </div>
                    <button onclick="removeCustomItemRow('${item.id}')" class="text-slate-300 hover:text-slate-500 p-1 text-xs transition-colors">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;
                container.appendChild(row);
            });
        }

        function addCustomItemRow() {
            const newItem = {
                id: 'c_' + Date.now(),
                name: '',
                amount: 0
            };
            appState.customItems.push(newItem);
            renderCustomRows();
            saveState();
        }

        function removeCustomItemRow(id) {
            appState.customItems = appState.customItems.filter(item => item.id !== id);
            renderCustomRows();
            saveState();
        }

        function updateCustomItem(id, field, value) {
            const item = appState.customItems.find(i => i.id === id);
            if (item) {
                if (field === 'name') item.name = value;
                if (field === 'amount') item.amount = Number(value) || 0;
                saveState();
            }
        }

        function handleCustomFocus(input, id) {
            const item = appState.customItems.find(i => i.id === id);
            if (item) {
                input.value = item.amount === 0 ? '' : item.amount;
            }
        }

        function handleCustomInput(input, id) {
            let val = input.value.replace(/[^0-9-]/g, '');
            if (val.indexOf('-') > 0) {
                val = val.replace(/-/g, '');
            }
            input.value = val;
            const numericVal = Number(val) || 0;
            updateCustomItem(id, 'amount', numericVal);
        }

        function handleCustomBlur(input, id) {
            const item = appState.customItems.find(i => i.id === id);
            if (item) {
                input.value = formatNumber(item.amount);
            }
            renderCustomRows();
        }

        function handleBalanceFocus(input) {
            input.value = appState.accountBalance === 0 ? '' : appState.accountBalance;
        }

        function handleBalanceInput(input) {
            let val = input.value.replace(/[^0-9]/g, '');
            input.value = val;
            appState.accountBalance = Number(val) || 0;
            calculateAndRender();
        }

        function handleBalanceBlur(input) {
            input.value = formatNumber(appState.accountBalance);
            saveState();
        }

        function toggleUnaccountedHelp() {
            const el = document.getElementById('unaccountedHelpText');
            el.classList.toggle('hidden');
        }

        function openFixedCostModal() {
            renderModalFixedCosts();
            document.getElementById('fixedCostModal').classList.remove('hidden');
        }

        function closeFixedCostModal() {
            document.getElementById('fixedCostModal').classList.add('hidden');
            calculateAndRender();
        }

        function renderModalFixedCosts() {
            const container = document.getElementById('modalFixedCostList');
            container.innerHTML = '';

            if (appState.fixedCosts.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-400 py-8 text-xs">固定費項目がありません。「追加」ボタンから登録してください。</div>`;
                return;
            }

            appState.fixedCosts.forEach((item) => {
                const row = document.createElement('div');
                row.className = "flex items-center space-x-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200/80";

                row.innerHTML = `
                    <input type="text" value="${escapeHtml(item.name)}" placeholder="項目名" 
                           onchange="updateFixedCost('${item.id}', 'name', this.value)"
                           class="flex-1 text-xs font-semibold text-slate-700 bg-transparent focus:outline-none border-b border-transparent focus:border-slate-500 py-1">
                    <div class="flex items-center space-x-1 w-28 justify-end">
                        <span class="text-xs text-slate-400 font-bold">¥</span>
                        <input type="text" inputmode="numeric" placeholder="0" value="${formatNumber(item.amount)}"
                               onfocus="handleModalFixedFocus(this, '${item.id}')"
                               onblur="handleModalFixedBlur(this, '${item.id}')"
                               oninput="handleModalFixedInput(this, '${item.id}')"
                               class="w-full text-right text-xs font-bold text-slate-800 bg-transparent border-b border-slate-300 focus:border-slate-500 focus:outline-none py-1">
                    </div>
                    <button onclick="removeFixedCostRow('${item.id}')" class="text-slate-300 hover:text-slate-500 p-1 text-xs transition-colors">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;
                container.appendChild(row);
            });
        }

        function addFixedCostRow() {
            const newItem = {
                id: 'f_' + Date.now(),
                name: '',
                amount: 0
            };
            appState.fixedCosts.push(newItem);
            renderModalFixedCosts();
            calculateAndRender();
            saveState();
        }

        function removeFixedCostRow(id) {
            appState.fixedCosts = appState.fixedCosts.filter(item => item.id !== id);
            renderModalFixedCosts();
            calculateAndRender();
            saveState();
        }

        function updateFixedCost(id, field, value) {
            const item = appState.fixedCosts.find(i => i.id === id);
            if (item) {
                if (field === 'name') item.name = value;
                if (field === 'amount') item.amount = Number(value) || 0;
                calculateAndRender();
                saveState();
            }
        }

        function handleModalFixedFocus(input, id) {
            const item = appState.fixedCosts.find(i => i.id === id);
            if (item) {
                input.value = item.amount === 0 ? '' : item.amount;
            }
        }

        function handleModalFixedInput(input, id) {
            let val = input.value.replace(/[^0-9]/g, '');
            input.value = val;
            updateFixedCost(id, 'amount', Number(val) || 0);
            document.getElementById('modalFixedTotal').innerText = '¥' + formatNumber(
                appState.fixedCosts.reduce((s, i) => s + (Number(i.amount) || 0), 0)
            );
        }

        function handleModalFixedBlur(input, id) {
            const item = appState.fixedCosts.find(i => i.id === id);
            if (item) {
                input.value = formatNumber(item.amount);
            }
            renderModalFixedCosts();
        }

        function formatNumber(num) {
            if (num === null || num === undefined || isNaN(num)) return '0';
            return Number(num).toLocaleString('ja-JP');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
</body>
</html>
