<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TalkPulse AI 英会話ジェネレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tap-active:active { transform: scale(0.97); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-amber-50/60 min-h-screen text-slate-800 font-sans pb-12 text-xs">

    <!-- ヘッダー -->
    <header class="bg-gradient-to-r from-orange-500 to-amber-500 text-white p-4 text-center shadow-sm">
        <h1 class="text-lg font-black tracking-wider">🌟 臨場感英会話 AI Maker</h1>
        <p class="text-[11px] font-medium opacity-95 mt-1">スマホでサクサク！秒速プロンプト作成</p>
    </header>

    <!-- メインコンテナ -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- トップビュー：メインアクション＆サブ登録 -->
        <div id="top-view" class="space-y-4 mt-2">
            <!-- 特大メインボタン：マスタ呼び出し -->
            <div>
                <button onclick="openCallView()" class="tap-active w-full bg-gradient-to-r from-orange-500 via-amber-500 to-orange-600 text-white font-black py-7 px-4 rounded-2xl shadow-md flex flex-col items-center justify-center hover:opacity-95 transition transform hover:-translate-y-0.5 border border-white/25">
                    <span class="text-3xl mb-1 animate-bounce">🚀</span>
                    <span class="text-lg tracking-wider font-extrabold">さあ、やろう！</span>
                    <span class="text-[11px] font-medium opacity-95 mt-1">AI英会話プロンプトを秒速で生成する</span>
                </button>
            </div>

            <!-- 小さめのサブボタン：マスタ登録 -->
            <div class="flex justify-center">
                <button onclick="switchView('register-view')" class="tap-active bg-white border border-orange-200 text-orange-700 font-bold py-2.5 px-6 rounded-full shadow-xs flex items-center gap-2 hover:bg-orange-50 transition text-xs">
                    <span class="text-sm">📝</span>
                    <span>マスタ登録・編集はこちら</span>
                </button>
            </div>

            <!-- 現在の登録状況サマリ -->
            <div class="bg-white rounded-xl p-3.5 shadow-xs border border-orange-100 space-y-1.5">
                <div class="font-bold text-xs text-orange-800 mb-1">📌 現在のストック状況</div>
                <div id="summary-text" class="text-slate-600 text-[11px] leading-relaxed">読み込み中...</div>
            </div>
        </div>

        <!-- 登録ビュー（タブ切り替え対応） -->
        <div id="register-view" class="hidden space-y-3.5 mt-2">
            <div class="flex items-center justify-between">
                <h2 class="font-black text-sm text-orange-900">✍️ マスタ登録</h2>
                <button onclick="switchView('top-view')" class="text-[11px] bg-slate-200 text-slate-700 px-3 py-1.5 rounded-full font-bold shadow-xs">戻る</button>
            </div>

            <!-- タブナビゲーションボタン群 -->
            <div class="grid grid-cols-4 gap-1 bg-orange-200/80 p-1 rounded-xl">
                <button onclick="switchTab('tab-me', this)" class="reg-tab-btn py-2 px-1 text-[11px] font-black rounded-lg text-center transition bg-white text-orange-900 shadow-xs">自分</button>
                <button onclick="switchTab('tab-sit', this)" class="reg-tab-btn py-2 px-1 text-[11px] font-black rounded-lg text-center transition text-slate-700">シチュ</button>
                <button onclick="switchTab('tab-level', this)" class="reg-tab-btn py-2 px-1 text-[11px] font-black rounded-lg text-center transition text-slate-700">レベル</button>
                <button onclick="switchTab('tab-note', this)" class="reg-tab-btn py-2 px-1 text-[11px] font-black rounded-lg text-center transition text-slate-700">特記</button>
            </div>

            <!-- タブ 1: 自分のこと -->
            <div id="tab-me" class="tab-content active bg-white p-4 rounded-xl shadow-xs space-y-3 border border-orange-100">
                <div class="font-bold text-xs text-orange-900 border-b border-orange-100 pb-2">1. 自分のこと（短い文章で追加）</div>
                <div class="flex gap-2">
                    <input id="input-me" type="text" placeholder="例: 趣味はゴルフ" class="flex-1 border border-orange-200 rounded-lg px-3 py-2 text-xs bg-orange-50/20 focus:outline-none focus:border-orange-500">
                    <button onclick="addMe()" class="bg-orange-500 text-white px-4 py-2 rounded-lg text-xs font-bold tap-active shadow-xs">追加</button>
                </div>
                <div id="list-me" class="flex flex-wrap gap-1.5 pt-1"></div>
            </div>

            <!-- タブ 2: シチュエーション -->
            <div id="tab-sit" class="tab-content bg-white p-4 rounded-xl shadow-xs space-y-3 border border-orange-100">
                <div class="font-bold text-xs text-orange-900 border-b border-orange-100 pb-2">2. シチュエーション登録</div>
                <input id="sit-title" type="text" placeholder="タイトル (例: カフェで注文)" class="w-full border border-orange-200 rounded-lg px-3 py-2 text-xs bg-orange-50/20">
                <input id="sit-ai-role" type="text" placeholder="AIの役割 (例: カフェ店員Alex)" class="w-full border border-orange-200 rounded-lg px-3 py-2 text-xs bg-orange-50/20">
                <input id="sit-my-goal" type="text" placeholder="私の目的 (例: オーツミルクに変更を伝える)" class="w-full border border-orange-200 rounded-lg px-3 py-2 text-xs bg-orange-50/20">
                <button onclick="addSituation()" class="w-full bg-orange-500 text-white py-2.5 rounded-lg text-xs font-bold tap-active shadow-xs">シチュエーション登録</button>
                <div id="list-sit" class="space-y-2 pt-1 max-h-60 overflow-y-auto"></div>
            </div>

            <!-- タブ 3: レベル登録 -->
            <div id="tab-level" class="tab-content bg-white p-4 rounded-xl shadow-xs space-y-3 border border-orange-100">
                <div class="font-bold text-xs text-orange-900 border-b border-orange-100 pb-2">3. レベル登録</div>
                <input id="level-title" type="text" placeholder="タイトル (例: 中学英語＋簡単質問)" class="w-full border border-orange-200 rounded-lg px-3 py-2 text-xs bg-orange-50/20">
                <input id="level-content" type="text" placeholder="内容 (例: 中学レベルでAIが質問する)" class="w-full border border-orange-200 rounded-lg px-3 py-2 text-xs bg-orange-50/20">
                <button onclick="addLevel()" class="w-full bg-orange-500 text-white py-2.5 rounded-lg text-xs font-bold tap-active shadow-xs">レベル登録</button>
                <div id="list-level" class="space-y-2 pt-1 max-h-60 overflow-y-auto"></div>
            </div>

            <!-- タブ 4: 特記事項 -->
            <div id="tab-note" class="tab-content bg-white p-4 rounded-xl shadow-xs space-y-3 border border-orange-100">
                <div class="font-bold text-xs text-orange-900 border-b border-orange-100 pb-2">4. 特記事項（短い文章で追加）</div>
                <div class="flex gap-2">
                    <input id="input-note" type="text" placeholder="追加ルールがあれば" class="flex-1 border border-orange-200 rounded-lg px-3 py-2 text-xs bg-orange-50/20">
                    <button onclick="addNote()" class="bg-orange-500 text-white px-4 py-2 rounded-lg text-xs font-bold tap-active shadow-xs">追加</button>
                </div>
                <div id="list-note" class="flex flex-wrap gap-1.5 pt-1"></div>
            </div>
        </div>

        <!-- 呼び出し＆生成ビュー -->
        <div id="call-view" class="hidden space-y-3.5 mt-2">
            <div class="flex items-center justify-between">
                <h2 class="font-black text-sm text-orange-900">🎯 マスタ呼び出し＆生成</h2>
                <button onclick="switchView('top-view')" class="text-[11px] bg-slate-200 text-slate-700 px-3 py-1.5 rounded-full font-bold shadow-xs">戻る</button>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-xs space-y-3 border border-orange-100">
                <div>
                    <label class="text-xs font-bold text-slate-700">シチュエーションを選ぶ</label>
                    <select id="call-sit" class="w-full border border-orange-200 rounded-lg px-3 py-2 text-xs bg-orange-50/25 mt-1"></select>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-700">レベルを選ぶ</label>
                    <select id="call-level" class="w-full border border-orange-200 rounded-lg px-3 py-2 text-xs bg-orange-50/25 mt-1"></select>
                </div>
                <button onclick="generatePrompt()" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 text-white font-black py-3 rounded-xl shadow-sm tap-active text-xs">
                    ✨ ChatGPT用スクリプト（プロンプト）生成
                </button>
            </div>

            <!-- 生成結果出力エリア -->
            <div id="output-area" class="hidden bg-white p-4 rounded-xl shadow-sm space-y-2.5 border-2 border-orange-400">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-black text-orange-900">コピペ用プロンプト</span>
                    <button onclick="copyPrompt()" class="bg-orange-100 text-orange-800 px-3 py-1 rounded-lg text-[11px] font-bold shadow-xs">コピー</button>
                </div>
                <textarea id="prompt-result" rows="8" readonly class="w-full bg-orange-50/30 border border-orange-200 rounded-lg p-3 text-[11px] text-slate-800 font-mono leading-relaxed"></textarea>
            </div>
        </div>

    </main>

    <script>
        // デフォルト初期値
        const DEFAULT_NOTES = [
            "AIからどんどん話しかける",
            "途中で遮らないで待って",
            "最後に日本語でフィードバックください"
        ];
        const DEFAULT_ME = ["ゴルフが好き", "日常会話をスムーズにしたい"];
        const DEFAULT_LEVELS = [
            { title: '中学英語＋簡単質問', content: '①中学校英語レベルでAIが簡単な質問をする' },
            { title: '中学英語＋簡単質問＋世間話', content: '②中学校英語レベルでAIが簡単な質問をし、最後に世間話が入る' }
        ];

        let db = JSON.parse(localStorage.getItem('tapulse_db_v9')) || {
            me: DEFAULT_ME,
            situations: [{
                title: 'カフェで注文', 
                aiRole: 'フレンドリーなカフェ店員Alex', 
                myGoal: 'オーツミルク変更をクリアに伝える'
            }],
            levels: [...DEFAULT_LEVELS],
            notes: [...DEFAULT_NOTES]
        };

        function saveDB() {
            localStorage.setItem('tapulse_db_v9', JSON.stringify(db));
            renderSummary();
            renderLists();
        }

        function switchView(viewId) {
            ['top-view', 'register-view', 'call-view'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
            if (viewId === 'call-view') populateCallSelects();
        }

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => {
                el.classList.remove('active');
            });
            document.getElementById(tabId).classList.add('active');

            document.querySelectorAll('.reg-tab-btn').forEach(btn => {
                btn.className = "reg-tab-btn py-2 px-1 text-[11px] font-black rounded-lg text-center transition text-slate-700";
            });
            btnElement.className = "reg-tab-btn py-2 px-1 text-[11px] font-black rounded-lg text-center transition bg-white text-orange-900 shadow-xs";
        }

        function renderSummary() {
            const sumEl = document.getElementById('summary-text');
            sumEl.innerHTML = `
                自分設定: <strong class="text-orange-900">${db.me.length}</strong>件 | シチュエーション: <strong class="text-orange-900">${db.situations.length}</strong>個 | レベル: <strong class="text-orange-900">${db.levels.length}</strong>個 | 特記: <strong class="text-orange-900">${db.notes.length}</strong>件
            `;
        }

        function renderLists() {
            document.getElementById('list-me').innerHTML = db.me.map((item, idx) => 
                `<span class="bg-orange-100/80 text-orange-900 text-[11px] px-3 py-1 rounded-full flex items-center gap-1.5 border border-orange-200 font-medium">${item} <button onclick="removeItem('me', ${idx})" class="font-black text-orange-600 text-sm">×</button></span>`
            ).join('');

            document.getElementById('list-sit').innerHTML = db.situations.map((s, idx) => `
                <div class="text-[11px] bg-orange-50/40 p-3 rounded-lg space-y-1 border border-orange-100">
                    <div class="flex justify-between items-center font-bold text-slate-900">
                        <span class="text-xs">${s.title}</span>
                        <button onclick="removeItem('situations', ${idx})" class="text-rose-600 font-bold px-2 py-0.5 bg-rose-50 rounded text-[10px]">削除</button>
                    </div>
                    <div class="text-slate-600">🤖 役割: ${s.aiRole}</div>
                    <div class="text-slate-600">🎯 目的: ${s.myGoal}</div>
                </div>
            `).join('');

            document.getElementById('list-level').innerHTML = db.levels.map((l, idx) => `
                <div class="text-[11px] bg-orange-50/40 p-3 rounded-lg space-y-1 border border-orange-100">
                    <div class="flex justify-between items-center font-bold text-slate-900">
                        <span class="text-xs">${l.title}</span>
                        <button onclick="removeItem('levels', ${idx})" class="text-rose-600 font-bold px-2 py-0.5 bg-rose-50 rounded text-[10px]">削除</button>
                    </div>
                    <div class="text-slate-600">📄 内容: ${l.content}</div>
                </div>
            `).join('');

            document.getElementById('list-note').innerHTML = db.notes.map((item, idx) => 
                `<span class="bg-slate-100 text-slate-800 text-[11px] px-3 py-1 rounded-full flex items-center gap-1.5 font-medium border border-slate-200">${item} <button onclick="removeItem('notes', ${idx})" class="font-black text-slate-500 text-sm">×</button></span>`
            ).join('');
        }

        function removeItem(key, idx) {
            db[key].splice(idx, 1);
            saveDB();
        }

        function addMe() {
            const val = document.getElementById('input-me').value.trim();
            if(!val) return;
            db.me.push(val);
            document.getElementById('input-me').value = '';
            saveDB();
        }

        function addSituation() {
            const title = document.getElementById('sit-title').value.trim();
            const aiRole = document.getElementById('sit-ai-role').value.trim();
            const myGoal = document.getElementById('sit-my-goal').value.trim();
            if(!title || !aiRole || !myGoal) return;
            db.situations.push({title, aiRole, myGoal});
            document.getElementById('sit-title').value = '';
            document.getElementById('sit-ai-role').value = '';
            document.getElementById('sit-my-goal').value = '';
            saveDB();
        }

        function addLevel() {
            const title = document.getElementById('level-title').value.trim();
            const content = document.getElementById('level-content').value.trim();
            if(!title || !content) return;
            db.levels.push({title, content});
            document.getElementById('level-title').value = '';
            document.getElementById('level-content').value = '';
            saveDB();
        }

        function addNote() {
            const val = document.getElementById('input-note').value.trim();
            if(!val) return;
            db.notes.push(val);
            document.getElementById('input-note').value = '';
            saveDB();
        }

        function openCallView() {
            switchView('call-view');
        }

        function populateCallSelects() {
            const sSel = document.getElementById('call-sit');
            sSel.innerHTML = db.situations.map((s, i) => `<option value="${i}">${s.title}（役:${s.aiRole} / 目:${s.myGoal}）</option>`).join('');

            const lSel = document.getElementById('call-level');
            lSel.innerHTML = db.levels.map((l, i) => `<option value="${i}">${l.title}</option>`).join('');
        }

        function generatePrompt() {
            const sIdx = document.getElementById('call-sit').value;
            const lIdx = document.getElementById('call-level').value;

            const sit = db.situations[sIdx] || {
                title: '会話', 
                aiRole: '対話相手', 
                myGoal: 'スムーズにやり取りする'
            };
            const levelObj = db.levels[lIdx] || {
                title: '標準レベル',
                content: '中学校英語レベルで会話する'
            };

            const promptText = `【ロールプレイ設定】
・シチュエーション: ${sit.title}
・あなた（AI）の役割: ${sit.aiRole}
・私（ユーザー）の目的: ${sit.myGoal}
・英語レベル・方針: ${levelObj.content}

【私（ユーザー）について】
${db.me.map(m => '- ' + m).join('\n')}

【特別ルール】
${db.notes.map(n => '- ' + n).join('\n')}

さあ、上記の役割になりきって、シチュエーションの最初のセリフ（英語）からロールプレイを開始してください！`;

            document.getElementById('output-area').classList.remove('hidden');
            document.getElementById('prompt-result').value = promptText;
        }

        function copyPrompt() {
            const textarea = document.getElementById('prompt-result');
            textarea.select();
            document.execCommand('copy');
            alert('プロンプトをコピーしました！ChatGPTに貼り付けてください。');
        }

        // 初期描画
        saveDB();
    </script>
</body>
</html>
