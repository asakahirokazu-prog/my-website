<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カスタムAI英会話シミュレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-full bg-slate-900 text-slate-100 flex flex-col">

    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 p-2 rounded-xl text-white font-bold text-xl shadow-lg shadow-indigo-500/30">🗣️</div>
            <div>
                <h1 class="text-xl font-bold tracking-tight">Custom AI English Studio</h1>
                <p class="text-xs text-slate-400">あなたの実体験でカスタマイズする英会話トレーニング</p>
            </div>
        </div>
        <div id="header-status" class="hidden items-center space-x-2 bg-slate-700/50 px-3 py-1.5 rounded-full text-xs border border-slate-600">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="status-text" class="font-medium text-slate-300">セッション進行中</span>
        </div>
    </header>

    <main class="flex-1 overflow-hidden flex flex-col md:flex-row">
        
        <!-- Setup / Sidebar Panel -->
        <section id="setup-panel" class="w-full md:w-96 bg-slate-800/90 border-r border-slate-700 flex flex-col h-full overflow-y-auto p-6 space-y-6 transition-all duration-300">
            <div>
                <h2 class="text-lg font-semibold text-white mb-1">シチュエーション設定</h2>
                <p class="text-xs text-slate-400">実際に経験した、または予定している具体的な場面を入力してください。</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">1. シチュエーションの場所・場面</label>
                    <input type="text" id="setting-place" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition-colors" placeholder="例: ロンドンのホテルのフロント、海外の取引先オフィスなど">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">2. あなたの役割 (Your Role)</label>
                    <input type="text" id="setting-my-role" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition-colors" placeholder="例: 予約変更をしたい宿泊客、新規プロジェクトの提案者など">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">3. AIの役割 (AI's Role)</label>
                    <input type="text" id="setting-ai-role" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition-colors" placeholder="例: ホテルのレセプショニスト、少し厳しい外国人の上司など">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">4. 今回の目的・ゴール</label>
                    <input type="text" id="setting-goal" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition-colors" placeholder="例: 部屋をアップグレードしてもらう、予算の承認をもらうなど">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">5. トーン・雰囲気</label>
                    <select id="setting-tone" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition-colors">
                        <option value="polite and professional">丁寧・ビジネス (Polite & Professional)</option>
                        <option value="casual and friendly">カジュアル・フレンドリー (Casual & Friendly)</option>
                        <option value="strict and challenging">少し厳しめ・実践的 (Strict & Challenging)</option>
                        <option value="quick and efficient">テンポよくスピーディ (Quick & Efficient)</option>
                    </select>
                </div>
            </div>

            <button id="start-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-indigo-600/30 transition-all transform active:scale-98 flex items-center justify-center space-x-2">
                <span>🚀 セッションを開始する</span>
            </button>
        </section>

        <!-- Chat / Interactive Panel -->
        <section id="chat-panel" class="flex-1 flex flex-col h-full bg-slate-950/50 relative hidden">
            
            <!-- Context Banner -->
            <div id="context-banner" class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between text-xs text-slate-400">
                <div class="flex items-center space-x-2 truncate">
                    <span class="font-semibold text-indigo-400">状況:</span>
                    <span id="banner-text" class="truncate"></span>
                </div>
                <button id="reset-btn" class="text-slate-400 hover:text-white underline transition-colors whitespace-nowrap ml-4">設定をやり直す</button>
            </div>

            <!-- Chat Messages Area -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-6 space-y-4">
                <!-- Messages will be injected here -->
            </div>

            <!-- Input Bar -->
            <div class="p-4 bg-slate-900 border-t border-slate-800 flex items-center space-x-3">
                <button id="mic-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-3 rounded-xl border border-slate-700 transition-colors flex items-center justify-center" title="音声入力 (Speech-to-Text)">
                    🎤
                </button>
                <div class="flex-1 relative">
                    <input type="text" id="user-input" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 pr-12 transition-colors" placeholder="英語で入力または音声入力..." autocomplete="off">
                </div>
                <button id="send-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-xl font-semibold shadow-md shadow-indigo-600/30 transition-all flex items-center justify-center">
                    送信
                </button>
                <button id="finish-btn" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 hover:text-emerald-300 px-4 py-3 rounded-xl border border-slate-700 font-semibold text-sm transition-colors whitespace-nowrap">
                    終了・評価
                </button>
            </div>
        </section>

    </main>

    <!-- Feedback Modal -->
    <div id="feedback-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-slate-800 px-6 py-4 border-b border-slate-700 flex items-center justify-between">
                <h3 class="text-lg font-bold text-white flex items-center space-x-2">
                    <span>📊 セッション総括 & フィードバック</span>
                </h3>
                <button id="close-modal-btn" class="text-slate-400 hover:text-white text-xl">&times;</button>
            </div>
            <div id="feedback-content" class="p-6 overflow-y-auto space-y-6 text-sm text-slate-300">
                <!-- AI Feedback rendered here -->
            </div>
            <div class="bg-slate-800/80 px-6 py-4 border-t border-slate-700 flex justify-end">
                <button id="restart-session-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl font-semibold text-sm transition-all">
                    新しいセッションを作成する
                </button>
            </div>
        </div>
    </div>

    <script>
        // State Management
        let sessionConfig = {};
        let chatHistory = [];
        let systemInstruction = "";

        // DOM Elements
        const setupPanel = document.getElementById('setup-panel');
        const chatPanel = document.getElementById('chat-panel');
        const headerStatus = document.getElementById('header-status');
        const bannerText = document.getElementById('banner-text');
        const messagesContainer = document.getElementById('messages-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const micBtn = document.getElementById('mic-btn');
        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');
        const finishBtn = document.getElementById('finish-btn');
        const feedbackModal = document.getElementById('feedback-modal');
        const feedbackContent = document.getElementById('feedback-content');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const restartSessionBtn = document.getElementById('restart-session-btn');

        // Speech Recognition Setup
        let recognition = null;
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onresult = (event) => {
                const speechResult = event.results[0][0].transcript;
                userInput.value = speechResult;
                micBtn.classList.remove('bg-red-600', 'text-white', 'animate-pulse');
                micBtn.classList.add('bg-slate-800', 'text-slate-300');
            };

            recognition.onerror = () => {
                micBtn.classList.remove('bg-red-600', 'text-white', 'animate-pulse');
                micBtn.classList.add('bg-slate-800', 'text-slate-300');
            };

            recognition.onend = () => {
                micBtn.classList.remove('bg-red-600', 'text-white', 'animate-pulse');
                micBtn.classList.add('bg-slate-800', 'text-slate-300');
            };
        }

        micBtn.addEventListener('click', () => {
            if (!recognition) {
                alert('お使いのブラウザは音声入力に対応していません。テキスト入力をご利用ください。');
                return;
            }
            try {
                recognition.start();
                micBtn.classList.remove('bg-slate-800', 'text-slate-300');
                micBtn.classList.add('bg-red-600', 'text-white', 'animate-pulse');
            } catch (e) {
                recognition.stop();
            }
        });

        startBtn.addEventListener('click', async () => {
            const place = document.getElementById('setting-place').value.trim();
            const myRole = document.getElementById('setting-my-role').value.trim();
            const aiRole = document.getElementById('setting-ai-role').value.trim();
            const goal = document.getElementById('setting-goal').value.trim();
            const tone = document.getElementById('setting-tone').value;

            if (!place || !myRole || !aiRole) {
                alert('「場所」「あなたの役割」「AIの役割」は最低限入力してください。');
                return;
            }

            sessionConfig = { place, myRole, aiRole, goal, tone };
            bannerText.textContent = `場所: ${place} | あなた: ${myRole} | 相手: ${aiRole} | 目的: ${goal || '特になし'}`;

            // Build System Instruction
            systemInstruction = `You are roleplaying in an English conversation practice application.
Situation / Setting: ${place}
User's Role: ${myRole}
Your Role (AI): ${aiRole}
User's Goal: ${goal || 'Complete the conversation naturally.'}
Conversation Tone: ${tone}

Rules:
1. Stay strictly in character as ${aiRole}.
2. Speak ONLY in English, appropriate for the situation and tone.
3. Keep your responses natural, conversational, and relatively concise (1-3 sentences) so the user can easily reply.
4. Do not break character or give away that you are an AI assistant unless the user asks for feedback or ends the session.
5. Start the conversation first by greeting the user or initiating the dialogue fitting the setting.`;

            setupPanel.classList.add('hidden');
            chatPanel.classList.remove('hidden');
            headerStatus.classList.remove('hidden');
            headerStatus.classList.add('flex');

            messagesContainer.innerHTML = '';
            chatHistory = [];

            // Trigger AI initial message
            await callGeminiAI(true);
        });

        resetBtn.addEventListener('click', () => {
            chatPanel.classList.add('hidden');
            headerStatus.classList.remove('flex');
            headerStatus.classList.add('hidden');
            setupPanel.classList.remove('hidden');
        });

        sendBtn.addEventListener('click', handleUserSendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleUserSendMessage();
        });

        async function handleUserSendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';

            chatHistory.push({ role: 'user', parts: [{ text: text }] });

            await callGeminiAI(false);
        }

        async function callGeminiAI(isInitial = false) {
            // Loading message placeholder
            const loadingId = 'loading-' + Date.now();
            appendLoadingMessage(loadingId);

            const payload = {
                contents: isInitial ? [{ role: 'user', parts: [{ text: "Start the conversation based on your role and setting." }] }] : chatHistory,
                systemInstruction: {
                    parts: [{ text: systemInstruction }]
                }
            };

            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            let success = false;
            let responseText = "";
            let attempts = 0;
            let delay = 1000;

            while (!success && attempts < 4) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    const candidate = result.candidates?.[0];
                    if (candidate && candidate.content?.parts?.[0]?.text) {
                        responseText = candidate.content.parts[0].text;
                        success = true;
                    } else {
                        throw new Error('Invalid response structure');
                    }
                } catch (e) {
                    attempts++;
                    if (attempts >= 4) {
                        responseText = "Sorry, I had trouble connecting. Let's try again.";
                        success = true;
                    } else {
                        await new Promise(resolve => setTimeout(resolve, delay));
                        delay *= 2;
                    }
                }
            }

            removeLoadingMessage(loadingId);
            appendMessage('model', responseText);
            chatHistory.push({ role: 'model', parts: [{ text: responseText }] });

            // Auto-speak AI response using Web Speech API (TTS)
            playAudioResponse(responseText);
        }

        function playAudioResponse(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop previous utterance
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function appendMessage(sender, text) {
            const isUser = sender === 'user';
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;

            const bubble = document.createElement('div');
            bubble.className = `max-w-xl rounded-2xl px-4 py-3 text-sm leading-relaxed ${
                isUser 
                    ? 'bg-indigo-600 text-white rounded-br-none shadow-md shadow-indigo-600/20' 
                    : 'bg-slate-800 text-slate-200 border border-slate-700 rounded-bl-none'
            }`;
            
            const header = document.createElement('div');
            header.className = `text-[10px] font-semibold mb-1 ${isUser ? 'text-indigo-200 text-right' : 'text-slate-400'}`;
            header.textContent = isUser ? 'あなた (You)' : `AI (${sessionConfig.aiRole || 'Assistant'})`;

            const content = document.createElement('div');
            content.textContent = text;

            bubble.appendChild(header);
            bubble.appendChild(content);

            // Add speaker icon for AI messages
            if (!isUser && 'speechSynthesis' in window) {
                const speakBtn = document.createElement('button');
                speakBtn.className = 'mt-2 text-xs text-indigo-400 hover:text-indigo-300 flex items-center space-x-1';
                speakBtn.innerHTML = '🔊 音声を聴く';
                speakBtn.onclick = () => playAudioResponse(text);
                bubble.appendChild(speakBtn);
            }

            messageDiv.appendChild(bubble);
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function appendLoadingMessage(id) {
            const messageDiv = document.createElement('div');
            messageDiv.id = id;
            messageDiv.className = 'flex justify-start';

            const bubble = document.createElement('div');
            bubble.className = 'bg-slate-800 text-slate-400 border border-slate-700 rounded-2xl rounded-bl-none px-4 py-3 text-sm flex items-center space-x-2';
            bubble.innerHTML = `
                <span class="w-2 h-2 rounded-full bg-indigo-500 animate-bounce"></span>
                <span class="w-2 h-2 rounded-full bg-indigo-500 animate-bounce [animation-delay:0.2s]"></span>
                <span class="w-2 h-2 rounded-full bg-indigo-500 animate-bounce [animation-delay:0.4s]"></span>
                <span class="text-xs ml-2">AIが入力中...</span>
            `;
            messageDiv.appendChild(bubble);
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function removeLoadingMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        // Finish Session and Evaluate
        finishBtn.addEventListener('click', async () => {
            if (chatHistory.length < 2) {
                alert('まだ会話がほとんど進んでいません。もう少し会話を続けてみましょう。');
                return;
            }

            feedbackModal.classList.remove('hidden');
            feedbackContent.innerHTML = `
                <div class="flex flex-col items-center justify-center py-10 space-y-3">
                    <div class="w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-xs text-slate-400">会話内容を分析し、フィードバックを作成中...</p>
                </div>
            `;

            const evaluationPrompt = `Analyze the following English conversation session and provide constructive feedback for the user in Japanese.
Situation: ${sessionConfig.place}
User Role: ${sessionConfig.myRole}
AI Role: ${sessionConfig.aiRole}
Goal: ${sessionConfig.goal || 'N/A'}

Conversation history:
${JSON.stringify(chatHistory)}

Please provide:
1. 全体的な評価と目標達成度 (Overall Evaluation)
2. 良かった点 (Good Points)
3. 改善点・より自然な表現の提案 (Better Expressions / Grammar Corrections)
4. 次回に向けたアドバイス (Next Steps)

Format the output clearly with clean headings or bullet points.`;

            const payload = {
                contents: [{ role: 'user', parts: [{ text: evaluationPrompt }] }]
            };

            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text || "フィードバックの取得に失敗しました。";
                
                // Format markdown-like newlines
                feedbackContent.innerHTML = `<div class="whitespace-pre-wrap leading-relaxed">${text}</div>`;
            } catch (e) {
                feedbackContent.innerHTML = `<p class="text-red-400">フィードバックの生成中にエラーが発生しました。</p>`;
            }
        });

        closeModalBtn.addEventListener('click', () => {
            feedbackModal.classList.add('hidden');
        });

        restartSessionBtn.addEventListener('click', () => {
            feedbackModal.classList.add('hidden');
            chatPanel.classList.add('hidden');
            headerStatus.classList.remove('flex');
            headerStatus.classList.add('hidden');
            setupPanel.classList.remove('hidden');
            document.getElementById('setting-place').value = '';
            document.getElementById('setting-my-role').value = '';
            document.getElementById('setting-ai-role').value = '';
            document.getElementById('setting-goal').value = '';
        });
    </script>

</body>
</html>
