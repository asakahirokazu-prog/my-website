<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PromptPitch (IndexedDB)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tap-active:active { transform: scale(0.97); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .custom-modal-backdrop {
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body class="bg-amber-100/70 min-h-screen text-slate-800 font-sans pb-12 text-xs">

    <header class="bg-gradient-to-r from-orange-600 to-amber-600 text-white p-4 text-center shadow-sm">
        <h1 class="text-lg font-black tracking-wider">🌟 Prompt Pitch</h1>
        <p class="text-[11px] font-medium opacity-95 mt-1">IndexedDB保存対応！秒速プロンプト作成メーカー</p>
    </header>

    <!-- メインコンテナ -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <div id="top-view" class="space-y-4 mt-2">
            <div>
                <button onclick="openCallView()" class="tap-active w-full bg-gradient-to-r from-orange-600 via-amber-600 to-orange-700 text-white font-black py-7 px-4 rounded-2xl shadow-md flex flex-col items-center justify-center hover:opacity-95 transition transform hover:-translate-y-0.5 border border-white/25">
                    <span class="text-3xl mb-1 animate-bounce">🚀</span>
                    <span class="text-lg tracking-wider font-extrabold">さあ、やろう！</span>
                    <span class="text-[11px] font-medium opacity-95 mt-1">AI英会話プロンプトを秒速で生成する</span>
                </button>
            </div>

            <div class="flex justify-center">
                <button onclick="switchView('register-view')" class="tap-active bg-white border border-orange-300 text-orange-800 font-bold py-2.5 px-6 rounded-full shadow-xs flex items-center gap-2 hover:bg-orange-100 transition text-xs">
                    <span class="text-sm">📝</span>
                    <span>マスタ登録・編集はこちら</span>
                </button>
            </div>

            <!-- ストック状況サマリ -->
            <div class="bg-white/90 rounded-xl p-3.5 shadow-xs border border-orange-200 space-y-1.5">
                <div class="flex items-center justify-between">
                    <div class="font-bold text-xs text-orange-900">📌 現在のストック状況 (IndexedDB)</div>
                    <span id="db-status-badge" class="bg-amber-200 text-amber-900 text-[10px] px-2 py-0.5 rounded-full font-bold">接続中...</span>
                </div>
                <div id="summary-text" class="text-slate-700 text-[11px] leading-relaxed">データを読み込んでいます...</div>
            </div>
        </div>

        <div id="register-view" class="hidden space-y-3.5 mt-2">
            <div class="flex items-center justify-between">
                <h2 class="font-black text-sm text-orange-900">✍️ マスタ登録</h2>
                <button onclick="switchView('top-view')" class="text-[11px] bg-slate-300 text-slate-800 px-3 py-1.5 rounded-full font-bold shadow-xs">戻る</button>
            </div>

            <div class="grid grid-cols-4 gap-1 bg-orange-300/80 p-1 rounded-xl">
                <button onclick="switchTab('tab-me', this)" class="reg-tab-btn py-2 px-1 text-[11px] font-black rounded-lg text-center transition bg-white text-orange-900 shadow-xs">自分</button>
                <button onclick="switchTab('tab-sit', this)" class="reg-tab-btn py-2 px-1 text-[11px] font-black rounded-lg text-center transition text-slate-800">シチュ</button>
                <button onclick="switchTab('tab-level', this)" class="reg-tab-btn py-2 px-1 text-[11px] font-black rounded-lg text-center transition text-slate-800">レベル</button>
                <button onclick="switchTab('tab-note', this)" class="reg-tab-btn py-2 px-1 text-[11px] font-black rounded-lg text-center transition text-slate-800">特記</button>
            </div>

            <!-- タブ 1: 自分のこと -->
            <div id="tab-me" class="tab-content active bg-white/95 p-4 rounded-xl shadow-xs space-y-3 border border-orange-200">
                <div class="font-bold text-xs text-orange-900 border-b border-orange-200 pb-2">1. 自分のこと（短い文章で追加）</div>
                <div class="flex gap-2">
                    <input id="input-me" type="text" placeholder="例: 趣味はゴルフ" class="flex-1 border border-orange-300 rounded-lg px-3 py-2 text-xs bg-orange-50/50 focus:outline-none focus:border-orange-600">
                    <button onclick="addMe()" class="bg-orange-600 text-white px-4 py-2 rounded-lg text-xs font-bold tap-active shadow-xs">追加</button>
                </div>
                <div id="list-me" class="flex flex-wrap gap-1.5 pt-1"></div>
            </div>

            <div id="tab-sit" class="tab-content bg-white/95 p-4 rounded-xl shadow-xs space-y-3 border border-orange-200">
                <div class="font-bold text-xs text-orange-900 border-b border-orange-200 pb-2">2. シチュエーション登録</div>
                <input id="sit-title" type="text" placeholder="タイトル (例: カフェで注文)" class="w-full border border-orange-300 rounded-lg px-3 py-2 text-xs bg-orange-50/50">
                <input id="sit-ai-role" type="text" placeholder="AIの役割 (例: カフェ店員Alex)" class="w-full border border-orange-300 rounded-lg px-3 py-2 text-xs bg-orange-50/50">
                <textarea id="sit-my-goal" rows="4" placeholder="私の目的 (例: オーツミルクに変更を伝える)" class="w-full border border-orange-300 rounded-lg px-3 py-2 text-xs bg-orange-50/50 resize-y focus:outline-none focus:border-orange-600"></textarea>
                <button onclick="addSituation()" class="w-full bg-orange-600 text-white py-2.5 rounded-lg text-xs font-bold tap-active shadow-xs">シチュエーション登録</button>
                <div id="list-sit" class="space-y-2 pt-1 max-h-60 overflow-y-auto"></div>
            </div>

            <!-- タブ 3: レベル登録 -->
            <div id="tab-level" class="tab-content bg-white/95 p-4 rounded-xl shadow-xs space-y-3 border border-orange-200">
                <div class="font-bold text-xs text-orange-900 border-b border-orange-200 pb-2">3. レベル登録</div>
                <input id="level-title" type="text" placeholder="タイトル (例: 中学英語＋簡単質問)" class="w-full border border-orange-300 rounded-lg px-3 py-2 text-xs bg-orange-50/50">
                <input id="level-content" type="text" placeholder="内容 (例: 中学レベルでAIが質問する)" class="w-full border border-orange-300 rounded-lg px-3 py-2 text-xs bg-orange-50/50">
                <button onclick="addLevel()" class="w-full bg-orange-600 text-white py-2.5 rounded-lg text-xs font-bold tap-active shadow-xs">レベル登録</button>
                <div id="list-level" class="space-y-2 pt-1 max-h-60 overflow-y-auto"></div>
            </div>

            <div id="tab-note" class="tab-content bg-white/95 p-4 rounded-xl shadow-xs space-y-3 border border-orange-200">
                <div class="font-bold text-xs text-orange-900 border-b border-orange-200 pb-2">4. 特記事項（文章で追加）</div>
                <div class="space-y-2">
                    <textarea id="input-note" rows="4" placeholder="追加ルールがあれば (例: AIからどんどん話しかける、途中で遮らないで待って)" class="w-full border border-orange-300 rounded-lg px-3 py-2 text-xs bg-orange-50/50 resize-y focus:outline-none focus:border-orange-600"></textarea>
                    <button onclick="addNote()" class="w-full bg-orange-600 text-white py-2.5 rounded-lg text-xs font-bold tap-active shadow-xs">特記事項を追加</button>
                </div>
                <div id="list-note" class="flex flex-wrap gap-1.5 pt-1"></div>
            </div>
        </div>

        <div id="call-view" class="hidden space-y-3.5 mt-2">
            <div class="flex items-center justify-between">
                <h2 class="font-black text-sm text-orange-900">🎯 マスタ呼び出し＆生成</h2>
                <button onclick="switchView('top-view')" class="text-[11px] bg-slate-300 text-slate-800 px-3 py-1.5 rounded-full font-bold shadow-xs">戻る</button>
            </div>

            <div class="bg-white/95 p-4 rounded-xl shadow-xs space-y-3 border border-orange-200">
                <div>
                    <label class="text-xs font-bold text-slate-800">シチュエーションを選ぶ</label>
                    <select id="call-sit" class="w-full border border-orange-300 rounded-lg px-3 py-2 text-xs bg-orange-50/50 mt-1"></select>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-800">レベルを選ぶ</label>
                    <select id="call-level" class="w-full border border-orange-300 rounded-lg px-3 py-2 text-xs bg-orange-50/50 mt-1"></select>
                </div>
                <button onclick="generatePrompt()" class="w-full bg-gradient-to-r from-orange-600 to-amber-600 text-white font-black py-3 rounded-xl shadow-sm tap-active text-xs">
                    ✨ ChatGPT用スクリプト（プロンプト）生成
                </button>
            </div>

            <!-- 生成結果出力エリア -->
            <div id="output-area" class="hidden bg-white/95 p-4 rounded-xl shadow-sm space-y-2.5 border-2 border-orange-500">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-black text-orange-900">コピペ用プロンプト</span>
                    <button onclick="copyPrompt()" class="bg-orange-200 text-orange-900 px-3 py-1 rounded-lg text-[11px] font-bold shadow-xs">コピー</button>
                </div>
                <textarea id="prompt-result" rows="8" readonly class="w-full bg-orange-50/50 border border-orange-300 rounded-lg p-3 text-[11px] text-slate-800 font-mono leading-relaxed"></textarea>
            </div>
        </div>

    </main>

    <div id="custom-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden custom-modal-backdrop">
        <div class="bg-white rounded-2xl p-5 max-w-xs w-full shadow-lg border border-orange-200 text-center space-y-3">
            <div id="modal-icon" class="text-2xl">✨</div>
            <div id="modal-message" class="text-xs font-bold text-slate-800 leading-relaxed">通知メッセージ</div>
            <button onclick="closeModal()" class="w-full bg-orange-600 text-white py-2 rounded-xl text-xs font-bold shadow-xs tap-active">OK</button>
        </div>
    </div>

    <script>
        // カスタムメッセージボックス
        function showModal(message, icon = "✨") {
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = icon;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        // デフォルト初期値
        const DEFAULT_NOTES = [
            "AIからどんどん話しかける",
            "途中で遮らないで待って",
            "最後に日本語でフィードバックください"
        ];
        const DEFAULT_ME = ["ゴルフが好き", "日常会話をスムーズにしたい"];
        const DEFAULT_LEVELS = [
            { id: 1, title: '中学英語＋簡単質問', content: '①中学校英語レベルでAIが簡単な質問をする' },
            { id: 2, title: '中学英語＋簡単質問＋世間話', content: '②中学校英語レベルでAIが簡単な質問をし、最後に世間話が入る' }
        ];
        const DEFAULT_SITUATIONS = [
            { id: 1, title: 'カフェで注文', aiRole: 'フレンドリーなカフェ店員Alex', myGoal: 'オーツミルク変更をクリアに伝える' }
        ];

        // IndexedDB 管理変数
        let dbInstance = null;
        const DB_NAME = 'TalkPulseDB';
        const DB_VERSION = 1;

        let dbData = {
            me: [...DEFAULT_ME],
            situations: [...DEFAULT_SITUATIONS],
            levels: [...DEFAULT_LEVELS],
            notes: [...DEFAULT_NOTES]
        };

        // IndexedDB 接続の初期化
        function initIndexedDB() {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) {
                    console.warn("IndexedDB is not supported. Falling back to localStorage.");
                    loadFromLocalStorageFallback();
                    resolve(false);
                    return;
                }

                const request = indexedDB.open(DB_NAME, DB_VERSION);

                request.onerror = (event) => {
                    console.error("IndexedDB error: ", event.target.error);
                    loadFromLocalStorageFallback();
                    resolve(false);
                };

                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    const stores = ['me', 'situations', 'levels', 'notes'];
                    stores.forEach(storeName => {
                        if (!database.objectStoreNames.contains(storeName)) {
                            database.createObjectStore(storeName, { keyPath: 'id', autoIncrement: true });
                        }
                    });
                };

                request.onsuccess = (event) => {
                    dbInstance = event.target.result;
                    document.getElementById('db-status-badge').innerText = "IndexedDB稼働中";
                    document.getElementById('db-status-badge').className = "bg-emerald-200 text-emerald-900 text-[10px] px-2 py-0.5 rounded-full font-bold";
                    
                    checkAndSeedData().then(() => {
                        loadAllDataFromDB().then(() => resolve(true));
                    });
                };
            });
        }

        // LocalStorage フォールバック読み込み
        function loadFromLocalStorageFallback() {
            document.getElementById('db-status-badge').innerText = "LocalStorage稼働中";
            document.getElementById('db-status-badge').className = "bg-amber-200 text-amber-900 text-[10px] px-2 py-0.5 rounded-full font-bold";
            const saved = localStorage.getItem('tapulse_db_v10');
            if (saved) {
                try {
                    dbData = JSON.parse(saved);
                } catch(e) {
                    console.error(e);
                }
            }
            renderSummary();
            renderLists();
        }

        function checkAndSeedData() {
            return new Promise((resolve) => {
                const stores = ['me', 'situations', 'levels', 'notes'];
                let checkedCount = 0;
                let isEmpty = true;

                stores.forEach(storeName => {
                    const transaction = dbInstance.transaction(storeName, 'readonly');
                    const store = transaction.objectStore(storeName);
                    const countReq = store.count();

                    countReq.onsuccess = () => {
                        if (countReq.result > 0) {
                            isEmpty = false;
                        }
                        checkedCount++;
                        if (checkedCount === stores.length) {
                            if (isEmpty) {
                                const oldData = localStorage.getItem('tapulse_db_v10');
                                if (oldData) {
                                    try {
                                        const parsed = JSON.parse(oldData);
                                        seedParsedDataToDB(parsed).then(() => resolve());
                                        return;
                                    } catch(e) {}
                                }
                                seedDefaultDataToDB().then(() => resolve());
                            } else {
                                resolve();
                            }
                        }
                    };
                });
            });
        }

        function seedDefaultDataToDB() {
            return new Promise((resolve) => {
                const transaction = dbInstance.transaction(['me', 'situations', 'levels', 'notes'], 'readwrite');
                
                DEFAULT_ME.forEach(item => transaction.objectStore('me').add({ text: item }));
                DEFAULT_SITUATIONS.forEach(item => transaction.objectStore('situations').add(item));
                DEFAULT_LEVELS.forEach(item => transaction.objectStore('levels').add(item));
                DEFAULT_NOTES.forEach(item => transaction.objectStore('notes').add({ text: item }));

                transaction.oncomplete = () => resolve();
            });
        }

        function seedParsedDataToDB(parsed) {
            return new Promise((resolve) => {
                const transaction = dbInstance.transaction(['me', 'situations', 'levels', 'notes'], 'readwrite');
                
                if (parsed.me) parsed.me.forEach(text => transaction.objectStore('me').add({ text }));
                if (parsed.situations) parsed.situations.forEach(item => {
                    const cleanItem = { title: item.title, aiRole: item.aiRole, myGoal: item.myGoal };
                    transaction.objectStore('situations').add(cleanItem);
                });
                if (parsed.levels) parsed.levels.forEach(item => {
                    const cleanItem = { title: item.title, content: item.content };
                    transaction.objectStore('levels').add(cleanItem);
                });
                if (parsed.notes) parsed.notes.forEach(text => transaction.objectStore('notes').add({ text }));

                transaction.oncomplete = () => resolve();
            });
        }

        function loadAllDataFromDB() {
            return new Promise((resolve) => {
                if (!dbInstance) {
                    resolve();
                    return;
                }

                const stores = ['me', 'situations', 'levels', 'notes'];
                let loadedCount = 0;
                const newDbData = { me: [], situations: [], levels: [], notes: [] };

                stores.forEach(storeName => {
                    const transaction = dbInstance.transaction(storeName, 'readonly');
                    const store = transaction.objectStore(storeName);
                    const request = store.getAll();

                    request.onsuccess = (event) => {
                        const records = event.target.result;
                        if (storeName === 'me' || storeName === 'notes') {
                            newDbData[storeName] = records.map(r => r.text);
                        } else {
                            newDbData[storeName] = records;
                        }
                        loadedCount++;
                        if (loadedCount === stores.length) {
                            dbData = newDbData;
                            localStorage.setItem('tapulse_db_v10', JSON.stringify(dbData));
                            renderSummary();
                            renderLists();
                            resolve();
                        }
                    };
                });
            });
        }

        function addRecordToDB(storeName, valueObj) {
            if (!dbInstance) {
                if (storeName === 'me' || storeName === 'notes') {
                    dbData[storeName].push(valueObj.text);
                } else {
                    dbData[storeName].push(valueObj);
                }
                saveDBFallback();
                return;
            }

            const transaction = dbInstance.transaction(storeName, 'readwrite');
            const store = transaction.objectStore(storeName);
            store.add(valueObj);

            transaction.oncomplete = () => {
                loadAllDataFromDB();
            };
        }

        function removeRecordFromDB(storeName, id) {
            if (!dbInstance) {
                dbData[storeName].splice(id, 1);
                saveDBFallback();
                return;
            }

            const transaction = dbInstance.transaction(storeName, 'readwrite');
            const store = transaction.objectStore(storeName);
            store.delete(id);

            transaction.oncomplete = () => {
                loadAllDataFromDB();
            };
        }

        function saveDBFallback() {
            localStorage.setItem('tapulse_db_v10', JSON.stringify(dbData));
            renderSummary();
            renderLists();
        }

        function switchView(viewId) {
            ['top-view', 'register-view', 'call-view'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
            if (viewId === 'call-view') populateCallSelects();
        }

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => {
                el.classList.remove('active');
            });
            document.getElementById(tabId).classList.add('active');

            document.querySelectorAll('.reg-tab-btn').forEach(btn => {
                btn.className = "reg-tab-btn py-2 px-1 text-[11px] font-black rounded-lg text-center transition text-slate-800";
            });
            btnElement.className = "reg-tab-btn py-2 px-1 text-[11px] font-black rounded-lg text-center transition bg-white text-orange-900 shadow-xs";
        }

        function renderSummary() {
            const sumEl = document.getElementById('summary-text');
            sumEl.innerHTML = `
                自分設定: <strong class="text-orange-900">${dbData.me.length}</strong>件 | シチュエーション: <strong class="text-orange-900">${dbData.situations.length}</strong>個 | レベル: <strong class="text-orange-900">${dbData.levels.length}</strong>個 | 特記: <strong class="text-orange-900">${dbData.notes.length}</strong>件
            `;
        }

        function renderLists() {
            fetchAndRenderStoreItems();
        }

        function fetchAndRenderStoreItems() {
            if (!dbInstance) {
                renderListsFromMemory();
                return;
            }

            const stores = ['me', 'situations', 'levels', 'notes'];
            const fetched = {};
            let count = 0;

            stores.forEach(storeName => {
                const transaction = dbInstance.transaction(storeName, 'readonly');
                const store = transaction.objectStore(storeName);
                const req = store.getAllKeys();
                const reqVal = store.getAll();

                reqVal.onsuccess = (e) => {
                    const values = e.target.result;
                    const keys = req.result;
                    fetched[storeName] = values.map((val, idx) => {
                        return typeof val === 'object' ? { ...val, _id: keys[idx] } : { text: val, _id: keys[idx] };
                    });

                    count++;
                    if (count === stores.length) {
                        renderListsDOM(fetched);
                    }
                };
            });
        }

        function renderListsFromMemory() {
            const fetched = {
                me: dbData.me.map((t, i) => ({ text: t, _id: i })),
                situations: dbData.situations.map((s, i) => ({ ...s, _id: i })),
                levels: dbData.levels.map((l, i) => ({ ...l, _id: i })),
                notes: dbData.notes.map((n, i) => ({ text: n, _id: i }))
            };
            renderListsDOM(fetched);
        }

        function renderListsDOM(data) {
            document.getElementById('list-me').innerHTML = data.me.map((item) => 
                `<span class="bg-orange-200/90 text-orange-950 text-[11px] px-3 py-1 rounded-full flex items-center gap-1.5 border border-orange-300 font-medium">${item.text} <button onclick="removeItem('me', ${item._id})" class="font-black text-orange-700 text-sm">×</button></span>`
            ).join('');

            document.getElementById('list-sit').innerHTML = data.situations.map((s) => `
                <div class="text-[11px] bg-orange-100/60 p-3 rounded-lg space-y-1 border border-orange-200">
                    <div class="flex justify-between items-center font-bold text-slate-900">
                        <span class="text-xs">${s.title}</span>
                        <button onclick="removeItem('situations', ${s._id})" class="text-rose-700 font-bold px-2 py-0.5 bg-rose-100 rounded text-[10px]">削除</button>
                    </div>
                    <div class="text-slate-700">🤖 役割: ${s.aiRole}</div>
                    <div class="text-slate-700 whitespace-pre-wrap">🎯 目的: ${s.myGoal}</div>
                </div>
            `).join('');

            document.getElementById('list-level').innerHTML = data.levels.map((l) => `
                <div class="text-[11px] bg-orange-100/60 p-3 rounded-lg space-y-1 border border-orange-200">
                    <div class="flex justify-between items-center font-bold text-slate-900">
                        <span class="text-xs">${l.title}</span>
                        <button onclick="removeItem('levels', ${l._id})" class="text-rose-700 font-bold px-2 py-0.5 bg-rose-100 rounded text-[10px]">削除</button>
                    </div>
                    <div class="text-slate-700">📄 内容: ${l.content}</div>
                </div>
            `).join('');

            document.getElementById('list-note').innerHTML = data.notes.map((item) => 
                `<span class="bg-slate-200 text-slate-900 text-[11px] px-3 py-1 rounded-full flex items-center gap-1.5 font-medium border border-slate-300 whitespace-pre-wrap">${item.text} <button onclick="removeItem('notes', ${item._id})" class="font-black text-slate-700 text-sm">×</button></span>`
            ).join('');
        }

        function removeItem(key, id) {
            removeRecordFromDB(key, id);
        }

        function addMe() {
            const val = document.getElementById('input-me').value.trim();
            if(!val) return;
            addRecordToDB('me', { text: val });
            document.getElementById('input-me').value = '';
        }

        function addSituation() {
            const title = document.getElementById('sit-title').value.trim();
            const aiRole = document.getElementById('sit-ai-role').value.trim();
            const myGoal = document.getElementById('sit-my-goal').value.trim();
            if(!title || !aiRole || !myGoal) return;
            addRecordToDB('situations', { title, aiRole, myGoal });
            document.getElementById('sit-title').value = '';
            document.getElementById('sit-ai-role').value = '';
            document.getElementById('sit-my-goal').value = '';
        }

        function addLevel() {
            const title = document.getElementById('level-title').value.trim();
            const content = document.getElementById('level-content').value.trim();
            if(!title || !content) return;
            addRecordToDB('levels', { title, content });
            document.getElementById('level-title').value = '';
            document.getElementById('level-content').value = '';
        }

        function addNote() {
            const val = document.getElementById('input-note').value.trim();
            if(!val) return;
            addRecordToDB('notes', { text: val });
            document.getElementById('input-note').value = '';
        }

        function openCallView() {
            switchView('call-view');
        }

        function populateCallSelects() {
            const sSel = document.getElementById('call-sit');
            sSel.innerHTML = dbData.situations.map((s, i) => `<option value="${i}">${s.title}（役:${s.aiRole} / 目:${s.myGoal}）</option>`).join('');

            const lSel = document.getElementById('call-level');
            lSel.innerHTML = dbData.levels.map((l, i) => `<option value="${l.title}">${l.title}</option>`).join('');
        }

        function generatePrompt() {
            const sIdx = document.getElementById('call-sit').value;
            const lIdx = document.getElementById('call-level').value;

            const sit = dbData.situations[sIdx] || {
                title: '会話', 
                aiRole: '対話相手', 
                myGoal: 'スムーズにやり取りする'
            };
            const levelObj = dbData.levels[lIdx] || {
                title: '標準レベル',
                content: '中学校英語レベルで会話する'
            };

            const promptText = `AIと英会話したいです。AIが相手役になって以下のロールプレイ、特別ルールに従って英語で話しかけてください。

【ロールプレイ設定】
・シチュエーション: ${sit.title}
・あなた（AI）の役割: ${sit.aiRole}
・私（ユーザー）の目的: ${sit.myGoal}
・英語レベル・方針: ${levelObj.content}

【私（ユーザー）について】
${dbData.me.map(m => '- ' + m).join('\n')}

【特別ルール】
${dbData.notes.map(n => '- ' + n).join('\n')}

さあ、上記の役割になりきって、シチュエーションの最初のセリフ（英語）からロールプレイを開始してください！`;

            document.getElementById('output-area').classList.remove('hidden');
            document.getElementById('prompt-result').value = promptText;
        }

        function copyPrompt() {
            const textarea = document.getElementById('prompt-result');
            textarea.select();
            document.execCommand('copy');
            showModal('プロンプトをコピーしました！ChatGPTに貼り付けてください。', '📋');
        }

        window.onload = function() {
            initIndexedDB();
        };
    </script>
</body>
</html>
