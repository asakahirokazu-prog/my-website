<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TalkPulse AI 英会話ジェネレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tap-active:active { transform: scale(0.97); }
    </style>
</head>
<body class="bg-orange-50 min-h-screen text-gray-800 font-sans pb-12">

    <!-- ヘッダー -->
    <header class="bg-gradient-to-r from-orange-400 to-amber-500 text-white p-5 text-center shadow-md">
        <h1 class="text-xl font-bold tracking-wider">🌟 臨場感英会話 AI Maker</h1>
        <p class="text-xs opacity-90 mt-1">スマホでサクサク！秒速プロンプト作成</p>
    </header>

    <!-- メインコンテナ -->
    <main class="max-w-md mx-auto p-4">

        <!-- トップ：2大ボタン -->
        <div id="top-view" class="space-y-6 mt-6">
            <div class="grid grid-cols-2 gap-4">
                <button onclick="switchView('register-view')" class="tap-active bg-white border-2 border-orange-400 text-orange-500 font-bold py-6 px-4 rounded-2xl shadow-sm flex flex-col items-center justify-center hover:bg-orange-50 transition">
                    <span class="text-3xl mb-1">📝</span>
                    <span class="text-sm">マスタ登録</span>
                </button>
                <button onclick="openCallView()" class="tap-active bg-gradient-to-br from-orange-500 to-amber-500 text-white font-bold py-6 px-4 rounded-2xl shadow-md flex flex-col items-center justify-center hover:opacity-95 transition">
                    <span class="text-3xl mb-1">🚀</span>
                    <span class="text-sm">マスタ呼び出し</span>
                </button>
            </div>

            <!-- 現在の登録状況サマリ -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-orange-100 text-xs space-y-1">
                <div class="font-bold text-orange-600 mb-2">📌 現在のストック状況</div>
                <div id="summary-text" class="text-gray-500">読み込み中...</div>
            </div>
        </div>

        <!-- 登録ビュー -->
        <div id="register-view" class="hidden space-y-5 mt-4">
            <div class="flex items-center justify-between">
                <h2 class="font-bold text-lg text-orange-600">✍️ マスタ登録</h2>
                <button onclick="switchView('top-view')" class="text-xs bg-gray-200 px-3 py-1.5 rounded-full font-bold">戻る</button>
            </div>

            <!-- 1. 自分のこと -->
            <div class="bg-white p-4 rounded-2xl shadow-sm space-y-2">
                <label class="font-bold text-xs text-gray-700">1. 自分のこと（短い文章で追加）</label>
                <div class="flex gap-2">
                    <input id="input-me" type="text" placeholder="例: 趣味はゴルフ（リバーサイドフェニックス）" class="flex-1 border rounded-xl px-3 py-2 text-sm bg-gray-50 focus:outline-none focus:border-orange-400">
                    <button onclick="addMe()" class="bg-orange-500 text-white px-4 py-2 rounded-xl text-xs font-bold tap-active">追加</button>
                </div>
                <div id="list-me" class="flex flex-wrap gap-1.5 pt-1"></div>
            </div>

            <!-- 2. シチュエーション -->
            <div class="bg-white p-4 rounded-2xl shadow-sm space-y-2">
                <label class="font-bold text-xs text-gray-700">2. シチュエーション登録</label>
                <input id="sit-title" type="text" placeholder="タイトル (例: カフェで注文)" class="w-full border rounded-xl px-3 py-2 text-sm bg-gray-50">
                <input id="sit-ai-role" type="text" placeholder="AIの役割 (例: フレンドリーなカフェ店員Alex)" class="w-full border rounded-xl px-3 py-2 text-sm bg-gray-50">
                <input id="sit-my-goal" type="text" placeholder="私の目的 (例: オーツミルクへの変更を伝える)" class="w-full border rounded-xl px-3 py-2 text-sm bg-gray-50">
                <button onclick="addSituation()" class="w-full bg-orange-500 text-white py-2.5 rounded-xl text-xs font-bold tap-active">シチュエーション登録</button>
                <div id="list-sit" class="space-y-1.5 pt-1"></div>
            </div>

            <!-- 3. レベル登録 -->
            <div class="bg-white p-4 rounded-2xl shadow-sm space-y-2">
                <label class="font-bold text-xs text-gray-700">3. レベル登録</label>
                <input id="level-title" type="text" placeholder="タイトル (例: 中学英語＋簡単質問)" class="w-full border rounded-xl px-3 py-2 text-sm bg-gray-50">
                <input id="level-content" type="text" placeholder="内容 (例: ①中学校英語レベルでAIが簡単な質問をする)" class="w-full border rounded-xl px-3 py-2 text-sm bg-gray-50">
                <button onclick="addLevel()" class="w-full bg-orange-500 text-white py-2.5 rounded-xl text-xs font-bold tap-active">レベル登録</button>
                <div id="list-level" class="space-y-1.5 pt-1"></div>
            </div>

            <!-- 4. 特記事項 -->
            <div class="bg-white p-4 rounded-2xl shadow-sm space-y-2">
                <label class="font-bold text-xs text-gray-700">4. 特記事項（短い文章で追加）</label>
                <div class="flex gap-2">
                    <input id="input-note" type="text" placeholder="追加ルールがあれば" class="flex-1 border rounded-xl px-3 py-2 text-sm bg-gray-50">
                    <button onclick="addNote()" class="bg-orange-500 text-white px-4 py-2 rounded-xl text-xs font-bold tap-active">追加</button>
                </div>
                <div id="list-note" class="flex flex-wrap gap-1.5 pt-1"></div>
            </div>
        </div>

        <!-- 呼び出し＆生成ビュー -->
        <div id="call-view" class="hidden space-y-5 mt-4">
            <div class="flex items-center justify-between">
                <h2 class="font-bold text-lg text-orange-600">🎯 マスタ呼び出し＆生成</h2>
                <button onclick="switchView('top-view')" class="text-xs bg-gray-200 px-3 py-1.5 rounded-full font-bold">戻る</button>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm space-y-3">
                <div>
                    <label class="text-xs font-bold text-gray-600">シチュエーションを選ぶ</label>
                    <select id="call-sit" class="w-full border rounded-xl px-3 py-2 text-sm bg-gray-50 mt-1"></select>
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-600">レベルを選ぶ</label>
                    <select id="call-level" class="w-full border rounded-xl px-3 py-2 text-sm bg-gray-50 mt-1"></select>
                </div>
                <button onclick="generatePrompt()" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold py-3 rounded-xl shadow tap-active text-sm">
                    ✨ ChatGPT用スクリプト（プロンプト）生成
                </button>
            </div>

            <!-- 生成結果出力エリア -->
            <div id="output-area" class="hidden bg-white p-4 rounded-2xl shadow-sm space-y-3 border-2 border-orange-300">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-orange-600">コピペ用プロンプト</span>
                    <button onclick="copyPrompt()" class="bg-orange-100 text-orange-700 px-3 py-1 rounded-lg text-xs font-bold">コピー</button>
                </div>
                <textarea id="prompt-result" rows="9" readonly class="w-full bg-orange-50/50 border rounded-xl p-3 text-xs text-gray-700 font-mono"></textarea>
            </div>
        </div>

    </main>

    <script>
        // デフォルト初期値
        const DEFAULT_NOTES = [
            "AIからどんどん話しかける",
            "途中で遮らないで待って",
            "最後に日本語でフィードバックください"
        ];
        const DEFAULT_ME = ["ゴルフが好き", "日常会話をスムーズにしたい"];
        const DEFAULT_LEVELS = [
            { title: '中学英語＋簡単質問', content: '①中学校英語レベルでAIが簡単な質問をする' },
            { title: '中学英語＋簡単質問＋世間話', content: '②中学校英語レベルでAIが簡単な質問をし、最後に世間話が入る' }
        ];

        let db = JSON.parse(localStorage.getItem('tapulse_db_v4')) || {
            me: DEFAULT_ME,
            situations: [{
                title: 'カフェで注文', 
                aiRole: 'フレンドリーなカフェ店員Alex', 
                myGoal: 'オーツミルク変更をクリアに伝える'
            }],
            levels: [...DEFAULT_LEVELS],
            notes: [...DEFAULT_NOTES]
        };

        function saveDB() {
            localStorage.setItem('tapulse_db_v4', JSON.stringify(db));
            renderSummary();
            renderLists();
        }

        function switchView(viewId) {
            ['top-view', 'register-view', 'call-view'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
            if (viewId === 'call-view') populateCallSelects();
        }

        function renderSummary() {
            const sumEl = document.getElementById('summary-text');
            sumEl.innerHTML = `
                自分設定: ${db.me.length}件 | シチュエーション: ${db.situations.length}個 | レベル: ${db.levels.length}個 | 特記: ${db.notes.length}件
            `;
        }

        function renderLists() {
            // meリスト
            document.getElementById('list-me').innerHTML = db.me.map((item, idx) => 
                `<span class="bg-orange-100 text-orange-800 text-[11px] px-2.5 py-1 rounded-full flex items-center gap-1">${item} <button onclick="removeItem('me', ${idx})" class="font-bold">×</button></span>`
            ).join('');

            // sitリスト
            document.getElementById('list-sit').innerHTML = db.situations.map((s, idx) => `
                <div class="text-xs bg-gray-50 p-2.5 rounded-xl space-y-1">
                    <div class="flex justify-between items-center font-bold text-gray-800">
                        <span>${s.title}</span>
                        <button onclick="removeItem('situations', ${idx})" class="text-red-500 font-bold px-2">削除</button>
                    </div>
                    <div class="text-[11px] text-gray-600">🤖 役割: ${s.aiRole}</div>
                    <div class="text-[11px] text-gray-600">🎯 目的: ${s.myGoal}</div>
                </div>
            `).join('');

            // levelリスト
            document.getElementById('list-level').innerHTML = db.levels.map((l, idx) => `
                <div class="text-xs bg-gray-50 p-2.5 rounded-xl space-y-1">
                    <div class="flex justify-between items-center font-bold text-gray-800">
                        <span>${l.title}</span>
                        <button onclick="removeItem('levels', ${idx})" class="text-red-500 font-bold px-2">削除</button>
                    </div>
                    <div class="text-[11px] text-gray-600">📄 内容: ${l.content}</div>
                </div>
            `).join('');

            // noteリスト
            document.getElementById('list-note').innerHTML = db.notes.map((item, idx) => 
                `<span class="bg-gray-100 text-gray-700 text-[11px] px-2.5 py-1 rounded-full flex items-center gap-1">${item} <button onclick="removeItem('notes', ${idx})" class="font-bold">×</button></span>`
            ).join('');
        }

        function removeItem(key, idx) {
            db[key].splice(idx, 1);
            saveDB();
        }

        function addMe() {
            const val = document.getElementById('input-me').value.trim();
            if(!val) return;
            db.me.push(val);
            document.getElementById('input-me').value = '';
            saveDB();
        }

        function addSituation() {
            const title = document.getElementById('sit-title').value.trim();
            const aiRole = document.getElementById('sit-ai-role').value.trim();
            const myGoal = document.getElementById('sit-my-goal').value.trim();
            if(!title || !aiRole || !myGoal) return;
            db.situations.push({title, aiRole, myGoal});
            document.getElementById('sit-title').value = '';
            document.getElementById('sit-ai-role').value = '';
            document.getElementById('sit-my-goal').value = '';
            saveDB();
        }

        function addLevel() {
            const title = document.getElementById('level-title').value.trim();
            const content = document.getElementById('level-content').value.trim();
            if(!title || !content) return;
            db.levels.push({title, content});
            document.getElementById('level-title').value = '';
            document.getElementById('level-content').value = '';
            saveDB();
        }

        function addNote() {
            const val = document.getElementById('input-note').value.trim();
            if(!val) return;
            db.notes.push(val);
            document.getElementById('input-note').value = '';
            saveDB();
        }

        function openCallView() {
            switchView('call-view');
        }

        function populateCallSelects() {
            const sSel = document.getElementById('call-sit');
            sSel.innerHTML = db.situations.map((s, i) => `<option value="${i}">${s.title}（役:${s.aiRole} / 目:${s.myGoal}）</option>`).join('');

            const lSel = document.getElementById('call-level');
            lSel.innerHTML = db.levels.map((l, i) => `<option value="${i}">${l.title}</option>`).join('');
        }

        function generatePrompt() {
            const sIdx = document.getElementById('call-sit').value;
            const lIdx = document.getElementById('call-level').value;

            const sit = db.situations[sIdx] || {
                title: '会話', 
                aiRole: '対話相手', 
                myGoal: 'スムーズにやり取りする'
            };
            const levelObj = db.levels[lIdx] || {
                title: '標準レベル',
                content: '中学校英語レベルで会話する'
            };

            const promptText = `【ロールプレイ設定】
・シチュエーション: ${sit.title}
・あなた（AI）の役割: ${sit.aiRole}
・私（ユーザー）の目的: ${sit.myGoal}
・英語レベル・方針: ${levelObj.content}

【私（ユーザー）について】
${db.me.map(m => '- ' + m).join('\n')}

【特別ルール】
${db.notes.map(n => '- ' + n).join('\n')}

さあ、上記の役割になりきって、シチュエーションの最初のセリフ（英語）からロールプレイを開始してください！`;

            document.getElementById('output-area').classList.remove('hidden');
            document.getElementById('prompt-result').value = promptText;
        }

        function copyPrompt() {
            const textarea = document.getElementById('prompt-result');
            textarea.select();
            document.execCommand('copy');
            alert('プロンプトをコピーしました！ChatGPTに貼り付けてください。');
        }

        // 初期描画
        saveDB();
    </script>
</body>
</html>
