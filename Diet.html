<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シンプル体重・カロリートラッカー</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font & Lucide Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* スクロールバーをすっきりさせる */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        /* ドラムロール用スクロールバー非表示 ＆ 縦方向のみに固定 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
            touch-action: pan-y;
            overscroll-behavior-y: contain;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col antialiased overflow-hidden">

    <!-- ヘッダー -->
    <header class="bg-white border-b border-slate-200 shrink-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-2.5 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="bg-emerald-500 text-white p-1.5 rounded-xl shadow-sm">
                    <i data-lucide="flame" class="w-5 h-5"></i>
                </div>
                <h1 class="text-lg font-bold tracking-tight text-slate-900">体重・カロリー管理</h1>
            </div>
            <div class="flex items-center space-x-2">
                <span id="current-date" class="text-xs font-medium bg-slate-100 text-slate-600 px-3 py-1 rounded-full hidden sm:inline-block"></span>
                <button onclick="openGoalModal()" class="p-1.5 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-lg transition" title="目標設定">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-3xl w-full mx-auto p-3 sm:p-4 flex-1 flex flex-col gap-3 overflow-y-auto justify-start">
        
        <!-- 上部サマリー（体重 ＆ カロリー） -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 shrink-0">
            <!-- 体重サマリー -->
            <div class="bg-gradient-to-br from-blue-600 to-indigo-700 text-white rounded-2xl p-4 shadow-sm">
                <div class="flex justify-between items-start mb-1">
                    <p class="text-blue-100 text-[10px] font-medium uppercase tracking-wider">現在の体重</p>
                    <div class="flex items-center gap-1.5">
                        <button onclick="openWeightHistoryModal()" class="px-2 py-0.5 bg-white/25 hover:bg-white/35 backdrop-blur-md rounded-full text-[10px] text-white transition flex items-center gap-1 shadow-sm">
                            <i data-lucide="history" class="w-3 h-3"></i> 履歴
                        </button>
                        <span id="weight-diff-badge" class="px-2 py-0.5 bg-white/20 backdrop-blur-md rounded-full text-[10px]">--</span>
                    </div>
                </div>
                <h2 id="latest-weight-display" class="text-2xl font-bold tracking-tight">-- <span class="text-sm font-normal">kg</span></h2>
                <div class="mt-2 text-[11px] text-blue-100 flex justify-between items-center pt-2 border-t border-white/10">
                    <span>目標: <strong id="goal-weight-display" class="text-white">--kg</strong></span>
                    <button onclick="openWeightModal()" class="underline hover:text-white">入力</button>
                </div>
            </div>

            <!-- カロリー収支サマリー -->
            <div class="bg-gradient-to-br from-emerald-500 to-teal-600 text-white rounded-2xl p-4 shadow-sm">
                <div class="flex justify-between items-center mb-1">
                    <p class="text-emerald-100 text-[10px] font-medium uppercase tracking-wider">カロリー収支</p>
                    <div class="flex items-center gap-1.5">
                        <button onclick="openHistoryModal()" class="px-2 py-0.5 bg-white/20 hover:bg-white/30 backdrop-blur-md rounded-full text-[10px] text-white transition flex items-center gap-1">
                            <i data-lucide="history" class="w-3 h-3"></i> 今日の履歴
                        </button>
                        <span id="balance-status" class="px-2 py-0.5 bg-white/20 backdrop-blur-md rounded-full text-[10px]">順調</span>
                    </div>
                </div>
                <h2 id="balance-amount" class="text-2xl font-bold tracking-tight">0 <span class="text-sm font-normal">kcal</span></h2>
                <div class="mt-2 text-[11px] text-emerald-100 flex justify-between items-center pt-2 border-t border-white/10">
                    <span>残り: <strong id="remaining-calorie" class="text-white">2000</strong>kcal</span>
                    <button onclick="openCalorieModal()" class="underline hover:text-white">入力</button>
                </div>
            </div>
        </div>

        <!-- アクションボタン -->
        <div class="shrink-0">
            <button onclick="openSuccessModal()" class="w-full bg-amber-500 hover:bg-amber-600 text-white py-2.5 px-3 rounded-xl text-xs font-semibold shadow-sm transition flex items-center justify-center gap-1.5">
                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> 工夫💡を記録する
            </button>
        </div>

        <!-- 回避策の表示エリア（ボタンの下に大きく表示） -->
        <div id="strategy-container" class="space-y-2">
            <!-- ここにJavaScriptで動的にカードが追加されます -->
        </div>

    </main>

    <!-- 体重の履歴モーダル -->
    <div id="weight-history-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 space-y-4 max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center shrink-0">
                <div class="flex items-center gap-2">
                    <div class="bg-blue-100 text-blue-600 p-2 rounded-xl">
                        <i data-lucide="scale" class="w-5 h-5"></i>
                    </div>
                    <h3 class="text-base font-bold text-slate-900">体重の記録履歴</h3>
                </div>
                <button onclick="closeWeightHistoryModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div id="weight-history-list-container" class="overflow-y-auto space-y-2 flex-1 pr-1">
                <!-- 動的に体重履歴リストが追加されます -->
            </div>

            <div class="pt-2 border-t border-slate-100 shrink-0">
                <button type="button" onclick="closeWeightHistoryModal()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold py-2.5 rounded-xl transition text-xs">
                    閉じる
                </button>
            </div>
        </div>
    </div>

    <!-- 今日の履歴モーダル -->
    <div id="history-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 space-y-4 max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center shrink-0">
                <div class="flex items-center gap-2">
                    <div class="bg-emerald-100 text-emerald-600 p-2 rounded-xl">
                        <i data-lucide="history" class="w-5 h-5"></i>
                    </div>
                    <h3 class="text-base font-bold text-slate-900">今日のカロリー履歴</h3>
                </div>
                <button onclick="closeHistoryModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div id="history-list-container" class="overflow-y-auto space-y-2 flex-1 pr-1">
                <!-- 動的に履歴リストが追加されます -->
            </div>

            <div class="pt-2 border-t border-slate-100 shrink-0">
                <button type="button" onclick="closeHistoryModal()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold py-2.5 rounded-xl transition text-xs">
                    閉じる
                </button>
            </div>
        </div>
    </div>

    <!-- カロリー追加・編集モーダル -->
    <div id="calorie-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 space-y-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div class="bg-emerald-100 text-emerald-600 p-2 rounded-xl">
                        <i data-lucide="utensils" class="w-5 h-5"></i>
                    </div>
                    <h3 id="form-title" class="text-base font-bold text-slate-900">カロリー記録を追加</h3>
                </div>
                <button onclick="closeCalorieModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <form id="calorie-form" onsubmit="handleFormSubmit(event)" class="space-y-3 text-xs">
                <input type="hidden" id="edit-id" value="">
                <div>
                    <label class="block font-semibold text-slate-600 mb-1 uppercase text-[10px]">項目名 / 食品名</label>
                    <input type="text" id="item-name" required placeholder="例: 鶏胸肉サラダ、ランニング等" 
                        class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1 uppercase text-[10px]">カロリー (kcal)</label>
                        <input type="number" id="item-calorie" required min="0" placeholder="例: 350" 
                            class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1 uppercase text-[10px]">カテゴリ</label>
                        <select id="item-category" 
                            class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="朝食">朝食 (摂取)</option>
                            <option value="昼食">昼食 (摂取)</option>
                            <option value="夕食">夕食 (摂取)</option>
                            <option value="間食">間食 (摂取)</option>
                            <option value="運動">運動 (消費)</option>
                        </select>
                    </div>
                </div>
                <div class="flex items-center gap-2 pt-2">
                    <button type="submit" id="submit-btn" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-2.5 rounded-xl transition flex items-center justify-center gap-1">
                        <i data-lucide="check" class="w-4 h-4"></i> <span>追加する</span>
                    </button>
                    <button type="button" onclick="closeCalorieModal()" class="bg-slate-100 text-slate-600 font-semibold py-2.5 px-4 rounded-xl transition">
                        キャンセル
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 体重追加・編集モーダル -->
    <div id="weight-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 space-y-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div class="bg-blue-100 text-blue-600 p-2 rounded-xl">
                        <i data-lucide="scale" class="w-5 h-5"></i>
                    </div>
                    <h3 id="weight-form-title" class="text-base font-bold text-slate-900">体重を記録する</h3>
                </div>
                <button onclick="closeWeightModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="weight-form" onsubmit="handleWeightFormSubmit(event)" class="space-y-3 text-xs">
                <input type="hidden" id="weight-edit-id" value="">
                <div>
                    <label class="block font-semibold text-slate-600 mb-1 uppercase text-[10px]">日付</label>
                    <input type="date" id="weight-date" required 
                        class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block font-semibold text-slate-600 uppercase text-[10px]">体重 (kg)</label>
                        <span id="live-weight-preview" class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md">-- kg</span>
                    </div>
                    
                    <div class="bg-slate-900 text-white rounded-2xl p-3 shadow-inner flex items-center justify-center relative overflow-hidden">
                        <div class="absolute inset-x-3 top-1/2 -translate-y-1/2 h-10 bg-white/10 rounded-xl pointer-events-none border border-white/20"></div>
                        <div class="w-full relative text-center">
                            <div id="drum-unified" class="h-32 overflow-y-auto no-scrollbar snap-y snap-mandatory rounded-xl bg-slate-800/80 divide-y divide-slate-700/50 cursor-pointer" onscroll="handleDrumScroll()"></div>
                        </div>
                    </div>
                    <input type="hidden" id="weight-value" required>
                </div>

                <div class="flex items-center gap-2 pt-2">
                    <button type="submit" id="weight-submit-btn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl transition flex items-center justify-center gap-1">
                        <i data-lucide="check" class="w-4 h-4"></i> <span>記録する</span>
                    </button>
                    <button type="button" onclick="closeWeightModal()" class="bg-slate-100 text-slate-600 font-semibold py-2.5 px-4 rounded-xl transition">
                        キャンセル
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 目標設定モーダル -->
    <div id="goal-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-900">目標設定</h3>
                <button onclick="closeGoalModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form onsubmit="handleGoalSubmit(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block font-semibold text-slate-600 mb-1 uppercase text-[10px]">1日の目標摂取カロリー (kcal)</label>
                    <input type="number" id="goal-input" required min="500" max="10000" 
                        class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block font-semibold text-slate-600 mb-1 uppercase text-[10px]">目標体重 (kg)</label>
                    <input type="number" id="goal-weight-input" required step="0.1" min="20" max="300" 
                        class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-2.5 rounded-xl transition shadow-sm">
                    保存する
                </button>
            </form>
        </div>
    </div>

    <!-- 工夫ログモーダル -->
    <div id="success-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto space-y-4">
            <div class="flex justify-between items-center mb-2">
                <div class="flex items-center gap-2 overflow-hidden">
                    <div class="bg-amber-100 text-amber-600 p-2 rounded-xl shrink-0">
                        <i data-lucide="sparkles" class="w-5 h-5"></i>
                    </div>
                    <h3 id="strategy-modal-title" class="text-sm font-bold text-slate-900 whitespace-nowrap">これやったら上手く行く💡</h3>
                </div>
                <button onclick="closeSuccessModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg shrink-0">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <form id="success-form" onsubmit="handleSuccessSubmit(event)" class="space-y-3 text-xs">
                <input type="hidden" id="strategy-edit-id" value="">
                <div>
                    <label class="block font-semibold text-slate-600 mb-1 uppercase text-[10px]">今の気持ち / 状況</label>
                    <textarea id="strategy-feeling" required rows="2" placeholder="例: お腹が空いて甘いものが食べたい" 
                        class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-500 resize-none"></textarea>
                </div>
                <div>
                    <label class="block font-semibold text-slate-600 mb-1 uppercase text-[10px]">回避策 / 対策</label>
                    <textarea id="strategy-workaround" required rows="2" placeholder="例: 炭酸水をガブ飲みする、15分散歩する" 
                        class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-500 resize-none"></textarea>
                </div>
                <div>
                    <label class="block font-semibold text-slate-600 mb-1 uppercase text-[10px]">結果</label>
                    <div class="grid grid-cols-2 gap-2 mt-1">
                        <label class="cursor-pointer">
                            <input type="radio" name="strategy-result" value="できた" checked class="peer sr-only">
                            <div class="p-2.5 text-center rounded-xl border border-slate-200 bg-slate-50 text-slate-700 font-semibold peer-checked:bg-emerald-500 peer-checked:text-white transition">できた✨</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="strategy-result" value="できない" class="peer sr-only">
                            <div class="p-2.5 text-center rounded-xl border border-slate-200 bg-slate-50 text-slate-700 font-semibold peer-checked:bg-rose-500 peer-checked:text-white transition">できなかった💦</div>
                        </label>
                    </div>
                </div>
                <div class="flex items-center gap-2 pt-2">
                    <button type="submit" id="strategy-submit-btn" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-semibold py-2.5 rounded-xl transition">
                        記録する
                    </button>
                    <button type="button" onclick="closeSuccessModal()" class="bg-slate-100 text-slate-600 font-semibold py-2.5 px-4 rounded-xl transition">
                        キャンセル
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let records = JSON.parse(localStorage.getItem('calorie_records')) || [];
        let weightRecords = JSON.parse(localStorage.getItem('weight_records')) || [];
        let strategies = JSON.parse(localStorage.getItem('success_strategies')) || [];
        let dailyGoal = parseInt(localStorage.getItem('calorie_goal')) || 2000;
        let goalWeight = parseFloat(localStorage.getItem('goal_weight')) || 60.0;

        window.addEventListener('DOMContentLoaded', () => {
            updateDateDisplay();
            initDrumPickers();
            document.getElementById('weight-date').value = new Date().toISOString().split('T')[0];
            renderApp();
            renderWeightApp();
            renderStrategies();
            lucide.createIcons();
        });

        function updateDateDisplay() {
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' };
            document.getElementById('current-date').textContent = new Date().toLocaleDateString('ja-JP', options);
        }

        // --- 一体型ドラムピッカー初期化・制御（30.0kg 〜 150.0kg） ---
        function initDrumPickers() {
            const container = document.getElementById('drum-unified');
            let html = '<div class="h-12 pointer-events-none"></div>';
            
            for (let i = 300; i <= 1500; i++) {
                const val = (i / 10).toFixed(1);
                html += `<div class="h-10 flex items-center justify-center snap-center text-sm font-bold text-slate-300 select-none" data-val="${val}">${val} kg</div>`;
            }
            
            html += '<div class="h-12 pointer-events-none"></div>';
            container.innerHTML = html;
        }

        function setDrumValues(weightVal) {
            const container = document.getElementById('drum-unified');
            const targetVal = weightVal.toFixed(1);
            const targetEl = container.querySelector(`[data-val="${targetVal}"]`);
            if (targetEl) {
                container.scrollTop = targetEl.offsetTop - 48;
            }
            updateDrumSelection();
        }

        function handleDrumScroll() {
            updateDrumSelection();
        }

        function updateDrumSelection() {
            const container = document.getElementById('drum-unified');
            const items = container.querySelectorAll('[data-val]');
            let selectedVal = 60.0;

            items.forEach(item => {
                const rect = item.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                if (rect.top >= containerRect.top + 20 && rect.bottom <= containerRect.bottom - 20) {
                    selectedVal = parseFloat(item.getAttribute('data-val'));
                    item.className = "h-10 flex items-center justify-center snap-center text-base font-bold text-emerald-400 scale-110 transition-transform select-none";
                } else {
                    item.className = "h-10 flex items-center justify-center snap-center text-sm font-bold text-slate-400 select-none";
                }
            });

            document.getElementById('weight-value').value = selectedVal;
            document.getElementById('live-weight-preview').textContent = `${selectedVal.toFixed(1)} kg`;
        }
        // ------------------------------------

        // カロリーモーダル制御
        function openCalorieModal() {
            const form = document.getElementById('calorie-form');
            form.reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('form-title').textContent = 'カロリー記録を追加';
            document.getElementById('submit-btn').innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> <span>追加する</span>';
            document.getElementById('calorie-modal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeCalorieModal() {
            document.getElementById('calorie-modal').classList.add('hidden');
        }

        // 今日のカロリー履歴モーダル制御
        function openHistoryModal() {
            renderHistoryList();
            document.getElementById('history-modal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeHistoryModal() {
            document.getElementById('history-modal').classList.add('hidden');
        }

        function renderHistoryList() {
            const container = document.getElementById('history-list-container');
            if (!records || records.length === 0) {
                container.innerHTML = '<p class="text-center text-xs text-slate-400 py-4">本日の記録はまだありません</p>';
                return;
            }

            let html = '';
            records.forEach(item => {
                const isExercise = item.category === '運動';
                const badgeBg = isExercise ? 'bg-sky-50 text-sky-600 border-sky-200' : 'bg-emerald-50 text-emerald-600 border-emerald-200';
                
                html += `
                    <div class="flex items-center justify-between p-3 bg-slate-50 border border-slate-100 rounded-2xl text-xs">
                        <div class="flex items-center gap-2.5">
                            <span class="px-2 py-0.5 rounded-md font-bold border ${badgeBg}">${item.category}</span>
                            <div>
                                <p class="font-bold text-slate-800">${escapeHtml(item.name)}</p>
                                <p class="text-[10px] text-slate-400">${isExercise ? '-' : '+'}${item.calorie.toLocaleString()} kcal</p>
                            </div>
                        </div>
                        <button onclick="deleteCalorieRecord('${item.id}')" class="text-slate-300 hover:text-rose-500 p-1.5 rounded-lg transition" title="削除">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
            });
            container.innerHTML = html;
            lucide.createIcons();
        }

        function deleteCalorieRecord(id) {
            records = records.filter(item => item.id !== id);
            localStorage.setItem('calorie_records', JSON.stringify(records));
            renderApp();
            renderHistoryList();
        }

        // 体重履歴モーダル制御
        function openWeightHistoryModal() {
            renderWeightHistoryList();
            document.getElementById('weight-history-modal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeWeightHistoryModal() {
            document.getElementById('weight-history-modal').classList.add('hidden');
        }

        function renderWeightHistoryList() {
            const container = document.getElementById('weight-history-list-container');
            if (!weightRecords || weightRecords.length === 0) {
                container.innerHTML = '<p class="text-center text-xs text-slate-400 py-4">体重の記録はまだありません</p>';
                return;
            }

            let html = '';
            weightRecords.forEach(item => {
                html += `
                    <div class="flex items-center justify-between p-3 bg-slate-50 border border-slate-100 rounded-2xl text-xs">
                        <div class="flex items-center gap-3">
                            <div class="bg-blue-50 text-blue-600 px-2.5 py-1 rounded-lg font-medium text-[11px]">
                                ${escapeHtml(item.date)}
                            </div>
                            <div>
                                <p class="font-bold text-slate-800 text-sm">${item.weight.toFixed(1)} <span class="text-xs font-normal text-slate-500">kg</span></p>
                            </div>
                        </div>
                        <button onclick="deleteWeightRecord('${item.id}')" class="text-slate-300 hover:text-rose-500 p-1.5 rounded-lg transition" title="削除">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
            });
            container.innerHTML = html;
            lucide.createIcons();
        }

        function deleteWeightRecord(id) {
            weightRecords = weightRecords.filter(item => item.id !== id);
            localStorage.setItem('weight_records', JSON.stringify(weightRecords));
            renderWeightApp();
            renderWeightHistoryList();
        }

        // 体重入力モーダル制御
        function openWeightModal() {
            const form = document.getElementById('weight-form');
            form.reset();
            document.getElementById('weight-edit-id').value = '';
            document.getElementById('weight-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('weight-form-title').textContent = '体重を記録する';
            document.getElementById('weight-submit-btn').innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> <span>記録する</span>';

            let initialVal = 65.0;
            if (weightRecords.length > 0) {
                initialVal = weightRecords[0].weight;
            }

            document.getElementById('weight-modal').classList.remove('hidden');
            setTimeout(() => { setDrumValues(initialVal); }, 50);
            lucide.createIcons();
        }

        function closeWeightModal() {
            document.getElementById('weight-modal').classList.add('hidden');
        }

        function openGoalModal() {
            document.getElementById('goal-input').value = dailyGoal;
            document.getElementById('goal-weight-input').value = goalWeight;
            document.getElementById('goal-modal').classList.remove('hidden');
        }

        function closeGoalModal() {
            document.getElementById('goal-modal').classList.add('hidden');
        }

        function handleGoalSubmit(e) {
            e.preventDefault();
            const val = parseInt(document.getElementById('goal-input').value);
            const gWeight = parseFloat(document.getElementById('goal-weight-input').value);
            if (val > 0) { dailyGoal = val; localStorage.setItem('calorie_goal', dailyGoal); }
            if (!isNaN(gWeight)) { goalWeight = gWeight; localStorage.setItem('goal_weight', goalWeight); }
            closeGoalModal();
            renderApp();
            renderWeightApp();
        }

        function openSuccessModal() {
            const form = document.getElementById('success-form');
            form.reset();
            document.getElementById('strategy-edit-id').value = '';
            document.getElementById('strategy-modal-title').textContent = 'これやったら上手く行く💡';
            document.getElementById('strategy-submit-btn').textContent = '記録する';
            document.getElementById('success-modal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeSuccessModal() {
            document.getElementById('success-modal').classList.add('hidden');
        }

        function handleSuccessSubmit(e) {
            e.preventDefault();
            const feeling = document.getElementById('strategy-feeling').value.trim();
            const workaround = document.getElementById('strategy-workaround').value.trim();
            const result = document.querySelector('input[name="strategy-result"]:checked').value;
            if (!feeling || !workaround) return;

            strategies.unshift({ id: Date.now().toString(), feeling, workaround, result, timestamp: new Date().toISOString() });
            localStorage.setItem('success_strategies', JSON.stringify(strategies));
            closeSuccessModal();
            renderStrategies();
        }

        // 工夫ログの削除処理
        function deleteStrategy(id) {
            strategies = strategies.filter(item => item.id !== id);
            localStorage.setItem('success_strategies', JSON.stringify(strategies));
            renderStrategies();
        }

        function handleWeightFormSubmit(e) {
            e.preventDefault();
            const date = document.getElementById('weight-date').value;
            const weight = parseFloat(document.getElementById('weight-value').value);
            if (!date || isNaN(weight)) return;

            weightRecords.unshift({ id: Date.now().toString(), date, weight, timestamp: new Date().toISOString() });
            weightRecords.sort((a, b) => new Date(b.date) - new Date(a.date));
            localStorage.setItem('weight_records', JSON.stringify(weightRecords));
            closeWeightModal();
            renderWeightApp();
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('item-name').value.trim();
            const calorie = parseInt(document.getElementById('item-calorie').value);
            const category = document.getElementById('item-category').value;
            if (!name || isNaN(calorie)) return;

            records.unshift({ id: Date.now().toString(), name, calorie, category, timestamp: new Date().toISOString() });
            localStorage.setItem('calorie_records', JSON.stringify(records));
            closeCalorieModal();
            renderApp();
        }

        function renderWeightApp() {
            document.getElementById('goal-weight-display').textContent = `${goalWeight}kg`;

            if (weightRecords.length > 0) {
                const latest = weightRecords[0];
                document.getElementById('latest-weight-display').innerHTML = `${latest.weight.toFixed(1)} <span class="text-sm font-normal">kg</span>`;
                if (weightRecords.length > 1) {
                    const diff = latest.weight - weightRecords[1].weight;
                    document.getElementById('weight-diff-badge').textContent = (diff > 0 ? `+${diff.toFixed(1)}` : diff.toFixed(1)) + 'kg';
                } else {
                    document.getElementById('weight-diff-badge').textContent = '初回';
                }
            }
        }

        function renderApp() {
            let intake = 0, burn = 0;
            records.forEach(i => { if (i.category === '運動') burn += i.calorie; else intake += i.calorie; });
            const net = intake - burn;
            const remaining = dailyGoal - net;

            document.getElementById('balance-amount').innerHTML = `${net.toLocaleString()} <span class="text-sm font-normal">kcal</span>`;
            document.getElementById('remaining-calorie').textContent = remaining.toLocaleString();

            const statusEl = document.getElementById('balance-status');
            if (net <= dailyGoal) {
                statusEl.textContent = '順調';
                statusEl.className = 'px-2 py-0.5 bg-white/20 backdrop-blur-md rounded-full text-[10px] text-white';
            } else {
                statusEl.textContent = '超過';
                statusEl.className = 'px-2 py-0.5 bg-rose-500/80 backdrop-blur-md rounded-full text-[10px] text-white';
            }
        }

        // 工夫（回避策）リストの描画
        function renderStrategies() {
            const container = document.getElementById('strategy-container');
            if (!strategies || strategies.length === 0) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            strategies.forEach(item => {
                const isSuccess = item.result === 'できた';
                const badgeClass = isSuccess ? 'bg-emerald-100 text-emerald-700 border-emerald-200' : 'bg-rose-100 text-rose-700 border-rose-200';
                const badgeText = isSuccess ? 'できた✨' : 'できなかった💦';

                html += `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-2 relative group">
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] font-bold text-amber-600 bg-amber-50 px-2.5 py-1 rounded-full flex items-center gap-1">
                                <i data-lucide="sparkles" class="w-3 h-3"></i> 気持ち: ${escapeHtml(item.feeling)}
                            </span>
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full border ${badgeClass}">
                                    ${badgeText}
                                </span>
                                <button onclick="deleteStrategy('${item.id}')" class="text-slate-300 hover:text-rose-500 p-1 rounded-lg transition" title="削除">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                        <div>
                            <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">回避策 / 対策</p>
                            <p class="text-base font-bold text-slate-800 mt-0.5">${escapeHtml(item.workaround)}</p>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            lucide.createIcons();
        }

        function escapeHtml(str) {
            return str.replace(/[&'`<>"]/g, function (match) {
                return {
                    '&': '&amp;',
                    "'": '&#x27;',
                    '`': '&#x60;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                }[match];
            });
        }
    </script>
</body>
</html>
