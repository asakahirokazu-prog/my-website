<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイ リンク集</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --primary-color: #007bff;
      --text-color: #333333;
      --border-color: #e0e0e0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      touch-action: pan-y;
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
    }

    .form-container {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 24px;
    }

    .form-toggle-btn {
      width: 100%;
      background: none;
      border: none;
      color: var(--primary-color);
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0;
    }

    .form-body {
      display: none;
      margin-top: 16px;
      flex-direction: column;
      gap: 10px;
    }

    .form-body.open {
      display: flex;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input {
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 14px;
    }

    button {
      padding: 10px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    .link-list {
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    .link-item {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      user-select: none;
      transition: background-color 0.1s ease;
    }

    .link-item.dragging {
      opacity: 0.4;
      background: #e9ecef;
    }

    .link-item.drag-over {
      border-top: 2px solid var(--primary-color);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-grow: 1;
      overflow: hidden;
      margin-right: 12px;
    }

    .drag-handle {
      color: #aaa;
      font-size: 20px;
      cursor: grab;
      padding: 4px;
      flex-shrink: 0;
      touch-action: none;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .link-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
      flex-grow: 1;
    }

    .link-title {
      font-weight: bold;
      color: #007bff;
      text-decoration: none;
      font-size: 16px;
    }

    .link-title:hover {
      text-decoration: underline;
    }

    .link-url {
      font-size: 12px;
      color: #777;
      word-break: break-all;
      overflow-wrap: break-word;
    }

    .action-buttons {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .edit-btn {
      background-color: #ffc107;
      color: #333;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }

    .delete-btn {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .edit-btn {
      background-color: #ffc107;
      color: #333;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
      box-sizing: border-box;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      width: 100%;
      max-width: 450px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-sizing: border-box;
    }

    .modal-header {
      font-weight: bold;
      font-size: 18px;
    }

    .modal-buttons {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .cancel-btn {
      background-color: #6c757d;
    }
  </style>
</head>
<body>

  <h1>マイ リンク集</h1>

  <div class="form-container">
    <button type="button" class="form-toggle-btn" id="form-toggle-btn" style="width: 100%; background: none; border: none; color: var(--primary-color); font-weight: bold; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 0;">
      <span>＋ リンクを追加する</span>
      <span id="toggle-icon">▼</span>
    </button>
    <form id="link-form" class="input-group" style="display: none; margin-top: 16px;">
      <input type="text" id="title-input" placeholder="タイトル (例: Google)" required>
      <input type="url" id="url-input" placeholder="URL" value="https://asakahirokazu-prog.github.io/my-website/" required>
      <button type="submit">リンクを追加</button>
    </form>
  </div>

  <ul id="link-list" class="link-list"></ul>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal-content">
      <div class="modal-header">リンクを編集</div>
      <form id="edit-form" class="input-group">
        <input type="hidden" id="edit-index">
        <input type="text" id="edit-title-input" placeholder="タイトル" required>
        <input type="url" id="edit-url-input" placeholder="URL" required>
        <div class="modal-buttons">
          <button type="button" class="cancel-btn" onclick="closeEditModal()">キャンセル</button>
          <button type="submit">更新する</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const formToggleBtn = document.getElementById('form-toggle-btn');
    const toggleIcon = document.getElementById('toggle-icon');
    const linkForm = document.getElementById('link-form');
    const titleInput = document.getElementById('title-input');
    const urlInput = document.getElementById('url-input');
    const linkList = document.getElementById('link-list');

    const editModal = document.getElementById('edit-modal');
    const editForm = document.getElementById('edit-form');
    const editIndexInput = document.getElementById('edit-index');
    const editTitleInput = document.getElementById('edit-title-input');
    const editUrlInput = document.getElementById('edit-url-input');

    let links = JSON.parse(localStorage.getItem('my_links')) || [];
    let draggedIndex = null;

    // 折りたたみトグル
    formToggleBtn.addEventListener('click', () => {
      const isOpen = linkForm.style.display === 'flex';
      linkForm.style.display = isOpen ? 'none' : 'flex';
      toggleIcon.textContent = isOpen ? '▼' : '▲';
      formToggleBtn.querySelector('span:first-child').textContent = isOpen ? '＋ リンクを追加する' : '－ リンク追加を閉じる';
    });

    function renderLinks() {
      linkList.innerHTML = '';
      links.forEach((link, index) => {
        const li = document.createElement('li');
        li.className = 'link-item';
        li.dataset.index = index;

        li.innerHTML = `
          <div class="link-left">
            <span class="drag-handle">⠿</span>
            <div class="link-info">
              <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="link-title">${escapeHtml(link.title)}</a>
              <span class="link-url">${escapeHtml(link.url)}</span>
            </div>
          </div>
          <div style="display: flex; gap: 6px; flex-shrink: 0;">
            <button class="edit-btn" onclick="openEditModal(${index})">編集</button>
            <button class="delete-btn" onclick="deleteLink(event, ${index})">削除</button>
          </div>
        `;

        const handle = li.querySelector('.drag-handle');

        handle.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          draggedIndex = index;
          li.classList.add('dragging');
          handle.setPointerCapture(e.pointerId);
        });

        handle.addEventListener('pointermove', (e) => {
          if (draggedIndex === null) return;
          e.preventDefault();

          const targetElement = document.elementFromPoint(e.clientX, e.clientY);
          const targetLi = targetElement ? targetElement.closest('.link-item') : null;

          document.querySelectorAll('.link-item').forEach(item => item.classList.remove('drag-over'));
          if (targetLi && targetLi !== li) {
            targetLi.classList.add('drag-over');
          }
        });

        handle.addEventListener('pointerup', (e) => {
          if (draggedIndex === null) return;

          li.classList.remove('dragging');
          const targetElement = document.elementFromPoint(e.clientX, e.clientY);
          const targetLi = targetElement ? targetElement.closest('.link-item') : null;

          document.querySelectorAll('.link-item').forEach(item => item.classList.remove('drag-over'));

          if (targetLi) {
            const targetIndex = parseInt(targetLi.dataset.index);
            if (draggedIndex !== targetIndex) {
              const movedItem = links.splice(draggedIndex, 1)[0];
              links.splice(targetIndex, 0, movedItem);
              saveAndRender();
            }
          }
          draggedIndex = null;
          handle.releasePointerCapture(e.pointerId);
        });

        linkList.appendChild(li);
      });
    }

    linkForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const newLink = {
        title: titleInput.value.trim(),
        url: urlInput.value.trim()
      };
      // 配列の先頭に追加 (unshift)
      links.unshift(newLink);
      saveAndRender();
      titleInput.value = '';
      urlInput.value = 'https://asakahirokazu-prog.github.io/my-website/';
      
      // 登録後にフォームをたたむ
      linkForm.style.display = 'none';
      toggleIcon.textContent = '▼';
      formToggleBtn.querySelector('span:first-child').textContent = '＋ リンクを追加する';
    });

    function openEditModal(index) {
      const link = links[index];
      editIndexInput.value = index;
      editTitleInput.value = link.title;
      editUrlInput.value = link.url;
      editModal.classList.add('open');
    }

    function closeEditModal() {
      editModal.classList.remove('open');
    }

    editForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const index = parseInt(editIndexInput.value);
      links[index] = {
        title: editTitleInput.value.trim(),
        url: editUrlInput.value.trim()
      };
      saveAndRender();
      closeEditModal();
    });

    function deleteLink(e, index) {
      e.stopPropagation();
      links.splice(index, 1);
      saveAndRender();
    }

    function saveAndRender() {
      localStorage.setItem('my_links', JSON.stringify(links));
      renderLinks();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (match) => {
        const escapeMap = {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        };
        return escapeMap[match];
      });
    }

    renderLinks();
  </script>
</body>
</html>
