<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイ リンク集</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --primary-color: #007bff;
      --text-color: #333333;
      --border-color: #e0e0e0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      touch-action: pan-y;
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
    }

    /* Tab styles */
    .tabs-container {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 8px;
      overflow-x: auto;
    }

    .tab-btn {
      padding: 8px 16px;
      background: none;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      color: #666;
      background-color: #e9ecef;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .tab-btn.active {
      background-color: var(--primary-color);
      color: white;
    }

    .form-container {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 24px;
    }

    .form-toggle-btn {
      width: 100%;
      background: none;
      border: none;
      color: var(--primary-color);
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0;
    }

    .form-body {
      display: none;
      margin-top: 16px;
      flex-direction: column;
      gap: 10px;
    }

    .form-body.open {
      display: flex;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input, select {
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 14px;
      background-color: #fff;
    }

    button {
      padding: 10px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    .link-list {
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    .link-item {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      user-select: none;
      transition: background-color 0.1s ease;
    }

    .link-item.dragging {
      opacity: 0.4;
      background: #e9ecef;
    }

    .link-item.drag-over {
      border-top: 2px solid var(--primary-color);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-grow: 1;
      overflow: hidden;
      margin-right: 12px;
    }

    .drag-handle {
      color: #aaa;
      font-size: 20px;
      cursor: grab;
      padding: 4px;
      flex-shrink: 0;
      touch-action: none;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .link-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
      flex-grow: 1;
    }

    .link-title {
      font-weight: bold;
      color: #007bff;
      text-decoration: none;
      font-size: 16px;
    }

    .link-title:hover {
      text-decoration: underline;
    }

    .link-url {
      font-size: 12px;
      color: #777;
      word-break: break-all;
      overflow-wrap: break-word;
    }

    .action-buttons {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .edit-btn {
      background-color: #ffc107;
      color: #333;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }

    .delete-btn {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
      box-sizing: border-box;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      width: 100%;
      max-width: 450px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-sizing: border-box;
    }

    .modal-header {
      font-weight: bold;
      font-size: 18px;
    }

    .modal-buttons {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .cancel-btn {
      background-color: #6c757d;
    }

    .empty-message {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>マイ リンク集</h1>

  <!-- タブの切り替え部分 -->
  <div class="tabs-container" id="tabs-container">
    <button class="tab-btn active" data-category="いつも">いつも</button>
    <button class="tab-btn" data-category="週末">週末</button>
    <button class="tab-btn" data-category="たまに">たまに</button>
  </div>

  <div class="form-container">
    <button type="button" class="form-toggle-btn" id="form-toggle-btn">
      <span>＋ リンクを追加する</span>
      <span id="toggle-icon">▼</span>
    </button>
    <form id="link-form" class="input-group" style="display: none; margin-top: 16px;">
      <input type="text" id="title-input" placeholder="タイトル (例: Google)" required>
      <input type="url" id="url-input" placeholder="URL" value="https://asakahirokazu-prog.github.io/my-website/" required>
      <select id="category-input">
        <option value="いつも">いつも</option>
        <option value="週末">週末</option>
        <option value="たまに">たまに</option>
      </select>
      <button type="submit">リンクを追加</button>
    </form>
  </div>

  <ul id="link-list" class="link-list"></ul>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal-content">
      <div class="modal-header">リンクを編集</div>
      <form id="edit-form" class="input-group">
        <input type="hidden" id="edit-index">
        <input type="text" id="edit-title-input" placeholder="タイトル" required>
        <input type="url" id="edit-url-input" placeholder="URL" required>
        <select id="edit-category-input">
          <option value="いつも">いつも</option>
          <option value="週末">週末</option>
          <option value="たまに">たまに</option>
        </select>
        <div class="modal-buttons">
          <button type="button" class="cancel-btn" onclick="closeEditModal()">キャンセル</button>
          <button type="submit">更新する</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const formToggleBtn = document.getElementById('form-toggle-btn');
    const toggleIcon = document.getElementById('toggle-icon');
    const linkForm = document.getElementById('link-form');
    const titleInput = document.getElementById('title-input');
    const urlInput = document.getElementById('url-input');
    const categoryInput = document.getElementById('category-input');
    const linkList = document.getElementById('link-list');
    const tabsContainer = document.getElementById('tabs-container');

    const editModal = document.getElementById('edit-modal');
    const editForm = document.getElementById('edit-form');
    const editIndexInput = document.getElementById('edit-index');
    const editTitleInput = document.getElementById('edit-title-input');
    const editUrlInput = document.getElementById('edit-url-input');
    const editCategoryInput = document.getElementById('edit-category-input');

    let links = JSON.parse(localStorage.getItem('my_links')) || [];
    let currentCategory = 'いつも';
    let draggedIndex = null;

    // タブ切り替えイベント
    tabsContainer.addEventListener('click', (e) => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = btn.dataset.category;
      
      // 追加フォームのカテゴリも現在のタブに合わせる
      categoryInput.value = currentCategory;
      renderLinks();
    });

    // 折りたたみトグル
    formToggleBtn.addEventListener('click', () => {
      const isOpen = linkForm.style.display === 'flex';
      linkForm.style.display = isOpen ? 'none' : 'flex';
      toggleIcon.textContent = isOpen ? '▼' : '▲';
      formToggleBtn.querySelector('span:first-child').textContent = isOpen ? '＋ リンクを追加する' : '－ リンク追加を閉じる';
    });

    // リンク一覧の描画（現在のカテゴリでフィルタリング）
    function renderLinks() {
      linkList.innerHTML = '';
      
      // カテゴリに一致するリンクを抽出（元のインデックスも保持）
      const filteredLinks = [];
      links.forEach((link, originalIndex) => {
        // デフォルトでカテゴリがない古いデータは「いつも」に振り分ける
        const linkCat = link.category || 'いつも';
        if (linkCat === currentCategory) {
          filteredLinks.push({ ...link, originalIndex });
        }
      });

      if (filteredLinks.length === 0) {
        linkList.innerHTML = `<div class="empty-message">「${currentCategory}」のリンクはありません。</div>`;
        return;
      }

      filteredLinks.forEach((link, displayIndex) => {
        const li = document.createElement('li');
        li.className = 'link-item';
        li.dataset.originalIndex = link.originalIndex;

        li.innerHTML = `
          <div class="link-left">
            <span class="drag-handle">⠿</span>
            <div class="link-info">
              <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="link-title">${escapeHtml(link.title)}</a>
              <span class="link-url">${escapeHtml(link.url)}</span>
            </div>
          </div>
          <div class="action-buttons">
            <button class="edit-btn" onclick="openEditModal(${link.originalIndex})">編集</button>
            <button class="delete-btn" onclick="deleteLink(event, ${link.originalIndex})">削除</button>
          </div>
        `;

        const handle = li.querySelector('.drag-handle');

        handle.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          draggedIndex = link.originalIndex;
          li.classList.add('dragging');
          handle.setPointerCapture(e.pointerId);
        });

        handle.addEventListener('pointermove', (e) => {
          if (draggedIndex === null) return;
          e.preventDefault();

          const targetElement = document.elementFromPoint(e.clientX, e.clientY);
          const targetLi = targetElement ? targetElement.closest('.link-item') : null;

          document.querySelectorAll('.link-item').forEach(item => item.classList.remove('drag-over'));
          if (targetLi && targetLi !== li) {
            targetLi.classList.add('drag-over');
          }
        });

        handle.addEventListener('pointerup', (e) => {
          if (draggedIndex === null) return;

          li.classList.remove('dragging');
          const targetElement = document.elementFromPoint(e.clientX, e.clientY);
          const targetLi = targetElement ? targetElement.closest('.link-item') : null;

          document.querySelectorAll('.link-item').forEach(item => item.classList.remove('drag-over'));

          if (targetLi) {
            const targetOriginalIndex = parseInt(targetLi.dataset.originalIndex);
            if (draggedIndex !== targetOriginalIndex) {
              const movedItem = links.splice(draggedIndex, 1)[0];
              links.splice(targetOriginalIndex, 0, movedItem);
              saveAndRender();
            }
          }
          draggedIndex = null;
          handle.releasePointerCapture(e.pointerId);
        });

        linkList.appendChild(li);
      });
    }

    linkForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const newLink = {
        title: titleInput.value.trim(),
        url: urlInput.value.trim(),
        category: categoryInput.value
      };
      // 配列の先頭に追加
      links.unshift(newLink);
      saveAndRender();
      
      titleInput.value = '';
      urlInput.value = 'https://asakahirokazu-prog.github.io/my-website/';
      
      // 登録後にフォームをたたむ
      linkForm.style.display = 'none';
      toggleIcon.textContent = '▼';
      formToggleBtn.querySelector('span:first-child').textContent = '＋ リンクを追加する';
    });

    function openEditModal(index) {
      const link = links[index];
      editIndexInput.value = index;
      editTitleInput.value = link.title;
      editUrlInput.value = link.url;
      editCategoryInput.value = link.category || 'いつも';
      editModal.classList.add('open');
    }

    function closeEditModal() {
      editModal.classList.remove('open');
    }

    editForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const index = parseInt(editIndexInput.value);
      links[index] = {
        title: editTitleInput.value.trim(),
        url: editUrlInput.value.trim(),
        category: editCategoryInput.value
      };
      
      // 編集した項目が属するタブへ移動させる
      currentCategory = editCategoryInput.value;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        if (btn.dataset.category === currentCategory) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      categoryInput.value = currentCategory;

      saveAndRender();
      closeEditModal();
    });

    function deleteLink(e, index) {
      e.stopPropagation();
      links.splice(index, 1);
      saveAndRender();
    }

    function saveAndRender() {
      localStorage.setItem('my_links', JSON.stringify(links));
      renderLinks();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (match) => {
        const escapeMap = {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        };
        return escapeMap[match];
      });
    }

    // 初期表示時は現在選択されているタブのカテゴリにフォームを設定
    categoryInput.value = currentCategory;
    renderLinks();
  </script>
</body>
</html>
