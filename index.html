<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイ リンク集</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --primary-color: #007bff;
      --text-color: #333333;
      --border-color: #e0e0e0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      touch-action: pan-y;
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
    }

    .form-container {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 24px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input {
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 14px;
    }

    button {
      padding: 10px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    .link-list {
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    .link-item {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      user-select: none;
      transition: background-color 0.1s ease;
    }

    .link-item.dragging {
      opacity: 0.4;
      background: #e9ecef;
    }

    .link-item.drag-over {
      border-top: 2px solid var(--primary-color);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-grow: 1;
      overflow: hidden;
      margin-right: 12px;
    }

    .drag-handle {
      color: #aaa;
      font-size: 20px;
      cursor: grab;
      padding: 4px;
      flex-shrink: 0;
      touch-action: none;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .link-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
      flex-grow: 1;
    }

    .link-title {
      font-weight: bold;
      color: #007bff;
      text-decoration: none;
      font-size: 16px;
    }

    .link-title:hover {
      text-decoration: underline;
    }

    .link-url {
      font-size: 12px;
      color: #777;
      word-break: break-all;
      overflow-wrap: break-word;
    }

    .delete-btn {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <h1>マイ リンク集</h1>

  <div class="form-container">
    <form id="link-form" class="input-group">
      <input type="text" id="title-input" placeholder="タイトル (例: Google)" required>
      <input type="url" id="url-input" placeholder="URL (例: https://google.com)" required>
      <button type="submit">リンクを追加</button>
    </form>
  </div>

  <ul id="link-list" class="link-list"></ul>

  <script>
    const linkForm = document.getElementById('link-form');
    const titleInput = document.getElementById('title-input');
    const urlInput = document.getElementById('url-input');
    const linkList = document.getElementById('link-list');

    let links = JSON.parse(localStorage.getItem('my_links')) || [];
    let draggedIndex = null;

    function renderLinks() {
      linkList.innerHTML = '';
      links.forEach((link, index) => {
        const li = document.createElement('li');
        li.className = 'link-item';
        li.dataset.index = index;

        li.innerHTML = `
          <div class="link-left">
            <span class="drag-handle">⠿</span>
            <div class="link-info">
              <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="link-title">${escapeHtml(link.title)}</a>
              <span class="link-url">${escapeHtml(link.url)}</span>
            </div>
          </div>
          <button class="delete-btn" onclick="deleteLink(event, ${index})">削除</button>
        `;

        const handle = li.querySelector('.drag-handle');

        handle.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          draggedIndex = index;
          li.classList.add('dragging');
          handle.setPointerCapture(e.pointerId);
        });

        handle.addEventListener('pointermove', (e) => {
          if (draggedIndex === null) return;
          e.preventDefault();

          const targetElement = document.elementFromPoint(e.clientX, e.clientY);
          const targetLi = targetElement ? targetElement.closest('.link-item') : null;

          document.querySelectorAll('.link-item').forEach(item => item.classList.remove('drag-over'));
          if (targetLi && targetLi !== li) {
            targetLi.classList.add('drag-over');
          }
        });

        handle.addEventListener('pointerup', (e) => {
          if (draggedIndex === null) return;

          li.classList.remove('dragging');
          const targetElement = document.elementFromPoint(e.clientX, e.clientY);
          const targetLi = targetElement ? targetElement.closest('.link-item') : null;

          document.querySelectorAll('.link-item').forEach(item => item.classList.remove('drag-over'));

          if (targetLi) {
            const targetIndex = parseInt(targetLi.dataset.index);
            if (draggedIndex !== targetIndex) {
              const movedItem = links.splice(draggedIndex, 1)[0];
              links.splice(targetIndex, 0, movedItem);
              saveAndRender();
            }
          }
          draggedIndex = null;
          handle.releasePointerCapture(e.pointerId);
        });

        linkList.appendChild(li);
      });
    }

    linkForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const newLink = {
        title: titleInput.value.trim(),
        url: urlInput.value.trim()
      };
      // 配列の先頭に追加 (unshift)
      links.unshift(newLink);
      saveAndRender();
      titleInput.value = '';
      urlInput.value = '';
    });

    function deleteLink(e, index) {
      e.stopPropagation();
      links.splice(index, 1);
      saveAndRender();
    }

    function saveAndRender() {
      localStorage.setItem('my_links', JSON.stringify(links));
      renderLinks();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (match) => {
        const escapeMap = {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        };
        return escapeMap[match];
      });
    }

    renderLinks();
  </script>
</body>
</html>
