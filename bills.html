<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ゴルフ相乗りカンタン精算ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        golf: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans JP', 'Plus Jakarta Sans', sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-slate-100 flex flex-col justify-between p-3 sm:p-6">

    <div class="max-w-md w-full mx-auto pt-2 pb-2">
        <header class="text-center mb-4">
            <div class="inline-flex items-center justify-center bg-emerald-500/10 text-emerald-400 p-2.5 rounded-2xl mb-1.5 border border-emerald-500/20 shadow-inner">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
                <span>⛳</span> ゴルフ相乗り精算
            </h1>
            <p class="text-[11px] sm:text-xs text-slate-400 mt-1">ガソリン・高速代を全員でスマート均等割</p>
        </header>

        <main class="bg-slate-800/80 backdrop-blur-md rounded-3xl p-4 sm:p-6 shadow-2xl border border-slate-700/60">
            
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">人数クイック選択</label>
                <div class="grid grid-cols-4 gap-2">
                    <button type="button" onclick="setPeople(2)" class="preset-btn py-2.5 text-sm font-medium bg-slate-700 hover:bg-emerald-600 rounded-xl transition border border-slate-600 text-slate-200 active:scale-95" data-val="2">2人</button>
                    <button type="button" onclick="setPeople(3)" class="preset-btn py-2.5 text-sm font-medium bg-emerald-600 text-white rounded-xl transition border border-emerald-500 shadow-sm active:scale-95" data-val="3">3人</button>
                    <button type="button" onclick="setPeople(4)" class="preset-btn py-2.5 text-sm font-medium bg-slate-700 hover:bg-emerald-600 rounded-xl transition border border-slate-600 text-slate-200 active:scale-95" data-val="4">4人</button>
                    <button type="button" onclick="setPeople(5)" class="preset-btn py-2.5 text-sm font-medium bg-slate-700 hover:bg-emerald-600 rounded-xl transition border border-slate-600 text-slate-200 active:scale-95" data-val="5">5人</button>
                </div>
            </div>

            <div class="space-y-3.5">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1 flex justify-between">
                        <span>合計人数（運転手含む）</span>
                        <span class="text-emerald-400 font-bold"><span id="peopleDisplay">3</span> 名</span>
                    </label>
                    <div class="flex items-center bg-slate-900/80 border border-slate-700 rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-emerald-500 transition">
                        <button type="button" onclick="adjustValue('totalPeople', -1, 1, 15)" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-lg active:bg-slate-600 transition border-r border-slate-700">-</button>
                        <input type="number" id="totalPeople" value="3" min="1" max="15" oninput="updatePeoplePreset(); calculate();" 
                            class="w-full bg-transparent text-center text-white text-base font-semibold focus:outline-none py-3">
                        <button type="button" onclick="adjustValue('totalPeople', 1, 1, 15)" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-lg active:bg-slate-600 transition border-l border-slate-700">+</button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">片道距離 (km)</label>
                    <div class="flex items-center bg-slate-900/80 border border-slate-700 rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-emerald-500 transition">
                        <button type="button" onclick="adjustValue('oneWayDistance', -5, 1, 500)" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-lg active:bg-slate-600 transition border-r border-slate-700">-5</button>
                        <input type="number" id="oneWayDistance" value="120" step="1" oninput="calculate()" 
                            class="w-full bg-transparent text-center text-white text-base font-semibold focus:outline-none py-3">
                        <button type="button" onclick="adjustValue('oneWayDistance', 5, 1, 500)" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-lg active:bg-slate-600 transition border-l border-slate-700">+5</button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">燃費 (km/L)</label>
                    <div class="flex items-center bg-slate-900/80 border border-slate-700 rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-emerald-500 transition">
                        <button type="button" onclick="adjustValue('fuelEfficiency', -0.5, 1, 50)" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-lg active:bg-slate-600 transition border-r border-slate-700">-</button>
                        <input type="number" id="fuelEfficiency" value="10" step="0.5" oninput="calculate()" 
                            class="w-full bg-transparent text-center text-white text-base font-semibold focus:outline-none py-3">
                        <button type="button" onclick="adjustValue('fuelEfficiency', 0.5, 1, 50)" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-lg active:bg-slate-600 transition border-l border-slate-700">+</button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">ガソリン単価 (円/L)</label>
                    <div class="flex items-center bg-slate-900/80 border border-slate-700 rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-emerald-500 transition">
                        <button type="button" onclick="adjustValue('gasPrice', -1, 100, 300)" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-lg active:bg-slate-600 transition border-r border-slate-700">-1</button>
                        <input type="number" id="gasPrice" value="150" step="1" oninput="calculate()" 
                            class="w-full bg-transparent text-center text-white text-base font-semibold focus:outline-none py-3">
                        <button type="button" onclick="adjustValue('gasPrice', 1, 100, 300)" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-lg active:bg-slate-600 transition border-l border-slate-700">+1</button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">高速代 往復合計 (円)</label>
                    <div class="flex items-center bg-slate-900/80 border border-slate-700 rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-emerald-500 transition">
                        <button type="button" onclick="adjustValue('tollFee', -500, 0, 20000)" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs active:bg-slate-600 transition border-r border-slate-700">-500</button>
                        <input type="number" id="tollFee" value="3000" step="100" oninput="calculate()" 
                            class="w-full bg-transparent text-center text-white text-base font-semibold focus:outline-none py-3">
                        <button type="button" onclick="adjustValue('tollFee', 500, 0, 20000)" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs active:bg-slate-600 transition border-l border-slate-700">+500</button>
                    </div>
                </div>
            </div>

            <div id="resultBox" class="mt-5 bg-gradient-to-br from-emerald-950/80 to-slate-900 border border-emerald-500/40 rounded-2xl p-4 sm:p-5 shadow-inner">
                <div class="flex items-center justify-between mb-3 border-b border-emerald-500/20 pb-2.5">
                    <h3 class="font-bold text-emerald-400 flex items-center gap-1.5 text-xs uppercase tracking-wide">
                        <span>📊</span> 精算結果
                    </h3>
                    <span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2.5 py-0.5 rounded-full font-medium border border-emerald-500/30">全員均等割</span>
                </div>

                <div class="space-y-1.5 mb-3.5 text-xs sm:text-sm">
                    <div class="flex justify-between text-slate-300">
                        <span>往復距離:</span>
                        <span class="font-semibold text-white" id="resRoundDistance">240 km</span>
                    </div>
                    <div class="flex justify-between text-slate-300">
                        <span>ガソリン消費・金額:</span>
                        <span class="font-semibold text-white" id="resGasAmount">24.0 L (￥3,600)</span>
                    </div>
                    <div class="flex justify-between text-slate-300">
                        <span>総費用（ガソリン＋高速）:</span>
                        <span class="font-semibold text-emerald-300" id="resTotalCost">￥6,600</span>
                    </div>
                </div>

                <div class="bg-emerald-900/40 border border-emerald-500/30 rounded-xl p-3.5 text-center">
                    <div class="text-xs text-emerald-300 mb-1 font-medium" id="resLabelTarget">全員（3人）での1人あたり負担額</div>
                    <div class="text-3xl font-extrabold text-white tracking-tight" id="resPerPerson">￥2,200 <span class="text-xs font-normal text-emerald-300">/人</span></div>
                    <div class="text-[10px] text-slate-300 mt-1">（運転手も含めて均等割）</div>
                </div>

                <div class="grid grid-cols-2 gap-2 mt-4">
                    <button onclick="copyResult()" class="flex items-center justify-center gap-1.5 py-3.5 px-3 bg-emerald-600 hover:bg-emerald-500 border border-emerald-500 rounded-xl text-xs font-bold transition text-white shadow-lg active:scale-95">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                        <span>LINE用コピー</span>
                    </button>
                    <button onclick="resetForm()" class="flex items-center justify-center gap-1.5 py-3.5 px-3 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white active:scale-95">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        <span>リセット</span>
                    </button>
                </div>
            </div>

        </main>

        <footer class="text-center mt-5 text-[11px] text-slate-500">
            Golf Carpool Settlement Tool &copy; 2026
        </footer>
    </div>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 border border-emerald-500 text-white px-4 py-2.5 rounded-full shadow-2xl text-xs font-semibold opacity-0 pointer-events-none transition-opacity duration-300 flex items-center gap-2 z-50">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="toastMsg">LINE用にコピーしました！</span>
    </div>

    <script>
        function setPeople(num) {
            document.getElementById('totalPeople').value = num;
            updatePeoplePreset();
            calculate();
        }

        function adjustValue(id, amount, min, max) {
            const el = document.getElementById(id);
            let val = parseFloat(el.value) || 0;
            val += amount;
            if (min !== undefined && val < min) val = min;
            if (max !== undefined && val > max) val = max;
            el.value = val;
            if (id === 'totalPeople') {
                updatePeoplePreset();
            }
            calculate();
        }

        function updatePeoplePreset() {
            const val = parseInt(document.getElementById('totalPeople').value) || 3;
            document.getElementById('peopleDisplay').innerText = val;
            
            document.querySelectorAll('.preset-btn').forEach(btn => {
                const btnVal = parseInt(btn.getAttribute('data-val'));
                if (btnVal === val) {
                    btn.className = 'preset-btn py-2.5 text-sm font-medium bg-emerald-600 text-white rounded-xl transition border border-emerald-500 shadow-sm active:scale-95';
                } else {
                    btn.className = 'preset-btn py-2.5 text-sm font-medium bg-slate-700 hover:bg-emerald-600 rounded-xl transition border border-slate-600 text-slate-200 active:scale-95';
                }
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        function calculate() {
            const totalPeople = parseInt(document.getElementById('totalPeople').value) || 1;
            const oneWayDistance = parseFloat(document.getElementById('oneWayDistance').value) || 0;
            const fuelEfficiency = parseFloat(document.getElementById('fuelEfficiency').value) || 1;
            const gasPrice = parseFloat(document.getElementById('gasPrice').value) || 0;
            const tollFee = parseFloat(document.getElementById('tollFee').value) || 0;

            if (totalPeople < 1) {
                document.getElementById('resPerPerson').innerText = '人数は1人以上に設定してください';
                return;
            }

            const roundTripDistance = oneWayDistance * 2;
            const totalGasCost = (roundTripDistance / fuelEfficiency) * gasPrice;
            const totalCost = totalGasCost + tollFee;
            const perPersonCost = Math.round(totalCost / totalPeople);

            document.getElementById('resRoundDistance').innerText = `${roundTripDistance.toLocaleString()} km`;
            document.getElementById('resGasAmount').innerText = `${(roundTripDistance / fuelEfficiency).toFixed(1)} L (￥${Math.round(totalGasCost).toLocaleString()})`;
            document.getElementById('resTotalCost').innerText = `￥${Math.round(totalCost).toLocaleString()}`;
            document.getElementById('resLabelTarget').innerText = `全員（${totalPeople}人）での1人あたり負担額`;
            document.getElementById('resPerPerson').innerHTML = `￥${perPersonCost.toLocaleString()} <span class="text-xs font-normal text-emerald-300">/人</span>`;
        }

        function copyResult() {
            const totalPeople = document.getElementById('totalPeople').value;
            const oneWayDistance = document.getElementById('oneWayDistance').value;
            const roundTripDistance = oneWayDistance * 2;
            const fuelEfficiency = document.getElementById('fuelEfficiency').value;
            const gasPrice = document.getElementById('gasPrice').value;
            const tollFee = document.getElementById('tollFee').value;
            
            const totalGasCost = Math.round((roundTripDistance / fuelEfficiency) * gasPrice);
            const totalCost = totalGasCost + Number(tollFee);
            const perPersonCost = Math.round(totalCost / totalPeople);
            
            const text = `⛳ ゴルフ相乗り精算のご案内\n` +
                         `━━━━━━━━━━━━\n` +
                         `👥 合計人数: ${totalPeople}人 (全員均等割)\n` +
                         `🚗 走行距離: 往復 ${roundTripDistance}km (片道${oneWayDistance}km)\n` +
                         `⛽ 燃費: ${fuelEfficiency}km/L ｜ 単価: ${gasPrice}円/L\n` +
                         `━━━━━━━━━━━━\n` +
                         `💰 【費用の内訳】\n` +
                         `• ガソリン代: ￥${totalGasCost.toLocaleString()}\n` +
                         `• 高速代(往復): ￥${Number(tollFee).toLocaleString()}\n` +
                         `• 総費用合計: ￥${totalCost.toLocaleString()}\n` +
                         `━━━━━━━━━━━━\n` +
                         `💵 【1人あたりの精算額】\n` +
                         `👉 【 ￥${perPersonCost.toLocaleString()} 】 /人\n` +
                         `よろしくお願いいたします！`;

            const textArea = document.createElement('textarea');
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast('LINE用の精算結果をコピーしました！');
            } catch (err) {
                showToast('コピーに失敗しました');
            }
            document.body.removeChild(textArea);
        }

        function resetForm() {
            document.getElementById('totalPeople').value = 3;
            document.getElementById('oneWayDistance').value = 120;
            document.getElementById('fuelEfficiency').value = 10;
            document.getElementById('gasPrice').value = 150;
            document.getElementById('tollFee').value = 3000;
            updatePeoplePreset();
            calculate();
            showToast('初期値にリセットしました');
        }

        window.onload = function() {
            updatePeoplePreset();
            calculate();
        };
    </script>
</body>
</html>
